<svg xmlns="http://www.w3.org/2000/svg" width="480" height="550" viewBox="0 0 480 550" role="img" aria-labelledby="title desc"><title id="title">SURVIVAL DRIVES COPIED BYTES</title><desc id="desc">SURVIVAL DRIVES COPIED BYTES. Live blocks are blue and named; dead or free blocks have explicit labels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="550" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="36" font-size="20" fill="#334155">SURVIVAL DRIVES COPIED BYTES</text><text x="30" y="85" font-size="18" fill="#334155">Each region: 1,000 MB occupied</text><text x="30" y="135" font-size="18" fill="#334155">A · 50 MB live / 950 MB dead</text><rect x="30" y="155" width="420" height="40" rx="5" fill="#fff" stroke="#94a3b8"/><rect x="30" y="155" width="21.0" height="40" fill="#315dcc"/><text x="30" y="230" font-size="18" fill="#334155">Copy 50 MB of survivors</text><text x="30" y="280" font-size="18" fill="#334155">B · 950 MB live / 50 MB dead</text><rect x="30" y="300" width="420" height="40" rx="5" fill="#fff" stroke="#94a3b8"/><rect x="30" y="300" width="399.0" height="40" fill="#315dcc"/><text x="30" y="375" font-size="18" fill="#334155">Copy 950 MB of survivors</text><text x="30" y="440" font-size="18" fill="#334155">B copies 19× as many bytes as A.</text><text x="30" y="484" font-size="17" fill="#334155">Both still scan roots and references.</text><text x="30" y="517" font-size="17" fill="#334155">Not a prediction of total GC time.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">One interval, three diagnostic phases</title><desc id="desc">Illustrative reaching 18 ms, at safepoint 4 ms, leaving 0.1 ms; total 22.1 ms.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">One interval, three diagnostic phases</text><rect class="gold" x="75" y="165" width="680" height="160" rx="14"/><rect class="teal" x="755" y="165" width="215" height="160" rx="14"/><rect class="rose" x="970" y="165" width="40" height="160" rx="10"/><text class="head" x="415" y="225" text-anchor="middle">Reaching safepoint</text><text class="body" x="415" y="270" text-anchor="middle">18 ms · waiting for threads</text><text class="head" x="860" y="225" text-anchor="middle">At safepoint</text><text class="body" x="860" y="270" text-anchor="middle">4 ms · VM work</text><text class="body" x="840" y="390" text-anchor="middle">Leaving: 0.1 ms</text><text class="head" x="540" y="455" text-anchor="middle">Total interval: 22.1 ms</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Logical Young and Old</title><desc id="desc">New objects enter Young. Many die quickly; survivors can remain Young or tenure into Old as ZGC adapts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Logical Young and Old</text><rect x="48" y="152" width="185" height="115" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="140.5" y="202.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Allocate</text><text x="140.5" y="228.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">new objects</text><path d="M240 210 L286 210" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="294" y="152" width="250" height="115" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="419.0" y="202.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Young</text><text x="419.0" y="228.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">many die; some survive</text><path d="M551 210 L597 210" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><text x="574.0" y="198.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#183047">tenure</text><rect x="605" y="152" width="245" height="115" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="727.5" y="202.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Old</text><text x="727.5" y="228.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">longer-lived objects</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">Generation sizing and tenuring adapt to the workload.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="title desc"><title id="title">More runnable tasks ≠ more CPUs</title><desc id="desc">One hundred thousand CPU-bound virtual threads still depend on a finite set of carriers and eight illustrative CPU execution slots.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="470" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">More runnable tasks ≠ more CPUs</text><rect x="93" y="80" width="454" height="75" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="111.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">100,000 CPU-bound tasks</text><text x="320.0" y="137.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Runnable work needs CPU time</text><path d="M320 155 L320 201" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="151" y="201" width="338" height="65" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="240.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Available carrier threads</text><path d="M320 266 L320 313" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="75.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">1</text><rect x="114" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="145.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">2</text><rect x="184" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="215.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">3</text><rect x="254" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="285.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">4</text><rect x="324" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="355.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">5</text><rect x="394" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="425.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">6</text><rect x="464" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="495.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">7</text><rect x="534" y="313" width="62" height="62" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="565.0" y="351.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">8</text><text x="320" y="408" text-anchor="middle" font-size="21" font-weight="700" fill="#243247">8 illustrative execution slots</text><text x="320" y="441" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">Waiting scales; processor capacity stays finite.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">The forwarding insertion chooses one copy</title><desc id="desc">Two candidates race; insertion returns one destination and the losing allocation is undone.</desc>
<rect class="bg" width="1080" height="450" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#243247}.bg{fill:#f7f9fc}.heading{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.box{fill:#fff;stroke:#bdcad9;stroke-width:2}.accent{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.warn{fill:#fff1db;stroke:#b68a46;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#789;stroke-width:2;stroke-dasharray:8 6}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#52667e}.accent{fill:#213f3d;stroke:#73b1a7}.warn{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.line{stroke:#a9b9cd}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#526477" stroke-width="1.7"/></marker></defs>
<text class="heading" x="44" y="55">The forwarding insertion chooses one copy</text><rect class="box" x="45" y="105" width="290" height="140" rx="16"/><text class="label" x="65" y="141">Thread A</text><text class="body" x="65" y="177">candidate at 0x5000</text><rect class="box" x="45" y="280" width="290" height="140" rx="16"/><text class="label" x="65" y="316">Thread B</text><text class="body" x="65" y="352">candidate at 0x7000</text><path class="line" d="M335 175 L440 228"/><path class="line" d="M335 350 L440 280"/><rect class="accent" x="445" y="190" width="230" height="155" rx="16"/><text class="label" x="465" y="226">Atomic insert</text><text class="body" x="465" y="262">0x1000 → 0x5000</text><path class="line" d="M675 265 L745 185"/><path class="line" d="M675 300 L745 355"/><rect class="accent" x="750" y="105" width="280" height="135" rx="16"/><text class="label" x="770" y="141">Canonical</text><text class="body" x="770" y="177">use 0x5000</text><rect class="warn" x="750" y="280" width="280" height="135" rx="16"/><text class="label" x="770" y="316">Loser</text><text class="body" x="770" y="352">undo 0x7000 allocation</text></svg>
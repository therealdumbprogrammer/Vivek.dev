<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">An eliminated Order may become an object</title><desc id="desc">A scalar amount value can be used to reallocate Order if resumed interpreter state requires it.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">An eliminated Order may become an object</text><rect class="gold" x="65" y="125" width="380" height="275" rx="15"/><text class="head" x="255" y="180" text-anchor="middle">Optimized representation</text><text class="body" x="255" y="235" text-anchor="middle">amount = 42</text><text class="body" x="255" y="280" text-anchor="middle">no heap Order required</text><path class="line" d="M445 260H615"/><text class="small" x="530" y="240" text-anchor="middle">if recovery needs it</text><rect class="teal" x="615" y="125" width="400" height="275" rx="15"/><text class="head" x="815" y="180" text-anchor="middle">Interpreter-visible state</text><rect class="box" x="700" y="215" width="230" height="105" rx="12"/><text class="head" x="815" y="255" text-anchor="middle">Order object</text><text class="body" x="815" y="290" text-anchor="middle">amount = 42</text><text class="small" x="540" y="465" text-anchor="middle">An object is materialized only when the continuation requires it</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Two evacuation failure reasons</title><desc id="desc">Allocation means no destination space; Pinned means native critical access prevents movement.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Two evacuation failure reasons</text><rect x="100.0" y="145" width="220.0" height="145" rx="15" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="210.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Allocation</text><text x="210.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">no destination</text><path d="M323.0 217 L335.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="340.0" y="145" width="220.0" height="145" rx="15" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Pinned</text><text x="450.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">cannot move</text><path d="M563.0 217 L575.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="580.0" y="145" width="220.0" height="145" rx="15" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="690.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Failed region</text><text x="690.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">kept temporarily</text></svg>

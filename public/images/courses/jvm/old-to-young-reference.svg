<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">THE PATH CROSSES OLD MEMORY</title><desc id="desc">A root reaches an old Customer, whose latestOrder field reaches a young Order. Young GC must account for that incoming reference.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">THE PATH CROSSES OLD MEMORY</text><text x="24" y="68" font-size="17">GC root</text><rect x="24.0" y="80" width="426.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="108" text-anchor="middle" font-size="17">root reference</text><path d="M240 130 L240 150" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="173" font-size="17">Old generation</text><rect x="24.0" y="185" width="426.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="213" text-anchor="middle" font-size="17">Customer.latestOrder</text><path d="M240 235 L240 255" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="278" font-size="17">Young generation</text><rect x="24.0" y="290" width="426.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="318" text-anchor="middle" font-size="17">Order · must survive</text><text x="24" y="415" font-size="16">Collecting young does not mean ignoring Old.</text></g></svg>
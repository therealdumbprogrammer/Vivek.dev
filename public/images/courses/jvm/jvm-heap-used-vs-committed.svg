<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">Heap used and committed after an allocation burst</title><desc id="desc">Used heap returns to 400 megabytes while committed capacity remains 3.5 gigabytes.</desc><rect class="bg" width="1080" height="500" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dashed{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.tiny{font-size:16px}.heapline{stroke:#528a80;stroke-width:6;fill:none}.rssline{stroke:#b8776c;stroke-width:6;fill:none}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dashed{stroke:#92a9bf}.heapline{stroke:#83bfb4}.rssline{stroke:#e0a499}}</style><text class="title" x="42" y="60">A burst can leave heap capacity committed</text><rect class="box" x="55" y="112" width="300" height="297" rx="14"/><text class="head" x="75" y="151">Before burst</text><text class="body" x="75" y="195">Used heap</text><rect class="teal" x="75" y="211" width="68" height="31" rx="4"/><text class="body" x="75" y="273">400 MB</text><text class="body" x="75" y="316">Committed capacity</text><rect class="gold" x="75" y="333" width="38" height="31" rx="4"/><text class="body" x="75" y="393">512 MB</text><rect class="box" x="385" y="112" width="300" height="297" rx="14"/><text class="head" x="405" y="151">During burst</text><text class="body" x="405" y="195">Used heap</text><rect class="teal" x="405" y="211" width="255" height="31" rx="4"/><text class="body" x="405" y="273">3.0 GB</text><text class="body" x="405" y="316">Committed capacity</text><rect class="gold" x="405" y="333" width="255" height="31" rx="4"/><text class="body" x="405" y="393">3.5 GB</text><rect class="box" x="715" y="112" width="300" height="297" rx="14"/><text class="head" x="735" y="151">After GC</text><text class="body" x="735" y="195">Used heap</text><rect class="teal" x="735" y="211" width="68" height="31" rx="4"/><text class="body" x="735" y="273">400 MB</text><text class="body" x="735" y="316">Committed capacity</text><rect class="gold" x="735" y="333" width="255" height="31" rx="4"/><text class="body" x="735" y="393">3.5 GB</text><text class="small" x="48" y="465">Object reclamation reduces used heap; uncommit follows collector policy and timing.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">Scan survivor root regions</title><desc id="desc">Young survivors can be starting points for Old marking.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="440" rx="22" class="bg"/><text x="36" y="51" class="title">Scan survivor root regions</text><text x="36" y="81" class="sub">Young survivors can be starting points for Old marking.</text><rect x="36" y="135" width="280" height="210" rx="18" class="blue"/><text x="56" y="172" class="head">Concurrent Start</text><text x="56" y="209" class="body">young STW pause</text><text x="56" y="237" class="body">marking snapshot begins</text><rect x="400" y="135" width="280" height="210" rx="18" class="amber"/><text x="420" y="172" class="head">Survivor roots</text><text x="420" y="209" class="body">Customer → Old Account</text><text x="420" y="237" class="body">scan before young move</text><rect x="764" y="135" width="280" height="210" rx="18" class="mint"/><text x="784" y="172" class="head">Concurrent Mark</text><text x="784" y="209" class="body">follow Old references</text><text x="784" y="237" class="body">mutators keep running</text><path d="M322 240 L394 240" class="line" marker-end="url(#arrow)"/><path d="M686 240 L758 240" class="line" marker-end="url(#arrow)"/><text x="36" y="398" class="small">Root-region scanning is marking setup; each young pause has its own CSet-root work.</text></svg>
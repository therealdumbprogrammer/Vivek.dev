<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 618" role="img" aria-labelledby="title desc"><title id="title">Four heap quantities</title><desc id="desc">Each layer answers a different question.</desc><rect width="600" height="618" fill="#f8fafc"/><text x="300" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183047">Four heap quantities</text><rect x="28" y="105" width="544" height="96" rx="16" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="48" y="140" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Maximum capacity: Xmx</text><text x="48" y="176" font-family="Arial,sans-serif" font-size="21" fill="#183047">8 GB virtual ceiling</text><rect x="28" y="217" width="544" height="96" rx="16" fill="#e8f4e7" stroke="#91a3b3" stroke-width="2"/><text x="48" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Committed heap</text><text x="48" y="288" font-family="Arial,sans-serif" font-size="21" fill="#183047">5 GB available to JVM</text><rect x="28" y="329" width="544" height="96" rx="16" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="48" y="364" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Current occupancy</text><text x="48" y="400" font-family="Arial,sans-serif" font-size="21" fill="#183047">4 GB holding objects now</text><rect x="28" y="441" width="544" height="96" rx="16" fill="#e5e3f5" stroke="#91a3b3" stroke-width="2"/><text x="48" y="476" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Live set</text><text x="48" y="512" font-family="Arial,sans-serif" font-size="21" fill="#183047">3 GB must survive collection</text></svg>
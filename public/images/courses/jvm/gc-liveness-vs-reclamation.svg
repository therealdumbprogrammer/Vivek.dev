<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Liveness informs recovery</title><desc id="desc">The same live set permits different free-space layouts.</desc>

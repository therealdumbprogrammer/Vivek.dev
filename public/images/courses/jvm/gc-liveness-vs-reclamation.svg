<text x="30" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">Liveness informs recovery</text>
<rect x="35.0" y="145" width="258.0" height="155" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="164.0" y="213.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Roots + metadata</text><text x="164.0" y="242.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">starting references</text><path d="M297.0 222.5 L316.0 222.5" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="321.0" y="145" width="258.0" height="155" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="450.0" y="213.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Trace live graph</text><text x="450.0" y="242.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">survivors identified</text><path d="M583.0 222.5 L602.0 222.5" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="607.0" y="145" width="258.0" height="155" rx="14" fill="#fff2d8" stroke="#9aafc2" stroke-width="2"/><text x="736.0" y="213.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Space strategy</text><text x="736.0" y="242.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">holes · dense tail · regions</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" role="img" aria-labelledby="title desc"><title id="title">The stack survives unmounting</title><desc id="desc">During execution V1 uses its carrier native stack. Suspension preserves required execution state in dynamically managed heap stack chunks; it is not one fixed chunk forever.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="478" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">The stack survives unmounting</text><rect x="36" y="90" width="240" height="72" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="156.0" y="120.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">While V1 runs</text><text x="156.0" y="146.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Carrier native stack</text><rect x="36" y="182" width="240" height="116" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="156.0" y="221.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Request frame</text><text x="156.0" y="247.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Load-customer frame</text><text x="156.0" y="273.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Read frame</text><rect x="335" y="78" width="271" height="302" rx="17" fill="#f3f4f6" stroke="#94a0af" stroke-width="2"/><text x="470" y="110" text-anchor="middle" font-size="22" font-weight="700" fill="#243247">Java heap</text><rect x="359" y="139" width="223" height="75" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="470.5" y="170.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Saved stack chunk</text><text x="470.5" y="196.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Frame state</text><path d="M470 214 L470 249" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="359" y="249" width="223" height="75" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="470.5" y="280.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Another chunk</text><text x="470.5" y="306.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">As needed</text><path d="M278 220 L331 220" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="417" text-anchor="middle" font-size="17" font-weight="400" fill="#243247">Suspension preserves required state; resumption restores it.</text><text x="320" y="450" text-anchor="middle" font-size="19" font-weight="400" fill="#243247">Chunk count and size change with stack needs.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">DIRECT BUFFER ALLOCATION</title><desc id="desc">A conceptual JDK allocation path reserves capacity, obtains native memory, initializes it, creates a wrapper and registers cleanup.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="900" height="450" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="450" y="48" class="title" text-anchor="middle">DIRECT BUFFER ALLOCATION</text><rect x="20" y="72" width="860" height="320" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30.0" y="120" width="199.5" height="235" rx="16" fill="#e8efff" stroke="#4968b5" stroke-width="1.5"/><text x="129.8" y="154" class="head" text-anchor="middle">1 · RESERVE</text><text x="129.8" y="202" class="body" text-anchor="middle">capacity budget</text><path d="M 231.5 237.5 H 241.5" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="243.5" y="120" width="199.5" height="235" rx="16" fill="#eef5f4" stroke="#4d827a" stroke-width="1.5"/><text x="343.2" y="154" class="head" text-anchor="middle">2 · ALLOCATE</text><text x="343.2" y="202" class="body" text-anchor="middle">native bytes</text><path d="M 445.0 237.5 H 455.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="457.0" y="120" width="199.5" height="235" rx="16" fill="#fff2df" stroke="#b77935" stroke-width="1.5"/><text x="556.8" y="154" class="head" text-anchor="middle">3 · INITIALIZE</text><text x="556.8" y="202" class="body" text-anchor="middle">zero / prepare</text><path d="M 658.5 237.5 H 668.5" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="670.5" y="120" width="199.5" height="235" rx="16" fill="#e8efff" stroke="#4968b5" stroke-width="1.5"/><text x="770.2" y="154" class="head" text-anchor="middle">4 · WRAP + CLEAN</text><text x="770.2" y="202" class="body" text-anchor="middle">Java object</text><text x="770.2" y="232" class="body" text-anchor="middle">cleanup action</text><text x="450" y="425" class="foot" text-anchor="middle">Conceptual path · implementation details vary</text></g><style>.title{font-size:20px;font-weight:700;letter-spacing:.3px}.head{font-size:16px;font-weight:650}.body{font-size:14px}.foot{font-size:13px;fill:#58677d}</style></svg>
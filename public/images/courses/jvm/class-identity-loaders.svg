<svg xmlns="http://www.w3.org/2000/svg" width="480" height="455" viewBox="0 0 480 455" role="img" aria-labelledby="title desc">
<title id="title">NAME + DEFINING LOADER</title><desc id="desc">Independent defining loaders create distinct types; shared delegation can use one type.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="455" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">NAME + DEFINING LOADER</text><rect x="36" y="72" width="408" height="60" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="95.5" font-size="16" text-anchor="middle">Same binary name:</text><text x="240.0" y="118.5" font-size="16" text-anchor="middle">com.example.Customer</text><path d="M140 133 L130 174" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><path d="M340 133 L350 174" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="24" y="179" width="205" height="65" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="126.5" y="216.5" font-size="16" text-anchor="middle">Defining Loader A</text><rect x="251" y="179" width="205" height="65" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="353.5" y="216.5" font-size="16" text-anchor="middle">Defining Loader B</text><path d="M126 245 L126 282" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><path d="M353 245 L353 282" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="24" y="287" width="205" height="75" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="126.5" y="318.0" font-size="16" text-anchor="middle">Runtime type A</text><text x="126.5" y="341.0" font-size="16" text-anchor="middle">Class mirror A</text><rect x="251" y="287" width="205" height="75" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="353.5" y="318.0" font-size="16" text-anchor="middle">Runtime type B</text><text x="353.5" y="341.0" font-size="16" text-anchor="middle">Class mirror B</text><text x="240" y="399" font-size="20" text-anchor="middle">Type A ≠ Type B</text><text x="240" y="432" font-size="15" text-anchor="middle">Delegating to one definition can share a type.</text></g></svg>
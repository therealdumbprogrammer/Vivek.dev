<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">TWO COOPERATING SYSTEMS</title><desc id="desc">The mutator maintains useful metadata so the collector can narrow its search.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">TWO COOPERATING SYSTEMS</text><rect x="24" y="65" width="430" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="98.5" font-size="17">Mutator changes a reference</text><path d="M240 124 L240 147" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="155" width="430" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="188.5" font-size="17">Write barrier records the change</text><path d="M240 214 L240 237" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="245" width="430" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="278.5" font-size="17">GC metadata: cards / remembered sets</text><path d="M240 304 L240 327" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="335" width="430" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="368.5" font-size="17">Collector scans less memory</text></g></svg>
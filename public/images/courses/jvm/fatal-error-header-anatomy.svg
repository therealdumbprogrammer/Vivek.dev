</style><text x="38" y="48" class="title" text-anchor="start">Read the fatal-error header first</text><text x="38" y="73" class="sub" text-anchor="start">Illustrative hs_err fields</text><rect x="38.0" y="130" width="265.3333333333333" height="220" rx="16" class="accent"/><text x="56.0" y="161" class="head" text-anchor="start">Signal</text><text x="56.0" y="189" class="body" text-anchor="start">SIGSEGV describes the reported</text><text x="56.0" y="210" class="body" text-anchor="start">fault</text><rect x="317.3333333333333" y="130" width="265.3333333333333" height="220" rx="16" class="mint"/><text x="335.3333333333333" y="161" class="head" text-anchor="start">pc / pid / tid</text><text x="335.3333333333333" y="189" class="body" text-anchor="start">Instruction, process and thread</text><text x="335.3333333333333" y="210" class="body" text-anchor="start">identity</text><rect x="596.6666666666666" y="130" width="265.3333333333333" height="220" rx="16" class="amber"/><text x="614.6666666666666" y="161" class="head" text-anchor="start">Problematic frame</text><text x="614.6666666666666" y="189" class="body" text-anchor="start">C [libcompress.so+offset]</text><text x="614.6666666666666" y="210" class="body" text-anchor="start">locates the fault</text></svg>
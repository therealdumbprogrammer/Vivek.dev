<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Read the fatal-error header first</title><desc id="desc">Illustrative hs_err fields</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#74869b"/></marker></defs><rect width="900" height="450" rx="22" class="bg" fill="#f7f9fc"/><style>

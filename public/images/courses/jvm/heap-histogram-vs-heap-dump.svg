<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Population and retention</title><desc id="desc">The next question determines the evidence</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="430" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">Population and retention</text><text x="36" y="74" class="sub">Both commands can have high production impact in JDK 25.</text><rect x="36" y="110" width="420" height="264" rx="15" class="accent"/><text x="54" y="140" class="head">Class histogram</text><text x="54" y="166" class="body">Order       700,000 instances</text><text x="54" y="186" class="body">byte[]      600 MB shallow</text><text x="54" y="206" class="body">Answers: how many, which classes?</text><text x="54" y="226" class="body">No reference paths to roots.</text><rect x="504" y="110" width="420" height="264" rx="15" class="amber"/><text x="522" y="140" class="head">Heap dump</text><text x="522" y="166" class="body">GC root → cache → map → Order</text><text x="522" y="186" class="body">Dominator and retained size</text><text x="522" y="206" class="body">Answers: who retains objects?</text><text x="522" y="226" class="body">High disk and collection cost.</text></svg>
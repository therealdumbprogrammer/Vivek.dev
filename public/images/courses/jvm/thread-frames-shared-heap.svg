<svg xmlns="http://www.w3.org/2000/svg" width="480" height="495" viewBox="0 0 480 495" role="img" aria-labelledby="title desc"><title id="title">PRIVATE FRAMES, SHARED OBJECT</title><desc id="desc">Thread A and Thread B have separate process frames whose local references point to one heap Customer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="495" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">PRIVATE FRAMES, SHARED OBJECT</text><rect x="20" y="80" width="210" height="124" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="125.0" y="124.0" font-size="16" text-anchor="middle">Thread A</text><text x="125.0" y="148.0" font-size="16" text-anchor="middle">process() frame</text><text x="125.0" y="172.0" font-size="16" text-anchor="middle">local reference</text><rect x="250" y="80" width="210" height="124" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="355.0" y="124.0" font-size="16" text-anchor="middle">Thread B</text><text x="355.0" y="148.0" font-size="16" text-anchor="middle">process() frame</text><text x="355.0" y="172.0" font-size="16" text-anchor="middle">local reference</text><path d="M125 210 L208 307" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><path d="M355 210 L272 307" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="313" width="332" height="106" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="360.0" font-size="16" text-anchor="middle">Shared heap</text><text x="240.0" y="384.0" font-size="16" text-anchor="middle">one Customer object</text><text x="240" y="455" font-size="16" text-anchor="middle">Field mutation reaches the same object.</text><text x="240" y="477" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
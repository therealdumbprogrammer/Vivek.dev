<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">A TLAB miss has several outcomes</title><desc id="desc">Fast path, refill, outside-TLAB path, then heap-pressure handling if necessary.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:1.5}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:1.5}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:1.5}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:1.5}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:1.5}.line{fill:none;stroke:#7b8ba0;stroke-width:2}.dash{fill:none;stroke:#8898aa;stroke-width:1.5;stroke-dasharray:6 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}.tag{font-size:16px;font-weight:700;letter-spacing:.06em;fill:#466189}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.tag{fill:#a9c2ef}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="510" rx="22" class="bg"/><text x="36" y="49" class="title">A TLAB miss has several outcomes</text><text x="36" y="77" class="sub">Fast path, refill, outside-TLAB path, then heap-pressure handling if necessary.</text><rect x="36" y="130" width="270" height="210" rx="15" class="blue"/><text x="54" y="161" class="head">Try current TLAB</text><text x="54" y="190" class="body">top + size ≤ end?</text><text x="54" y="216" class="body">thread-local fast path</text><rect x="405" y="130" width="270" height="210" rx="15" class="mint"/><text x="423" y="161" class="head">Refill TLAB</text><text x="423" y="190" class="body">obtain fresh space</text><text x="423" y="216" class="body">then allocate</text><rect x="774" y="130" width="270" height="210" rx="15" class="amber"/><text x="792" y="161" class="head">Outside TLAB</text><text x="792" y="190" class="body">large / unsuitable</text><text x="792" y="216" class="body">collector-backed path</text><path d="M306 200 L403 200" class="line" marker-end="url(#arrow)"/><path d="M306 265 L772 265" class="line" marker-end="url(#arrow)"/><text x="341" y="188" class="small">no fit</text><text x="512" y="253" class="small">alternative</text><rect x="263" y="390" width="554" height="76" rx="15" class="card"/><text x="281" y="421" class="head">Heap pressure</text><text x="281" y="450" class="body">Only a later failed space request may require collection.</text><path d="M540 340 L540 388" class="dash" marker-end="url(#arrow)"/></svg>
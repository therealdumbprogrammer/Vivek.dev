<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Shared thread-local polling infrastructure</title><desc id="desc">Global safepoints arm all relevant local polls while handshakes arm selected polls, and both enter runtime processing.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">One polling mechanism, different scope</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="55" y="105" width="255" height="105" rx="18" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="183" y="148" font-size="21" font-weight="700" fill="#4d3475">Global safepoint</text><text x="183" y="180" font-size="18" fill="#4d3475">arm every relevant thread</text><rect x="650" y="105" width="255" height="105" rx="18" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="778" y="148" font-size="21" font-weight="700" fill="#185b42">Handshake</text><text x="778" y="180" font-size="18" fill="#244c3d">arm selected thread(s)</text><rect x="235" y="290" width="490" height="115" rx="20" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="480" y="333" font-size="22" font-weight="700" fill="#7a4614">Per-JavaThread polling state</text><text x="480" y="369" font-size="18" fill="#54391d">request becomes visible at a suitable poll</text><rect x="310" y="475" width="340" height="72" rx="17" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="480" y="519" font-size="20" font-weight="700" fill="#243c65">Runtime processes requested work</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M183 210C183 260 315 255 350 290"/><path d="M778 210C778 260 645 255 610 290"/><path d="M480 405V475"/></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-labelledby="title desc"><title id="title">ONE INVOCATION, ONE FRAME</title><desc id="desc">An add invocation contains indexed locals, its own operand stack, and a runtime constant-pool reference.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="470" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">ONE INVOCATION, ONE FRAME</text><rect x="24" y="64" width="432" height="360" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="94" font-size="16" text-anchor="middle">add(10, 20) frame</text><rect x="48" y="114" width="384" height="76" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="146.0" font-size="16" text-anchor="middle">Local-variable array</text><text x="240.0" y="170.0" font-size="16" text-anchor="middle">receiver · arguments · temporary slots</text><rect x="48" y="204" width="384" height="76" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="236.0" font-size="16" text-anchor="middle">Operand stack</text><text x="240.0" y="260.0" font-size="16" text-anchor="middle">values consumed and produced</text><rect x="48" y="294" width="384" height="96" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="324.0" font-size="16" text-anchor="middle">Runtime constant-pool reference</text><text x="240.0" y="348.0" font-size="16" text-anchor="middle">access to the current method’s</text><text x="240.0" y="372.0" font-size="16" text-anchor="middle">containing class’s runtime pool</text><text x="240" y="452" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">AVAILABLE EXECUTION STATES</title><desc id="desc">Levels zero through four describe interpretation, three C1 profiling modes, and C2. They are not a mandatory staircase.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">AVAILABLE EXECUTION STATES</text><rect x="25" y="60" width="430" height="50" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="91.0" font-size="16" text-anchor="middle">0  ·  Interpreter</text><rect x="25" y="125" width="430" height="50" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="156.0" font-size="16" text-anchor="middle">1  ·  C1 without profiling</text><rect x="25" y="190" width="430" height="50" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="221.0" font-size="16" text-anchor="middle">2  ·  C1 with limited profiling</text><rect x="25" y="255" width="430" height="50" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="286.0" font-size="16" text-anchor="middle">3  ·  C1 with full profiling</text><rect x="25" y="320" width="430" height="50" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="351.0" font-size="16" text-anchor="middle">4  ·  C2 optimized code</text><text x="240" y="414" font-size="17" text-anchor="middle">Example path: 0 → 3 → 4</text><text x="240" y="441" font-size="14" text-anchor="middle">Other paths depend on policy and queues.</text><text x="240" y="478" font-size="13" text-anchor="middle">Rows are states · no mandatory step-by-step climb</text></g></svg>

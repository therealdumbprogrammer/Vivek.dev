<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc"><title id="title">One G1 evacuation pause</title><desc id="desc">JDK 25 phase names correspond to real log timings.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="450" rx="22" class="bg"/><text x="36" y="51" class="title">One G1 evacuation pause</text><text x="36" y="81" class="sub">JDK 25 phase names correspond to real log timings.</text><rect x="36" y="130" width="235" height="185" rx="18" class="blue"/><text x="56" y="167" class="head">Pre Evacuate</text><text x="56" y="204" class="body">disconnect TLABs</text><text x="56" y="232" class="body">select CSet</text><rect x="294" y="130" width="235" height="185" rx="18" class="amber"/><text x="314" y="167" class="head">Merge Heap Roots</text><text x="314" y="204" class="body">combine incoming</text><text x="314" y="232" class="body">remembered data</text><rect x="552" y="130" width="235" height="185" rx="18" class="mint"/><text x="572" y="167" class="head">Evacuate CSet</text><text x="572" y="204" class="body">trace roots</text><text x="572" y="232" class="body">copy live objects</text><rect x="810" y="130" width="235" height="185" rx="18" class="blue"/><text x="830" y="167" class="head">Post Evacuate</text><text x="830" y="204" class="body">reference work</text><text x="830" y="232" class="body">region bookkeeping</text><path d="M274 218 L289 218" class="line" marker-end="url(#arrow)"/><path d="M532 218 L547 218" class="line" marker-end="url(#arrow)"/><path d="M790 218 L805 218" class="line" marker-end="url(#arrow)"/><text x="36" y="383" class="small">Mutators are stopped across these phase groups.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">A long-running loop with a safepoint opportunity</title><desc id="desc">The loop can repeat cheaply or leave the loop path to cooperate when a request is pending.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">A hot loop still needs a coordination path</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="110" y="145" width="275" height="90" rx="18" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="247" y="182" font-size="21" font-weight="700" fill="#172033">optimized loop body</text><text x="247" y="211" font-size="17" fill="#475569">calculate · update · branch</text><rect x="110" y="350" width="275" height="90" rx="18" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="247" y="388" font-size="20" font-weight="700" fill="#7a4614">safepoint opportunity</text><text x="247" y="417" font-size="17" fill="#54391d">request pending?</text><rect x="575" y="180" width="280" height="110" rx="18" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="715" y="223" font-size="21" font-weight="700" fill="#4d3475">HotSpot runtime</text><text x="715" y="255" font-size="18" fill="#4d3475">cooperate with request</text><text x="247" y="520" font-size="18" fill="#185b42">no request → backward edge → repeat</text></g><path d="M247 235V350" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M385 395C500 395 520 235 575 235" fill="none" stroke="#7555a7" stroke-width="4" marker-end="url(#a)"/><path d="M190 440C75 500 60 190 110 190" fill="none" stroke="#328361" stroke-width="4" marker-end="url(#a)"/><g font-family="system-ui,sans-serif" font-size="18" font-weight="700"><text x="475" y="345" fill="#4d3475">yes</text><text x="88" y="330" fill="#185b42">no</text></g>
</svg>

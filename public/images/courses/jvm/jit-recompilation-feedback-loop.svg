<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Changing workload can repeat adaptation</title><desc id="desc">Regular, premium and mixed phases may drive compilation, traps and recompilation; no one transition is guaranteed.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">Changing workload can repeat adaptation</text><rect class="teal" x="65" y="135" width="250" height="135" rx="15"/><text class="head" x="190" y="185" text-anchor="middle">Regular phase</text><text class="body" x="190" y="225" text-anchor="middle">profile + compile</text><path class="line" d="M315 202H405"/><rect class="gold" x="405" y="135" width="250" height="135" rx="15"/><text class="head" x="530" y="185" text-anchor="middle">Premium phase</text><text class="body" x="530" y="225" text-anchor="middle">possible trap</text><path class="line" d="M655 202H745"/><rect class="rose" x="745" y="135" width="270" height="135" rx="15"/><text class="head" x="880" y="185" text-anchor="middle">Mixed phase</text><text class="body" x="880" y="225" text-anchor="middle">possible recompile</text><path class="dash" d="M880 270V385H190V270"/><text class="body" x="540" y="365" text-anchor="middle">repeated phase changes can repeat compiler work</text><text class="small" x="540" y="460" text-anchor="middle">Correlate with JFR, CPU, throughput and Code Cache evidence</text></svg>
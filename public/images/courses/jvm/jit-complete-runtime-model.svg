<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc"><title id="title">From profile to later execution</title><desc id="desc">Compilation needs both CPU time and room to install generated code</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#24354b}.bg{fill:#f8fafc}.card{fill:#fff;stroke:#aebed0;stroke-width:2}.blue{fill:#e8f0fc;stroke:#6685b0;stroke-width:2}.teal{fill:#e5f4ef;stroke:#5d9b89;stroke-width:2}.amber{fill:#fff3df;stroke:#bd9654;stroke-width:2}.rose{fill:#f9ecee;stroke:#bc7f89;stroke-width:2}.line{stroke:#657b95;stroke-width:3;fill:none}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52667f}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52667f}@media(prefers-color-scheme:dark){.bg{fill:#182330}.card{fill:#263647;stroke:#61778f}.blue{fill:#243b59;stroke:#87a7db}.teal{fill:#22443d;stroke:#80c3b1}.amber{fill:#4b3d2b;stroke:#dfb976}.rose{fill:#49333e;stroke:#daa1aa}text{fill:#edf3fa}.sub,.small{fill:#c5d3e2}.line{stroke:#abc0d7}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8094aa"/></marker></defs><rect width="1080" height="380" rx="22" class="bg"/><text x="36" y="50" class="title">From profile to later execution</text><text x="36" y="80" class="sub">Compilation needs both CPU time and room to install generated code</text><rect x="36" y="130" width="230" height="140" rx="15" class="blue"/><text x="54" y="166" class="head">Profile + policy</text><text x="54" y="199" class="body">Select useful task</text><rect x="299" y="130" width="230" height="140" rx="15" class="amber"/><text x="317" y="166" class="head">Broker + queues</text><text x="317" y="199" class="body">Wait for C1 or C2</text><rect x="562" y="130" width="230" height="140" rx="15" class="rose"/><text x="580" y="166" class="head">Compiler CPU</text><text x="580" y="199" class="body">Compete with app</text><rect x="825" y="130" width="219" height="140" rx="15" class="teal"/><text x="843" y="166" class="head">Code Cache</text><text x="843" y="199" class="body">Install nmethod</text><path d="M270 200 L291 200" class="line" marker-end="url(#arrow)"/><path d="M533 200 L554 200" class="line" marker-end="url(#arrow)"/><path d="M796 200 L817 200" class="line" marker-end="url(#arrow)"/><text x="36" y="354" class="small">Application calls continue on existing code until a usable new version is installed.</text></svg>
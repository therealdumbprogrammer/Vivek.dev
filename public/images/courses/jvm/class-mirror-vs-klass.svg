<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Class mirror and VM metadata</title><desc id="desc">Two memory domains represent related aspects of one type</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="500" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">Class mirror and VM metadata</text><text x="36" y="74" class="sub">Ordinary classes use InstanceKlass; arrays use the ArrayKlass family.</text><text x="40" y="111" class="small">JAVA HEAP</text><text x="520" y="111" class="small">HOTSPOT METASPACE</text><rect x="36" y="128" width="400" height="108" rx="15" class="accent"/><text x="54" y="158" class="head">Order instance</text><text x="54" y="184" class="body">An oop; header identifies class</text><text x="54" y="204" class="body">Header encoding varies by build</text><rect x="36" y="280" width="400" height="108" rx="15" class="mint"/><text x="54" y="310" class="head">java.lang.Class&lt;Order&gt;</text><text x="54" y="336" class="body">Heap reflection mirror</text><rect x="524" y="202" width="400" height="128" rx="15" class="amber"/><text x="542" y="232" class="head">InstanceKlass</text><text x="542" y="258" class="body">Class metadata, fields, methods</text><text x="542" y="278" class="body">hierarchy, layout, dispatch</text><path d="M436 182 L522 245" class="line" marker-end="url(#arrow)"/><text x="487.0" y="206.5" class="small">class metadata</text><path d="M436 335 L522 284" class="line" marker-end="url(#arrow)"/><text x="487.0" y="302.5" class="small">mirror relation</text><text x="40" y="453" class="small">Arrows express relationships, not fixed object-header bits or literal fields.</text></svg>
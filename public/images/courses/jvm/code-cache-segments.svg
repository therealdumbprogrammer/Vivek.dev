<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">THREE HOTSPOT CODE HEAPS</title><desc id="desc">Segmented Code Cache separates profiled nmethods, non-profiled nmethods, and non-method executable code. Each segment has distinct producers and lifecycle characteristics.</desc><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="16" text-anchor="middle">THREE HOTSPOT CODE HEAPS</text><rect x="24" y="56" width="432" height="392" rx="16" fill="none" stroke="#9aa8bb" stroke-width="1.5"/><text x="42" y="84" font-size="14">Segmented Code Cache</text><rect x="42" y="104" width="396" height="96" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="62" y="134" font-size="16">Profiled nmethods</text><text x="62" y="158" font-size="13">C1 code that keeps collecting runtime evidence</text><text x="62" y="180" font-size="13">Often transitional and replaceable</text><rect x="42" y="218" width="396" height="96" rx="12" fill="#dce7ff" stroke="#315dcc"/><text x="62" y="248" font-size="16">Non-profiled nmethods</text><text x="62" y="272" font-size="13">Optimized C2 and other non-profiled compiled code</text><text x="62" y="294" font-size="13">Often longer useful lifetime</text><rect x="42" y="332" width="396" height="96" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="62" y="362" font-size="16">Non-method code</text><text x="62" y="386" font-size="13">Interpreter, adapters, stubs, VM executable support</text><text x="62" y="408" font-size="13">Different lifetime from normal compiled methods</text><text x="240" y="478" font-size="13" text-anchor="middle">HotSpot implementation · not required by the JVM specification</text></g></svg>

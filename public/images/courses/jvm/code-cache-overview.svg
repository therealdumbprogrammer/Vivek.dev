<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">FROM BYTECODE TO EXECUTABLE CODE</title><desc id="desc">Bytecode is interpreted and profiled, C1 or C2 produces an nmethod, HotSpot installs it in the native Code Cache, and the CPU executes it.</desc><defs><marker id="arrow-overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="16" text-anchor="middle">FROM BYTECODE TO EXECUTABLE CODE</text><rect x="28" y="58" width="424" height="66" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="86" font-size="16" text-anchor="middle">.class bytecode</text><text x="240" y="108" font-size="13" text-anchor="middle">portable JVM instructions</text><path d="M240 126v30" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-overview)"/><rect x="28" y="160" width="424" height="70" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="189" font-size="16" text-anchor="middle">Interpreter + runtime profiles</text><text x="240" y="213" font-size="13" text-anchor="middle">execution starts and evidence accumulates</text><path d="M240 232v30" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-overview)"/><rect x="28" y="266" width="424" height="70" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="295" font-size="16" text-anchor="middle">C1 / C2 creates an nmethod</text><text x="240" y="319" font-size="13" text-anchor="middle">machine code + VM metadata</text><path d="M240 338v30" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-overview)"/><rect x="28" y="372" width="282" height="72" rx="12" fill="#dce7ff" stroke="#315dcc" stroke-width="1.5"/><text x="169" y="402" font-size="16" text-anchor="middle">Native Code Cache</text><text x="169" y="426" font-size="13" text-anchor="middle">installed executable artifact</text><path d="M312 408h38" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-overview)"/><rect x="354" y="372" width="98" height="72" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="403" y="402" font-size="16" text-anchor="middle">CPU</text><text x="403" y="426" font-size="13" text-anchor="middle">executes</text><text x="240" y="479" font-size="13" text-anchor="middle">HotSpot JDK 25 conceptual path · policy varies by workload</text></g></svg>

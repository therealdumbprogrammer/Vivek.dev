<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Forward to the current object</title><desc id="desc">A stale-looking reference to B can be resolved through temporary relocation metadata to the current copy.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Forward to the current object</text><rect x="45" y="154" width="190" height="112" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="140.0" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Old-looking ref</text><text x="140.0" y="229.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">B at 0x1000</text><path d="M242 210 L288 210" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="295" y="154" width="275" height="112" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="432.5" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Forwarding metadata</text><text x="432.5" y="229.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">old → current</text><path d="M577 210 L623 210" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="154" width="220" height="112" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="740.0" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Current B</text><text x="740.0" y="229.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">at 0x9000</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">Addresses are illustrative; repairs happen as references are encountered.</text></svg>
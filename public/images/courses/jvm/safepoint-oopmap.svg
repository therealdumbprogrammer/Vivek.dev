<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">OopMap reference locations</title><desc id="desc">An OopMap identifies which registers and stack slots contain Java object references.</desc>
  <rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Metadata distinguishes references from primitives</text>
  <g font-family="system-ui,sans-serif"><rect x="55" y="105" width="390" height="410" rx="22" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="250" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">Compiled frame</text><g fill="#fff" stroke="#94a3b8" stroke-width="2"><rect x="100" y="190" width="300" height="70" rx="13"/><rect x="100" y="285" width="300" height="70" rx="13"/><rect x="100" y="380" width="300" height="70" rx="13"/></g><g font-size="19" fill="#172033"><text x="130" y="232">register R8</text><text x="130" y="327">stack slot 24</text><text x="130" y="422">stack slot 32</text></g><g font-size="18" text-anchor="end"><text x="370" y="232" fill="#4f6f9f">Customer ptr</text><text x="370" y="327" fill="#4f6f9f">Order ptr</text><text x="370" y="422" fill="#7a4614">integer 17</text></g><rect x="520" y="105" width="385" height="410" rx="22" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="712" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#185b42">OopMap at this state</text><circle cx="565" cy="225" r="15" fill="#328361"/><text x="600" y="232" font-size="19" fill="#172033">R8 is an object reference</text><circle cx="565" cy="320" r="15" fill="#328361"/><text x="600" y="327" font-size="19" fill="#172033">slot 24 is an object reference</text><circle cx="565" cy="415" r="15" fill="#fff" stroke="#bd7a28" stroke-width="4"/><text x="600" y="422" font-size="19" fill="#172033">slot 32 is not an oop</text><text x="712" y="478" text-anchor="middle" font-size="17" fill="#244c3d">HotSpot follows marked locations as roots</text></g>
</svg>

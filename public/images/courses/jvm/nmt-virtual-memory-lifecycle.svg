<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc"><title id="title">Reserved address space, changing commitment</title><desc id="desc">A four-gibibyte virtual range is reserved; commitment grows and shrinks inside it before release.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="680" rx="22"/><text class="title" x="42" y="60">Reserved address space, changing commitment</text><text class="head" x="80" y="152">Reserve</text><rect class="box" x="285" y="125" width="720" height="76" rx="8"/><rect class="teal" x="285" y="125" width="90.0" height="76" rx="8"/><text class="body" x="650" y="171" text-anchor="middle">4 GiB reserved · 0.5 GiB committed</text><path class="line" d="M645 201 L645 263"/><text class="head" x="80" y="297">Commit more</text><rect class="box" x="285" y="270" width="720" height="76" rx="8"/><rect class="teal" x="285" y="270" width="180.0" height="76" rx="8"/><text class="body" x="650" y="316" text-anchor="middle">4 GiB reserved · 1 GiB committed</text><path class="line" d="M645 346 L645 408"/><text class="head" x="80" y="442">Uncommit</text><rect class="box" x="285" y="415" width="720" height="76" rx="8"/><rect class="teal" x="285" y="415" width="90.0" height="76" rx="8"/><text class="body" x="650" y="461" text-anchor="middle">4 GiB reserved · 0.5 GiB committed</text><rect class="muted" x="285" y="550" width="720" height="55" rx="8"/><text class="body" x="645" y="584" text-anchor="middle">Release: reservation removed</text><path class="line" d="M645 491 L645 550"/><text class="small" x="80" y="650">Bars show HotSpot virtual state, not resident pages.</text></svg>
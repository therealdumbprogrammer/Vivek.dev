<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Safepoint poll flow</title><desc id="desc">Compiled code reaches a poll and either continues or enters runtime coordination.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Compiled code cooperates through a cheap poll</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="340" y="100" width="280" height="78" rx="17" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="480" y="146" font-size="20" fill="#172033">compiled application code</text><path d="M480 178V230" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M480 225L635 315L480 405L325 315Z" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="480" y="308" font-size="20" font-weight="700" fill="#7a4614">request</text><text x="480" y="338" font-size="20" font-weight="700" fill="#7a4614">pending?</text><rect x="85" y="455" width="275" height="82" rx="17" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="222" y="503" font-size="20" fill="#185b42">continue execution</text><rect x="600" y="455" width="275" height="82" rx="17" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="737" y="490" font-size="19" fill="#4d3475">enter runtime</text><text x="737" y="517" font-size="19" fill="#4d3475">and cooperate</text></g><path d="M325 315C225 315 222 405 222 455" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M635 315C737 315 737 405 737 455" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><g font-family="system-ui,sans-serif" font-size="18" font-weight="700"><text x="245" y="365" fill="#185b42">NO · common path</text><text x="695" y="365" fill="#4d3475">YES</text></g>

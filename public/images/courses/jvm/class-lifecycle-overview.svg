<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc">
<title id="title">FROM BYTES TO A RUNTIME CLASS</title><desc id="desc">Verification and preparation precede initialization; resolution may continue into execution.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">FROM BYTES TO A RUNTIME CLASS</text><rect x="34" y="65" width="252" height="60" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="160.0" y="88.5" font-size="16" text-anchor="middle">Loading</text><text x="160.0" y="111.5" font-size="16" text-anchor="middle">bytes → runtime type</text><path d="M160 125 L160 150" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="34" y="154" width="252" height="80" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="160.0" y="187.5" font-size="16" text-anchor="middle">Verification + preparation</text><text x="160.0" y="210.5" font-size="16" text-anchor="middle">constraints + default state</text><path d="M160 235 L160 278" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="34" y="282" width="252" height="62" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="160.0" y="306.5" font-size="16" text-anchor="middle">Initialization</text><text x="160.0" y="329.5" font-size="16" text-anchor="middle">static logic</text><path d="M160 345 L160 379" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="34" y="382" width="252" height="56" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="160.0" y="415.0" font-size="16" text-anchor="middle">Relevant active use</text><rect x="306" y="155" width="150" height="110" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="381.0" y="192.0" font-size="16" text-anchor="middle">Resolution</text><text x="381.0" y="215.0" font-size="16" text-anchor="middle">part of linking</text><text x="381.0" y="238.0" font-size="16" text-anchor="middle">early or later</text><path d="M378 268 L378 423" fill="none" stroke="#315dcc" stroke-width="2"  stroke-dasharray="6 5" marker-end="url(#a)"/><text x="240" y="474" font-size="15" text-anchor="middle">Dashed path: timing may extend into execution</text></g></svg>
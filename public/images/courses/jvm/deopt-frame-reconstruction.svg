<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">One physical frame, several logical frames</title><desc id="desc">Compiled metadata reconstructs method and BCI, locals, operand stack and inlined calls.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">One physical frame, several logical frames</text><rect class="gold" x="75" y="125" width="355" height="285" rx="16"/><text class="head" x="252" y="175" text-anchor="middle">Optimized physical frame</text><text class="body" x="252" y="225" text-anchor="middle">calculate + inlined apply</text><text class="body" x="252" y="265" text-anchor="middle">registers and saved values</text><text class="body" x="252" y="305" text-anchor="middle">debug information</text><path class="line" d="M430 260H585"/><text class="small" x="507" y="240" text-anchor="middle">unpack</text><rect class="teal" x="585" y="115" width="410" height="125" rx="16"/><text class="head" x="790" y="160" text-anchor="middle">Logical calculate frame</text><text class="body" x="790" y="200" text-anchor="middle">method · BCI · locals · operands</text><rect class="teal" x="585" y="270"
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Precise root locations</title><desc id="desc">The OopMap identifies managed references at this state.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Precise root locations</text><text x="235" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Managed references</text><text x="665" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Other values</text><rect x="50" y="135" width="370" height="72" rx="12" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="235.0" y="177.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">RAX → oop</text><rect x="50" y="231" width="370" height="72" rx="12" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="235.0" y="273.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">slot 24 → oop</text><rect x="480" y="135" width="370" height="72" rx="12" fill="#fff0d9" stroke="#687c8c" stroke-width="2"/><text x="665.0" y="177.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">RBX → integer</text><rect x="480" y="231" width="370" height="72" rx="12" fill="#fff0d9" stroke="#687c8c" stroke-width="2"/><text x="665.0" y="273.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">slot 32 → long</text><text x="450" y="411" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#29465b">The OopMap identifies managed references at this state.</text></svg>
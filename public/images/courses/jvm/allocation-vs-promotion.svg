<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">SAME ALLOCATION, DIFFERENT FLOW</title><desc id="desc">Two illustrative services allocate 1,000 MB/s. Their promotion rates differ, while old occupancy also depends on reclamation and direct old allocation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">SAME ALLOCATION, DIFFERENT FLOW</text><text x="24" y="68" font-size="17">Service A: mostly short-lived</text><rect x="24.0" y="80" width="210.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="129.0" y="108" text-anchor="middle" font-size="17">1,000 MB/s new</text><rect x="240.0" y="80" width="210.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="345.0" y="108" text-anchor="middle" font-size="17">10 MB/s promoted</text><text x="24" y="173" font-size="17">Service B: more repeated survival</text><rect x="24.0" y="185" width="210.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="129.0" y="213" text-anchor="middle" font-size="17">1,000 MB/s new</text><rect x="240.0" y="185" width="210.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="345.0" y="213" text-anchor="middle" font-size="17">400 MB/s promoted</text><text x="24" y="278" font-size="17">Old occupancy changes with both sides</text><rect x="24.0" y="290" width="210.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="129.0" y="318" text-anchor="middle" font-size="17">inflow</text><rect x="240.0" y="290" width="210.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="345.0" y="318" text-anchor="middle" font-size="17">minus reclaimed</text><text x="24" y="415" font-size="16">Rates are illustrative, not measured GC output.</text></g></svg>
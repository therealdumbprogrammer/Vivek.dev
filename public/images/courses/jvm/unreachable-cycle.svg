<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">A CYCLE WITHOUT AN ENTRY PATH</title><desc id="desc">A CYCLE WITHOUT AN ENTRY PATH. Arrows indicate strong references; root labels represent reference starting points.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="430" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="35" font-size="19" fill="#334155">A CYCLE WITHOUT AN ENTRY PATH</text><text x="30" y="91" font-size="18" fill="#334155">Root set</text><text x="30" y="148" font-size="20" fill="#334155">No path into the cycle</text><rect x="90" y="215" width="90" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="104" y="246" font-size="19" fill="#334155">A</text><rect x="295" y="215" width="90" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="309" y="246" font-size="19" fill="#334155">B</text><path d="M182 228 L280 228" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M295 252 L200 252" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="331" font-size="18" fill="#334155">A points to B. B points to A.</text><text x="30" y="370" font-size="18" fill="#334155">Neither is reachable from a root.</text></g></svg>
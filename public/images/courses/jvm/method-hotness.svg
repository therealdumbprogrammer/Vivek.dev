<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">HOTNESS INFORMS POLICY</title><desc id="desc">Compilation policy combines hotness signals with tier, method, and compiler conditions instead of one universal threshold.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="460" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">HOTNESS INFORMS POLICY</text><rect x="25" y="65" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="101" font-size="16" text-anchor="middle">Invocation activity + back-edge activity</text><path d="M240 127v22" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="152" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="188" font-size="16" text-anchor="middle">Current tier + method characteristics</text><path d="M240 214v22" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="239" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="275" font-size="16" text-anchor="middle">Compiler queues + available resources</text><path d="M240 301v22" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="326" width="430" height="61" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="362" font-size="16" text-anchor="middle">Policy chooses whether and how to compile</text><text x="240" y="425" font-size="14" text-anchor="middle">Conceptual HotSpot execution · not to scale</text></g></svg>

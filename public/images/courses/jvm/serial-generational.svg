<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Serial is generational</title><desc id="desc">Eden, Survivor, and Old are generations; one GC worker performs collection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Serial is generational</text><rect x="45" y="135" width="220" height="110" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="155.0" y="183.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Eden</text><text x="155.0" y="211.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">new objects</text><path d="M265 190 L328 190" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="335" y="135" width="220" height="110" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="445.0" y="183.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Survivor</text><text x="445.0" y="211.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">young survivors</text><path d="M555 190 L618 190" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="586.5" y="182.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#183047">promote</text><rect x="625" y="135" width="220" height="110" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="735.0" y="183.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Old</text><text x="735.0" y="211.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">longer lived</text><rect x="260" y="315" width="380" height="66" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="355.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">One GC worker · application paused</text></svg>
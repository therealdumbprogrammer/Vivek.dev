<svg xmlns="http://www.w3.org/2000/svg" width="480" height="516" viewBox="0 0 480 516" role="img" aria-labelledby="title desc"><title id="title">COMPILED CODE IS RECLAIMED IN STAGES</title><desc id="desc">An nmethod is created, installed, and executed. It can be superseded or invalidated, then becomes non-entrant for new calls while active frames may remain. Only later is storage safely reclaimable.</desc><defs><marker id="arrow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="516" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="15" text-anchor="middle">COMPILED CODE IS RECLAIMED IN STAGES</text><rect x="42" y="58" width="396" height="60" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="84" font-size="16" text-anchor="middle">Created → installed → in use</text><text x="240" y="104" font-size="13" text-anchor="middle">new calls can enter this version</text><path d="M240 120v30" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-life)"/><rect x="42" y="154" width="396" height="70" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240" y="183" font-size="16" text-anchor="middle">Superseded or dependency invalidated</text><text x="240" y="207" font-size="13" text-anchor="middle">HotSpot stops preferring the old version</text><path d="M240 226v30" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-life)"/><rect x="42" y="260" width="396" height="88" rx="12" fill="#dce7ff" stroke="#315dcc"/><text x="240" y="289" font-size="16" text-anchor="middle">Non-entrant for new calls</text><text x="240" y="313" font-size="13" text-anchor="middle">existing activations may still be on stacks</text><text x="240" y="333" font-size="13" text-anchor="middle">call sites and metadata still need safe cleanup</text><path d="M240 350v30" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-life)"/><rect x="42" y="384" width="396" height="70" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="413" font-size="16" text-anchor="middle">Eventually reclaimable</text><text x="240" y="437" font-size="13" text-anchor="middle">storage can be reused only after safe removal</text><text x="240" y="492" font-size="13" text-anchor="middle">Invalidated ≠ immediately freed</text></g></svg>

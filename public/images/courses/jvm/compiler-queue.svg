<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="title desc"><title id="title">APPLICATION AND COMPILER PROGRESS</title><desc id="desc">Application execution continues while C1 and C2 queues are serviced. Queueing and compilation take time before new code is installed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="580" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">APPLICATION AND COMPILER PROGRESS</text><rect x="25" y="65" width="200" height="80" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="125.0" y="99.0" font-size="16" text-anchor="middle">Application thread</text><text x="125.0" y="123.0" font-size="16" text-anchor="middle">keeps executing</text><rect x="255" y="65" width="200" height="80" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="355.0" y="99.0" font-size="16" text-anchor="middle">Compilation</text><text x="355.0" y="123.0" font-size="16" text-anchor="middle">candidate</text><path d="M225 105 L252 105" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><path d="M355 146 L355 182" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="187" width="200" height="105" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="355.0" y="233.5" font-size="16" text-anchor="middle">C1 / C2 queues</text><text x="355.0" y="257.5" font-size="16" text-anchor="middle">requests can wait</text><path d="M355 294 L355 322" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="327" width="200" height="85" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="355.0" y="363.5" font-size="16" text-anchor="middle">Compiler threads</text><text x="355.0" y="387.5" font-size="16" text-anchor="middle">produce code</text><rect x="25" y="245" width="200" height="95" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="125.0" y="274.5" font-size="16" text-anchor="middle">Interpreter or</text><text x="125.0" y="298.5" font-size="16" text-anchor="middle">available compiled</text><text x="125.0" y="322.5" font-size="16" text-anchor="middle">version</text><path d="M125 146 L125 240" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="460" width="430" height="68" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="488.0" font-size="16" text-anchor="middle">Installed code becomes available</text><text x="240.0" y="512.0" font-size="16" text-anchor="middle">Subsequent execution can use it</text><path d="M355 414 L355 454" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><path d="M125 342 L125 454" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="558" font-size="13" text-anchor="middle">Normal background compilation · CPU is shared</text></g></svg>

<text class="heading" x="44" y="55">A Java store becomes collector-aware code</text><rect class="box" x="35" y="150" width="230" height="160" rx="16"/><text class="label" x="55" y="186">Java</text><text class="body" x="55" y="222">latestOrder = order</text><path class="line" d="M265 230 L310 230"/><rect class="box" x="315" y="150" width="210" height="160" rx="16"/><text class="label" x="335" y="186">Bytecode</text><text class="body" x="335" y="222">putfield</text><path class="line" d="M525 230 L570 230"/><rect class="accent" x="575" y="150" width="210" height="160" rx="16"/><text class="label" x="595" y="186">C2 IR</text><text class="body" x="595" y="222">reference store</text><text class="body" x="595" y="249">barrier logic</text><path class="line" d="M785 230 L830 230"/><rect class="box" x="835" y="150" width="210" height="160" rx="16"/><text class="label" x="855" y="186">Machine code</text><text class="body" x="855" y="222">mutator executes</text><text class="body" x="855" y="249">optimized path</text></svg>
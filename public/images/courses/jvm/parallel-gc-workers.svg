<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Parallel GC workers</title><desc id="desc">Application threads stop while several workers divide GC work.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Parallel GC workers</text><rect x="60" y="115" width="230" height="125" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="175.0" y="170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Application</text><text x="175.0" y="198.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">PAUSED</text><path d="M290 175 L355 175" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="100" width="170" height="70" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="142.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">GC worker 1</text><rect x="365" y="185" width="170" height="70" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="227.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">GC worker 2</text><rect x="365" y="270" width="170" height="70" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="312.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">GC worker 3</text><path d="M535 205 L605 205" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="615" y="145" width="230" height="125" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="730.0" y="200.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Application</text><text x="730.0" y="228.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">RESUMES</text><text x="450" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#183047">Young and major collections can both use multiple workers.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">Three meanings of arena</title><desc id="desc">HotSpot internal chunks contain temporary objects; glibc arenas reuse native chunks; Java FFM Arena controls segment lifetime.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="600" rx="22"/><text class="title" x="42" y="60">Three meanings of arena</text><rect class="teal" x="45" y="120" width="300" height="405" rx="14"/><text class="head" x="195" y="160" text-anchor="middle">HotSpot Arena</text><text class="small" x="195" y="190" text-anchor="middle">temporary VM objects</text><rect class="box" x="65" y="220" width="260" height="116" rx="9"/><text class="small" x="195" y="249" text-anchor="middle">backing chunk A</text><rect class="muted" x="78" y="270" width="111" height="48" rx="7"/><text class="small" x="133" y="300" text-anchor="middle">obj 1</text><rect class="muted" x="200" y="270" width="111" height="48" rx="7"/><text class="small" x="255" y="300" text-anchor="middle">obj 2</text><rect class="box" x="65" y="355" width="260" height="116" rx="9"/><text class="small" x="195" y="384" text-anchor="middle">backing chunk B</text><rect class="muted" x="78" y="405" width="111" height="48" rx="7"/><text class="small" x="133" y="435" text-anchor="middle">obj 3</text><rect class="muted" x="200" y="405" width="111" height="48" rx="7"/><text class="small" x="255" y="435" text-anchor="middle">obj 4</text><rect class="gold" x="375" y="120" width="300" height="405" rx="14"/><text class="head" x="525" y="160" text-anchor="middle">glibc arena</text><text class="small" x="525" y="190" text-anchor="middle">native allocator</text><rect class="box" x="397" y="224" width="256" height="51" rx="8"/><text class="small" x="525" y="256" text-anchor="middle">malloc chunks</text><rect class="box" x="397" y="294" width="256" height="51" rx="8"/><text class="small" x="525" y="326" text-anchor="middle">reuse after free</text><rect class="box" x="397" y="364" width="256" height="51" rx="8"/><text class="small" x="525" y="396" text-anchor="middle">contention control</text><rect class="box" x="397" y="434" width="256" height="51" rx="8"/><text class="small" x="525" y="466" text-anchor="middle">possible retained pages</text><rect class="box" x="705" y="120" width="330" height="405" rx="14"/><text class="head" x="870" y="160" text-anchor="middle">Java FFM Arena</text><text class="small" x="870" y="190" text-anchor="middle">Java API scope</text><rect class="box" x="729" y="224" width="282" height="51" rx="8"/><text class="small" x="870" y="256" text-anchor="middle">foreign segments</text><rect class="box" x="729" y="294" width="282" height="51" rx="8"/><text class="small" x="870" y="326" text-anchor="middle">access and lifetime</text><rect class="box" x="729" y="364" width="282" height="51" rx="8"/><text class="small" x="870" y="396" text-anchor="middle">close scope</text><rect class="box" x="729" y="434" width="282" height="51" rx="8"/><text class="small" x="870" y="466" text-anchor="middle">not HotSpot chunks</text><text class="body" x="540" y="570" text-anchor="middle">The name is shared; ownership, purpose and release semantics differ.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="title desc"><title id="title">LOAD → ADD → STORE</title><desc id="desc">The stack changes from empty to 10, then 10 and 20, then 30, then empty as 30 is stored into slot three.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="530" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">LOAD → ADD → STORE</text><text x="240" y="69" font-size="16" text-anchor="middle">Instruction → stack after execution</text><rect x="26" y="88" width="428" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="123.0" font-size="16" text-anchor="middle">start → [ ]</text><rect x="26" y="163" width="428" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="198.0" font-size="16" text-anchor="middle">iload_1 → [10]</text><rect x="26" y="238" width="428" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="273.0" font-size="16" text-anchor="middle">iload_2 → [10, 20] ← top</text><rect x="26" y="313" width="428" height="58" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="348.0" font-size="16" text-anchor="middle">iadd → [30]</text><rect x="26" y="388" width="428" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="423.0" font-size="16" text-anchor="middle">istore_3 → [ ]</text><text x="240" y="492" font-size="16" text-anchor="middle">Slots 1 / 2 stay 10 / 20; slot 3 becomes 30</text><text x="240" y="512" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
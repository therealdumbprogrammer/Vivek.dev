<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Two ways CPU delays work</title><desc id="desc">Runnable competition and enforced cgroup quota are distinct observations</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#24354b}.bg{fill:#f8fafc}.card{fill:#fff;stroke:#aebed0;stroke-width:2}.blue{fill:#e8f0fc;stroke:#6685b0;stroke-width:2}.teal{fill:#e5f4ef;stroke:#5d9b89;stroke-width:2}.amber{fill:#fff3df;stroke:#bd9654;stroke-width:2}.rose{fill:#f9ecee;stroke:#bc7f89;stroke-width:2}.line{stroke:#657b95;stroke-width:3;fill:none}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52667f}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52667f}@media(prefers-color-scheme:dark){.bg{fill:#182330}.card{fill:#263647;stroke:#61778f}.blue{fill:#243b59;stroke:#87a7db}.teal{fill:#22443d;stroke:#80c3b1}.amber{fill:#4b3d2b;stroke:#dfb976}.rose{fill:#49333e;stroke:#daa1aa}text{fill:#edf3fa}.sub,.small{fill:#c5d3e2}.line{stroke:#abc0d7}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8094aa"/></marker></defs><rect width="1080" height="430" rx="22" class="bg"/><text x="36" y="50" class="title">Two ways CPU delays work</text><text x="36" y="80" class="sub">Runnable competition and enforced cgroup quota are distinct observations</text><rect x="36" y="130" width="490" height="100" rx="15" class="blue"/><text x="54" y="166" class="head">Contention</text><text x="54" y="199" class="body">App + compiler take turns on CPU</text><rect x="554" y="130" width="490" height="100" rx="15" class="teal"/><text x="572" y="166" class="head">No quota exhaustion</text><text x="572" y="199" class="body">Runnable work may still wait</text><rect x="36" y="270" width="490" height="100" rx="15" class="amber"/><text x="54" y="306" class="head">Quota consumed</text><text x="54" y="339" class="body">CPU time reaches cpu.max allowance</text><rect x="554" y="270" width="490" height="100" rx="15" class="rose"/><text x="572" y="306" class="head">Throttled</text><text x="572" y="339" class="body">Cgroup waits for next period</text><path d="M529 180 L547 180" class="line" marker-end="url(#arrow)"/><path d="M529 320 L547 320" class="line" marker-end="url(#arrow)"/><text x="36" y="404" class="small">Correlate thread CPU and cpu.stat deltas with latency.</text></svg>
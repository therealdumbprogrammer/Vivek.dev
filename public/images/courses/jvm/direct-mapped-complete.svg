<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">JVM PROCESS MEMORY DOMAINS</title><desc id="desc">The process includes separate heap, HotSpot native, direct-buffer, mapped-file and native-library domains.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="900" height="450" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="450" y="48" class="title" text-anchor="middle">JVM PROCESS MEMORY DOMAINS</text><rect x="20" y="72" width="860" height="320" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30.0" y="120" width="156.8" height="235" rx="16" fill="#e8efff" stroke="#4968b5" stroke-width="1.5"/><text x="108.4" y="154" class="head" text-anchor="middle">JAVA HEAP</text><text x="108.4" y="202" class="body" text-anchor="middle">objects · wrappers</text><path d="M 188.8 237.5 H 198.8" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="200.8" y="120" width="156.8" height="235" rx="16" fill="#eef5f4" stroke="#4d827a" stroke-width="1.5"/><text x="279.2" y="154" class="head" text-anchor="middle">HOTSPOT NATIVE</text><text x="279.2" y="202" class="body" text-anchor="middle">Metaspace · Code Cache</text><text x="279.2" y="232" class="body" text-anchor="middle">stacks · GC structures</text><path d="M 359.6 237.5 H 369.6" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="371.6" y="120" width="156.8" height="235" rx="16" fill="#fff2df" stroke="#b77935" stroke-width="1.5"/><text x="450.0" y="154" class="head" text-anchor="middle">NIO DIRECT</text><text x="450.0" y="202" class="body" text-anchor="middle">anonymous native bytes</text><path d="M 530.4 237.5 H 540.4" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="542.4" y="120" width="156.8" height="235" rx="16" fill="#e8efff" stroke="#4968b5" stroke-width="1.5"/><text x="620.8" y="154" class="head" text-anchor="middle">MAPPED FILES</text><text x="620.8" y="202" class="body" text-anchor="middle">file-backed pages</text><path d="M 701.2 237.5 H 711.2" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="713.2" y="120" width="156.8" height="235" rx="16" fill="#eef5f4" stroke="#4d827a" stroke-width="1.5"/><text x="791.6" y="154" class="head" text-anchor="middle">NATIVE LIBRARIES</text><text x="791.6" y="202" class="body" text-anchor="middle">library / JNI memory</text><text x="450" y="425" class="foot" text-anchor="middle">One process budget · different owners and diagnostics</text></g><style>.title{font-size:20px;font-weight:700;letter-spacing:.3px}.head{font-size:16px;font-weight:650}.body{font-size:12.5px}.foot{font-size:13px;fill:#58677d}</style></svg>
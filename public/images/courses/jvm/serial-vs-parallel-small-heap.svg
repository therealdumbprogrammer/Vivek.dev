<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Small GC job: coordination matters</title><desc id="desc">Parallel workers share work but coordination can dominate a tiny collection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Small GC job: coordination matters</text><rect x="65" y="115" width="330" height="170" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="230.0" y="179.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Serial</text><text x="230.0" y="207.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">one worker</text><text x="230.0" y="235.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">collection work</text><rect x="505" y="115" width="330" height="170" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="670.0" y="179.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Parallel</text><text x="670.0" y="207.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">several workers</text><text x="670.0" y="235.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">work + coordination</text><text x="450" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">As useful work grows, sharing it can repay coordination cost.</text></svg>
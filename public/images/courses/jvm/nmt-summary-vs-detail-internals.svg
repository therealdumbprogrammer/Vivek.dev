<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-labelledby="title desc"><title id="title">Summary groups; detail locates</title><desc id="desc">Summary provides category totals; detail adds native allocation sites and a virtual memory map.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="550" rx="22"/><text class="title" x="42" y="60">Summary groups; detail locates</text><rect class="teal" x="55" y="120" width="455" height="350" rx="14"/><rect class="gold" x="570" y="120" width="455" height="350" rx="14"/><text class="head" x="282" y="163" text-anchor="middle">summary</text><text class="head" x="797" y="163" text-anchor="middle">detail</text><text class="body" x="95" y="215">GC     malloc + committed</text><text class="body" x="95" y="268">Class  malloc + committed</text><text class="body" x="95" y="321">Thread reserved + committed</text><text class="body" x="95" y="374">Code   reserved + committed</text><text class="body" x="610" y="215">All summary categories</text><text class="body" x="610" y="268">Native HotSpot call sites</text><text class="body" x="610" y="321">Virtual memory map</text><text class="body" x="610" y="374">No Java application stacks</text><text class="body" x="540" y="515" text-anchor="middle">Tracking level must be selected at JVM startup.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Method and compiled incarnations</title><desc id="desc">Metadata and machine code have different lifetimes</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="520" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">Method and compiled incarnations</text><text x="36" y="74" class="sub">Lines show associations; auxiliary data and compiled forms need not all exist.</text><rect x="36" y="120" width="286" height="100" rx="15" class="mint"/><text x="54" y="150" class="head">java.lang.reflect.Method</text><text x="54" y="176" class="body">Heap reflection object</text><rect x="360" y="120" width="240" height="100" rx="15" class="accent"/><text x="378" y="150" class="head">Method</text><text x="378" y="176" class="body">HotSpot metadata</text><rect x="638" y="120" width="286" height="100" rx="15" class="card"/><text x="656" y="150" class="head">ConstMethod</text><text x="656" y="176" class="body">Bytecodes, stable metadata</text><rect x="36" y="300" width="286" height="108" rx="15" class="amber"/><text x="54" y="330" class="head">MethodCounters / MethodData</text><text x="54" y="356" class="body">Optional counts and profiles</text><rect x="360" y="300" width="240" height="108" rx="15" class="card"/><text x="378" y="330" class="head">nmethod: C1 / OSR</text><text x="378" y="356" class="body">Code Cache incarnation</text><rect x="638" y="300" width="286" height="108" rx="15" class="card"/><text x="656" y="330" class="head">nmethod: C2</text><text x="656" y="356" class="body">Can deopt or be reclaimed</text><path d="M322 169 L358 169" class="line" marker-end="url(#arrow)"/><path d="M600 169 L636 169" class="line" marker-end="url(#arrow)"/><path d="M463 220 L184 298" class="line" marker-end="url(#arrow)"/><path d="M480 220 L480 298" class="line" marker-end="url(#arrow)"/><path d="M540 220 L765 298" class="line" marker-end="url(#arrow)"/><text x="40" y="472" class="small">A reclaimed nmethod does not by itself unload the Method or class.</text></svg>
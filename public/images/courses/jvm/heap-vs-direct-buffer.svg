<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">HEAP BUFFER / DIRECT BUFFER</title><desc id="desc">Heap buffers keep wrapper and byte array on the Java heap; direct buffers keep the wrapper on heap and bytes in native storage.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="900" height="450" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="450" y="48" class="title" text-anchor="middle">HEAP BUFFER / DIRECT BUFFER</text><rect x="20" y="72" width="860" height="320" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30.0" y="130" width="270.7" height="210" rx="16" fill="#e8efff" stroke="#4968b5" stroke-width="1.5"/><text x="165.3" y="164" class="head" text-anchor="middle">JAVA HEAP</text><text x="165.3" y="212" class="body" text-anchor="middle">ByteBuffer wrapper</text><text x="165.3" y="242" class="body" text-anchor="middle">byte[] content</text><path d="M 302.7 235.0 H 312.7" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="314.7" y="130" width="270.7" height="210" rx="16" fill="#eef5f4" stroke="#4d827a" stroke-width="1.5"/><text x="450.0" y="164" class="head" text-anchor="middle">JAVA HEAP</text><text x="450.0" y="212" class="body" text-anchor="middle">DirectByteBuffer wrapper</text><path d="M 587.3 235.0 H 597.3" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="599.3" y="130" width="270.7" height="210" rx="16" fill="#fff2df" stroke="#b77935" stroke-width="1.5"/><text x="734.7" y="164" class="head" text-anchor="middle">NATIVE MEMORY</text><text x="734.7" y="212" class="body" text-anchor="middle">direct backing bytes</text><text x="450" y="425" class="foot" text-anchor="middle">Two storage layouts</text></g><style>.title{font-size:20px;font-weight:700;letter-spacing:.3px}.head{font-size:16px;font-weight:650}.body{font-size:14px}.foot{font-size:13px;fill:#58677d}</style></svg>
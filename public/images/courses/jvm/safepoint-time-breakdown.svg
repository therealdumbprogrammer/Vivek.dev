<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Safepoint time breakdown</title><desc id="desc">A 45 millisecond disruption contains 40 milliseconds reaching the safepoint and 5 milliseconds at it.</desc>
  <rect width="960" height="520" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">One pause, two different phases</text>
  <g font-family="system-ui,sans-serif"><text x="80" y="125" font-size="18" font-weight="700" fill="#172033">0 ms · request</text><text x="790" y="125" font-size="18" font-weight="700" fill="#172033">45 ms · resume</text><rect x="80" y="165" width="650" height="110" rx="18" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><rect x="730" y="165" width="150" height="110" rx="18" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="405" y="210" text-anchor="middle" font-size="23" font-weight="700" fill="#7a4614">40 ms · reaching safepoint</text><text x="405" y="244" text-anchor="middle" font-size="18" fill="#54391d">waiting for required threads</text><text x="805" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#4d3475">5 ms</text><text x="805" y="240" text-anchor="middle" font-size="17" fill="#4d3475">at safepoint</text><path d="M80 320H880" stroke="#64748b" stroke-width="3"/><path d="M80 307V335M730 307V335M880 307V335" stroke="#64748b" stroke-width="3"/><text x="80" y="370" text-anchor="middle" font-size="17" fill="#475569">request</text><text x="730" y="370" text-anchor="middle" font-size="17" fill="#475569">all safe</text><text x="880" y="370" text-anchor="middle" font-size="17" fill="#475569">resume</text><text x="480" y="445" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Total disruption ≈ 45 ms; VM operation time ≈ 5 ms</text></g>
</svg>

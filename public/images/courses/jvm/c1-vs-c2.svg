<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">TWO COMPILATION TRADE-OFFS</title><desc id="desc">C1 compiles with less work and can measure the method while it runs. C2 spends more compilation effort on deeper optimization.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="480" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">TWO COMPILATION TRADE-OFFS</text><rect x="25" y="65" width="430" height="140" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="117.0" font-size="16" text-anchor="middle">C1 · less compilation work now</text><text x="240.0" y="141.0" font-size="16" text-anchor="middle">Useful, lighter optimization</text><text x="240.0" y="165.0" font-size="16" text-anchor="middle">Can keep measuring while code runs</text><rect x="25" y="235" width="430" height="140" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="287.0" font-size="16" text-anchor="middle">C2 · more compilation work now</text><text x="240.0" y="311.0" font-size="16" text-anchor="middle">Deeper analysis and optimization</text><text x="240.0" y="335.0" font-size="16" text-anchor="middle">Uses the collected runtime evidence</text><text x="240" y="419" font-size="15" text-anchor="middle">Future execution must repay compilation.</text><text x="240" y="458" font-size="13" text-anchor="middle">Conceptual HotSpot model · not to scale</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Two ordinary relocation models</title><desc id="desc">G1 copies selected live objects while mutators are stopped. ZGC relocation overlaps mutator execution and uses load barriers.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Two ordinary relocation models</text><text x="222" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">G1: evacuation pause</text><text x="678" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">ZGC: concurrent relocation</text><rect x="55" y="145" width="170" height="92" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="140.0" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Mutators</text><text x="140.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">stopped</text><path d="M230 190 L264 190" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="145" width="145" height="92" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="342.5" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Copy live</text><text x="342.5" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">objects</text><rect x="486" y="145" width="170" height="92" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="571.0" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Mutators</text><text x="571.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">running</text><path d="M662 190 L696 190" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="702" y="145" width="145" height="92" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="774.5" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Barrier</text><text x="774.5" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">resolves</text><text x="225" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#183047">Movement inside a global pause</text><text x="675" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#183047">Movement overlaps application work</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">Both perform work; the scheduling and coordination differ.</text></svg>
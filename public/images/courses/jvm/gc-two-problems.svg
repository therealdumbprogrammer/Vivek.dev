<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Two jobs in a collection</title><desc id="desc">Discover reachability, then recover useful space.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="450" rx="22" fill="#f8fafc"/>
<text x="30" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">Two jobs in a collection</text>
<rect x="35.0" y="145" width="258.0" height="155" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="164.0" y="213.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Heap objects</text><text x="164.0" y="242.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">live + unreachable</text><path d="M297.0 222.5 L316.0 222.5" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="321.0" y="145" width="258.0" height="155" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="450.0" y="213.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Trace from roots</text><text x="450.0" y="242.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">which must survive?</text><path d="M583.0 222.5 L602.0 222.5" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="607.0" y="145" width="258.0" height="155" rx="14" fill="#fff2d8" stroke="#9aafc2" stroke-width="2"/><text x="736.0" y="213.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Recover space</text><text x="736.0" y="242.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">sweep · compact · evacuate</text>
<rect x="25" y="377" width="850" height="48" rx="10" fill="white" stroke="#d5dfe8"/>
<text x="450" y="407" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="500" fill="#52657a">Finding live objects and shaping free space are separate decisions.</text>
</svg>
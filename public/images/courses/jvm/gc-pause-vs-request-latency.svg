<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc"><title id="title">Pause time versus request time</title><desc id="desc">Two request timelines with different sources of latency.</desc><rect class="bg" width="1080" height="480" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.accent{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.bar{fill:#91bdb5}.line{stroke:#647b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.accent{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.bar{fill:#6aa79c}text{fill:#edf2fa}.line,.plain{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b91" stroke-width="1.8"/></marker></defs><text class="title" x="42" y="58">Pause time versus request time</text><text class="label" x="48" y="126">G1 request</text><rect class="accent" x="280" y="105" width="360" height="42" rx="5"/><rect class="gold" x="640" y="105" width="130" height="42" rx="5"/><rect class="accent" x="770" y="105" width="180" height="42" rx="5"/><text class="body" x="288" y="190">application work</text><text class="body" x="637" y="190">GC pause</text><text class="label" x="47" y="240">ZGC request</text><rect class="accent" x="280" y="218" width="240" height="42" rx="5"/><rect class="gold" x="520" y="218" width="80" height="42" rx="5"/><rect class="rose" x="600" y="218" width="175" height="42" rx="5"/><rect class="accent" x="775" y="218" width="175" height="42" rx="5"/><text class="body" x="500" y="307">short pause</text><text class="body" x="627" y="337">allocation wait</text><path class="plain" d="M280 380 L951 380"/><text class="note" x="42" y="439">Both requests include execution and waiting; one pause metric cannot explain p99.</text></svg>
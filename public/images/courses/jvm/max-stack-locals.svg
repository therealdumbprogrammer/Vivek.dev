<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title desc"><title id="title">CAPACITY IS NOT OCCUPANCY</title><desc id="desc">Four local slots and a peak of two operand stack depth units suffice for the instance add method.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="490" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">CAPACITY IS NOT OCCUPANCY</text><rect x="30" y="66" width="420" height="80" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="100.0" font-size="16" text-anchor="middle">Code attribute</text><text x="240.0" y="124.0" font-size="16" text-anchor="middle">max_locals = 4 · max_stack = 2</text><text x="240" y="180" font-size="16" text-anchor="middle">Four indexed local slots</text><rect x="34" y="198" width="90" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="79.0" y="233.0" font-size="16" text-anchor="middle">0</text><rect x="142" y="198" width="90" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="187.0" y="233.0" font-size="16" text-anchor="middle">1</text><rect x="250" y="198" width="90" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="295.0" y="233.0" font-size="16" text-anchor="middle">2</text><rect x="358" y="198" width="90" height="58" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="403.0" y="233.0" font-size="16" text-anchor="middle">3</text><text x="240" y="295" font-size="16" text-anchor="middle">Peak after iload_2</text><rect x="114" y="314" width="252" height="52" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="346.0" font-size="16" text-anchor="middle">20 ← top</text><rect x="1
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Correlate one request spike</title><desc id="desc">Time-aligned request, GC, safepoint, and scheduling evidence must be checked together.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">Correlate one request spike</text><text class="small" x="205" y="115">same wall-clock window →</text><text class="head" x="50" y="170">Request p99</text><rect class="box" x="270" y="140" width="725" height="55" rx="8"/><rect class="rose" x="485" y="150" width="240" height="35" rx="5"/><text class="small" x="805" y="174">80 ms spike</text><text class="head" x="50" y="255">GC</text><rect class="box" x="270" y="225" width="725" height="55" rx="8"/><rect class="teal" x="520" y="235" width="55" height="35" rx="5"/><text class="small" x="805" y="259">5 ms pause</text><text class="head" x="50" y="340">Safepoint</text><rect class="box" x="270" y="310" width="725" height="55" rx="8"/><rect class="gold" x="480" y="320" width="200" height="35" rx="5"/><text class="small" x="805" y="344">18 + 4 + 0.1 ms</text><text class="head" x="50" y="425">Scheduler</text><rect class="box" x="270" y="395" width="725" height="55" rx="8"/><rect class="rose" x="455" y="405" width="85" height="35" rx="5"/><text class="small" x="805" y="429">inspect delay</text></svg>
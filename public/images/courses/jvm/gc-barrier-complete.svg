<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">From source code to executed barrier paths</title><desc id="desc">Java and bytecode compile through collector-specific C2 barriers into optimized fast and occasional slow paths.</desc>
<rect class="bg" width="1080" height="450" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#243247}.bg{fill:#f7f9fc}.heading{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.box{fill:#fff;stroke:#bdcad9;stroke-width:2}.accent{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.warn{fill:#fff1db;stroke:#b68a46;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#789;stroke-width:2;stroke-dasharray:8 6}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#52667e}.accent{fill:#213f3d;stroke:#73b1a7}.warn{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.line{stroke:#a9b9cd}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#526477" stroke-width="1.7"/></marker></defs>
<text class="heading" x="44" y="55">From source code to executed barrier paths</text><rect class="box" x="35" y="140" width="180" height="170" rx="16"/><text class="label" x="55" y="176">Java</text><text class="body" x="55" y="212">reference access</text><path class="line" d="M215 225 L237 225"/><rect class="box" x="243" y="140" width="180" height="170" rx="16"/><text class="label" x="263" y="176">Bytecode</text><text class="body" x="263" y="212">putfield / getfield</text><path class="line" d="M423 225 L445 225"/><rect class="box" x="451" y="140" width="190" height="170" rx="16"/><text class="label" x="471" y="176">C2 IR</text><text class="body" x="471" y="212">memory access</text><path class="line" d="M641 225 L663 225"/><rect class="accent" x="669" y="140" width="185" height="170" rx="16"/><text class="label" x="689" y="176">BarrierSet</text><text class="body" x="689" y="212">G1 or ZGC</text><path class="line" d="M854 225 L876 225"/><rect class="box" x="882" y="140" width="165" height="170" rx="16"/><text class="label" x="902" y="176">Native code</text><text class="body" x="902" y="212">fast path</text><text class="body" x="902" y="239">slow path</text><text class="body" x="258" y="380">C2 can simplify or eliminate work only with a valid collector-specific proof</text></svg>
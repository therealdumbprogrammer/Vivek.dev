<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Compiled-code lifetime</title><desc id="desc">A version can stop receiving new calls before reclamation.</desc><rect width="900" height="450" fill="#f8fafc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687c8c"/></marker></defs><text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Compiled-code lifetime</text><rect x="30.0" y="116.0" width="268.0" height="92" rx="16" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="164.0" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Compile + install</text><path d="M 300.0 162.0 L 311.0 162.0" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="316.0" y="116.0" width="268.0" height="92" rx="16" fill="#e5e3f5" stroke="#687c8c" stroke-width="2"/><text x="450.0" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Enter + execute</text><path d="M 586.0 162.0 L 597.0 162.0" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="602.0" y="116.0" width="268.0" height="92" rx="16" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="736.0" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Supersede or invalidate</text><path d="M 736.0 210.0 L 736.0 224.0" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="602.0" y="231.0" width="268.0" height="92" rx="16" fill="#fff0d9" stroke="#687c8c" stroke-width="2"/><text x="736.0" y="283.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Active frames finish</text><path d="M 600.0 277.0 L 589.0 277.0" str
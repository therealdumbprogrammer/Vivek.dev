<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><rect width="600" height="650" fill="#f8fafc"/><title id="title">Complete heap and process sizing model</title><desc id="desc">Container capacity encloses a JVM process containing the Java heap, native memory, and margin. The heap contains live data plus working headroom below Xmx.</desc><text x="300" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183047">Whole-process budget</text><rect x="30" y="78" width="540" height="510" rx="18" fill="#e8f4e7" stroke="#536779" stroke-width="3"/><text x="52" y="112" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Container / host limit</text><rect x="54" y="137" width="492" height="285" rx="16" fill="#d9eafb" stroke="#536779" stroke-width="2"/><text x="76" y="171" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Java heap · Xmx ceiling</text><rect x="77" y="190" width="446" height="85" rx="12" fill="#e5e3f5" stroke="#91a3b3"/><text x="96" y="225" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183047">Live set</text><text x="96" y="253" font-family="Arial,sans-serif" font-size="19" fill="#183047">must survive collection</text><rect x="77" y="287" width="446" height="111" rx="12" fill="#fff0d2" stroke="#91a3b3"/><text x="96" y="323" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183047">Working headroom</text><text x="96" y="352" font-family="Arial,sans-serif" font-size="19" fill="#183047">allocations, bursts, survivors</text><text x="96" y="379" font-family="Arial,sans-serif" font-size="19" fill="#183047">promotion, evacuation, GC time</text><rect x="54" y="437" width="492" height="68" rx="12" fill="#fff" stroke="#91a3b3"/><text x="74" y="478" font-family="Arial,sans-serif" font-size="21" fill="#183047">Metaspace · code · stacks · native</text><rect x="54" y="518" width="492" height="48" rx="12" fill="#fff" stroke="#91a3b3"/><text x="74" y="549" font-family="Arial,sans-serif" font-size="21" fill="#183047">Process / container margin</text></svg>
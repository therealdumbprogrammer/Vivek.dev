<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc"><title id="title">Stable post-GC heap and growing RSS</title><desc id="desc">Post-GC heap remains around 800 megabytes while RSS rises 1.4 to 2.6 gigabytes.</desc><rect class="bg" width="1080" height="540" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dashed{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.tiny{font-size:16px}.heapline{stroke:#528a80;stroke-width:6;fill:none}.rssline{stroke:#b8776c;stroke-width:6;fill:none}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dashed{stroke:#92a9bf}.heapline{stroke:#83bfb4}.rssline{stroke:#e0a499}}</style><text class="title" x="42" y="60">Stable heap, growing resident set</text><text class="body" x="60" y="112">Illustrative service measurements over three hours</text><path class="line" d="M110 378 L940 378"/><path class="line" d="M110 150 L110 378"/><text class="small" x="160" y="411" text-anchor="middle">10:00</text><text class="small" x="390" y="411" text-anchor="middle">11:00</text><text class="small" x="620" y="411" text-anchor="middle">12:00</text><text class="small" x="850" y="411" text-anchor="middle">13:00</text><path class="heapline" d="M160 327 L390 324 L620 326 L850 321"/><path class="rssline" d="M160 270 L390 228 L620 184 L850 142"/><text class="small" x="160" y="257" text-anchor="middle">1.4 GB</text><text class="small" x="390" y="215" text-anchor="middle">1.8 GB</text><text class="small" x="620" y="171" text-anchor="middle">2.2 GB</text><text class="small" x="850" y="129" text-anchor="middle">2.6 GB</text><text class="small" x="880" y="320">heap ≈800–815 MB</text><text class="small" x="945" y="137">RSS</text><rect class="gold" x="80" y="444" width="925" height="64" rx="14"/><text class="body" x="105" y="483">Investigate: heap commitment · live native memory · allocator retention · page touching</text></svg>
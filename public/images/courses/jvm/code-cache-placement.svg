<svg xmlns="http://www.w3.org/2000/svg" width="480" height="555" viewBox="0 0 480 555" role="img" aria-labelledby="title desc"><title id="title">CODE CACHE WITHIN THE PROCESS</title><desc id="desc">The Code Cache is outside the Java object heap. When segmented, it has profiled, non-profiled, and non-method code areas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="555" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">CODE CACHE WITHIN THE PROCESS</text><rect x="15" y="58" width="450" height="446" rx="16" fill="none" stroke="#9aa8bb"/><text x="240" y="85" font-size="16" text-anchor="middle">JVM process memory</text><rect x="30" y="104" width="420" height="54" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="137.0" font-size="16" text-anchor="middle">Java heap · Java objects</text><rect x="30" y="173" width="420" height="54" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="206.0" font-size="16" text-anchor="middle">Metaspace · class metadata</text><rect x="30" y="243" width="420" height="174" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="300.0" font-size="16" text-anchor="middle">Code Cache · native executable code</text><text x="240.0" y="324.0" font-size="16" text-anchor="middle">Profiled compiled code</text><text x="240.0" y="348.0" font-size="16" text-anchor="middle">Non-profiled compiled code</text><text x="240.0" y="372.0" font-size="16" text-anchor="middle">Non-method code: stubs / interpreter</text><rect x="30" y="435" width="420" height="50" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="466.0" font-size="16" text-anchor="middle">Thread stacks and other native memory</text><text x="240" y="533" font-size="13" text-anchor="middle">Region sizes are illustrative · -Xmx covers Java heap</text></g></svg>

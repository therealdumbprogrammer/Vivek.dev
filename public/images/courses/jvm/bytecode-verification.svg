<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc">
<title id="title">CHECK THE OPERAND TYPES</title><desc id="desc">iadd cannot accept a reference in place of an integer operand.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="430" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">CHECK THE OPERAND TYPES</text><text x="240" y="80" font-size="17" text-anchor="middle">iadd requires two integer operands</text><rect x="24" y="110" width="205" height="130" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="126.5" y="157.0" font-size="16" text-anchor="middle">Valid stack</text><text x="126.5" y="180.0" font-size="16" text-anchor="middle">int</text><text x="126.5" y="203.0" font-size="16" text-anchor="middle">int</text><rect x="251" y="110" width="205" height="130" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="353.5" y="157.0" font-size="16" text-anchor="middle">Invalid stack</text><text x="353.5" y="180.0" font-size="16" text-anchor="middle">reference</text><text x="353.5" y="203.0" font-size="16" text-anchor="middle">int</text><path d="M127 242 L127 282" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><path d="M354 242 L354 282" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="24" y="287" width="205" height="70" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="126.5" y="315.5" font-size="16" text-anchor="middle">Types fit</text><text x="126.5" y="338.5" font-size="16" text-anchor="middle">continue</text><rect x="251" y="287" width="205" height="70" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="353.5" y="315.5" font-size="16" text-anchor="middle">Types conflict</text><text x="353.5" y="338.5" font-size="16" text-anchor="middle">VerifyError</text><text x="240" y="402" font-size="15" text-anchor="middle">A teaching example, not a full verifier trace.</text></g></svg>
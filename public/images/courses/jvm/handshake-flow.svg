<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Simplified handshake flow</title><desc id="desc">A request is queued, the target poll is armed, the target reaches a safe state, callback work runs, and execution continues.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="640" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">A target JavaThread completes a handshake</text><g font-family="system-ui,sans-serif" text-anchor="middle" font-size="18"><g fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"><rect x="70" y="110" width="220" height="78" rx="17"/><rect x="370" y="110" width="220" height="78" rx="17"/><rect x="670" y="110" width="220" height="78" rx="17"/></g><text x="180" y="142" font-weight="700">1 · Select target</text><text x="180" y="168">queue operation</text><text x="480" y="142" font-weight="700">2 · Arm local poll</text><text x="480" y="168">request becomes visible</text><text x="780" y="142" font-weight="700">3 · Thread runs</text><text x="780" y="168">toward a suitable point</text><g fill="#fff3d6" stroke="#bd7a28" stroke-width="3"><rect x="670" y="355" width="220" height="78" rx="17"/><rect x="370" y="355" width="220" height="78" rx="17"/></g><text x="780" y="387" font-weight="700" fill="#7a4614">4 · Safe state</text><text x="780" y="413" fill="#54391d">enter runtime</text><text x="480" y="387" font-weight="700" fill="#7a4614">5 · Run callback</text><text x="480" y="413" fill="#54391d">target-specific work</text><rect x="70" y="355" width="220" height="78" rx="17" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="180" y="387" font-weight="700" fill="#185b42">6 · Complete</text><text x="180" y="413" fill="#244c3d">continue Java execution</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M290 149H370"/><path d="M590 149H670"/><path d="M780 188V355"/><path d="M670 394H590"/><path d="M370 394H290"/></g><text x="480" y="530" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#475569">Simplified path: exact handling depends on target state and closure rules.</text></svg>

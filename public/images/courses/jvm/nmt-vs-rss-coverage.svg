<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">NMT and RSS observe overlapping realities</title><desc id="desc">NMT accounts for tracked HotSpot operations; RSS counts resident process pages, including some untracked mappings.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="590" rx="22"/><text class="title" x="42" y="60">NMT and RSS observe overlapping realities</text><rect class="teal" x="55" y="120" width="455" height="340" rx="14"/><rect class="gold" x="570" y="120" width="455" height="340" rx="14"/><text class="head" x="282" y="165" text-anchor="middle">NMT · HotSpot tracked</text><text class="head" x="797" y="165" text-anchor="middle">RSS · OS resident pages</text><text class="body" x="90" y="230">Tagged malloc: live requests</text><text class="body" x="90" y="290">Virtual: reserved / committed</text><text class="body" x="90" y="350">Arena: backing chunks</text><text class="body" x="90" y="410">No residency measurement</text><text class="body" x="605" y="230">Touched HotSpot pages</text><text class="body" x="605" y="290">Native library mappings</text><text class="body" x="605" y="350">Allocator-retained pages</text><text class="body" x="605" y="410">File-backed and shared pages</text><rect class="rose" x="160" y="493" width="760" height="66" rx="14"/><text class="head" x="540" y="535" text-anchor="middle">RSS − NMT committed ≠ leaked bytes</text></svg>
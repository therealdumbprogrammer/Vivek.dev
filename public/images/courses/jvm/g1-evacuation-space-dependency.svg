<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc"><title id="title">Evacuation needs a destination</title><desc id="desc">Live objects must fit elsewhere before the source region is reusable.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#72859b"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#25344a}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line{stroke:#a9b9cd}}</style><rect width="1080" height="450" rx="22" class="bg"/><text x="36" y="51" class="title">Evacuation needs a destination</text><text x="36" y="83" class="sub">One selected source region contains live data and garbage.</text><rect x="40" y="145" width="420" height="145" rx="14" class="card"/><text x="60" y="175" class="head">Source region</text><rect x="65" y="205" width="92" height="48" rx="5" class="blue"/><text x="82" y="235" class="body">Live</text><rect x="160" y="205" width="92" height="48" rx="5" class="rose"/><text x="175" y="235" class="body">Dead</text><rect x="255" y="205" width="92" height="48" rx="5" class="blue"/><text x="273" y="235" class="body">Live</text><rect x="350" y="205" width="75" height="48" rx="5" class="rose"/><text x="359" y="235" class="body">Dead</text><path d="M475 222 L580 222" class="line" marker-end="url(#arrow)"/><rect x="600" y="145" width="420" height="145" rx="14" class="mint"/><text x="620" y="175" class="head">Destination: enough room</text><rect x="627" y="205" width="95" height="48" rx="5" class="blue"/><text x="644" y="235" class="body">Live</text><rect x="725" y="205" width="95" height="48" rx="5" class="blue"/><text x="742" y="235" class="body">Live</text><rect x="823" y="205" width="170" height="48" rx="5" class="card"/><text x="867" y="235" class="body">Free</text><path d="M250 302 L250 360" class="line" marker-end="url(#arrow)"/><text x="58" y="398" class="head">Source can now be reused as a whole.</text><text x="600" y="355" class="body">If this space is unavailable, live objects stay</text><text x="600" y="384" class="body">in the source and it cannot be freed.</text></svg>
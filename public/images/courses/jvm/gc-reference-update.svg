<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">A move changes every route to B</title><desc id="desc">Root and object-field references must resolve to the moved survivor.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="450" rx="22" fill="#f8fafc"/>
<text x="30" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">A move changes every route to B</text>
<rect x="40" y="130" width="170" height="80" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="125.0" y="177.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Root → B</text><rect x="40" y="250" width="170" height="80" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="125.0" y="297.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">A.field → B</text><rect x="360" y="165" width="170" height="100" rx="14" fill="#eef1f5" stroke="#9aafc2" stroke-width="2"/><text x="445.0" y="222.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">B: old address</text><rect x="680" y="165" width="170" height="100" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="765.0" y="222.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">B: new address</text><path d="M210 170 L680 200" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><text x="445.0" y="176.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#52657a">repair or resolve</text><path d="M210 290 L680 235" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><text x="445.0" y="253.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#52657a">repair or resolve</text><path d="M530 215 L680 215" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><text x="605.0" y="206.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#52657a">move</text>
<rect x="25" y="377" width="850" height="48" rx="10" fill="white" stroke="#d5dfe8"/>
<text x="450" y="407" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="500" fill="#52657a">The old location can be reused only under a valid reference protocol.</text>
</svg>
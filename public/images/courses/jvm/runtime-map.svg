<svg xmlns="http://www.w3.org/2000/svg" width="480" height="820" viewBox="0 0 480 820" role="img" aria-labelledby="title desc"><title id="title">Four responsibilities inside HotSpot</title><desc id="desc">Class loading, execution, runtime memory and runtime services. The numbers organize the tour, not an execution sequence.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dce3ec"/></pattern></defs><g font-family="system-ui, -apple-system, sans-serif"><rect width="480" height="820" rx="24" fill="#f7f9fc"/><rect width="480" height="820" rx="24" fill="url(#dots)"/><rect x="16" y="16" width="448" height="788" rx="22" fill="#fff"/><text x="38" y="54" font-size="14" fill="#315dcc" font-weight="750">MEET THE JVM</text><text x="38" y="92" font-size="29" fill="#17243c" font-weight="700">What happens inside?</text><text x="38" y="121" font-size="17" fill="#334155" font-weight="400">A guided tour of HotSpot</text><rect x="32" y="150" width="416" height="136" rx="17" fill="#edf2ff"/><text x="50" y="178" font-size="13" fill="#315dcc" font-weight="750">01</text><text x="50" y="208" font-size="24" fill="#17243c" font-weight="650">Class loading</text><text x="50" y="235" font-size="17" fill="#334155" font-weight="400">Bring classes into the runtime.</text><text x="50" y="258" font-size="16" fill="#315dcc" font-weight="450">Your classes + library classes</text><g transform="translate(402 182)" fill="none" stroke="#315dcc" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M-13 -5 h9 l4 4 h13 v17 h-26z M0 -16 v13 m-5 -5 l5 5 5 -5"/></g><rect x="32" y="300" width="416" height="136" rx="17" fill="#e5f5ef"/><text x="50" y="328" font-size="13" fill="#087b6f" font-weight="750">02</text><text x="50" y="358" font-size="24" fill="#17243c" font-weight="650">Execution</text><text x="50" y="385" font-size="17" fill="#334155" font-weight="400">Turn instructions into work.</text><text x="50" y="408" font-size="16" fill="#087b6f" font-weight="450">Interpreter + JIT compiler</text><g transform="translate(402 332)" fill="none" stroke="#087b6f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle r="16"/><path d="M-4 -7 l11 7 -11 7z"/></g><rect x="32" y="450" width="416" height="136" rx="17" fill="#fff2df"/><text x="50" y="478" font-size="13" fill="#91551e" font-weight="750">03</text><text x="50" y="508" font-size="24" fill="#17243c" font-weight="650">Runtime memory</text><text x="50" y="535" font-size="17" fill="#334155" font-weight="400">Give the program room to work.</text><text x="50" y="558" font-size="16" fill="#91551e" font-weight="450">Heap · stacks · Metaspace</text><text x="50" y="577" font-size="16" fill="#91551e" font-weight="450">Code cache · other native memory</text><g transform="translate(402 482)" fill="none" stroke="#91551e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-11" width="22" height="22" rx="3"/><path d="M-5 -17 v6 M5 -17 v6 M-5 11 v6 M5 11 v6 M-17 -5 h6 M-17 5 h6 M11 -5 h6 M11 5 h6"/></g><rect x="32" y="600" width="416" height="136" rx="17" fill="#f4ecfb"/><text x="50" y="628" font-size="13" fill="#7943a3" font-weight="750">04</text><text x="50" y="658" font-size="24" fill="#17243c" font-weight="650">Runtime services</text><text x="50" y="685" font-size="17" fill="#334155" font-weight="400">Manage the work as it runs.</text><text x="50" y="708" font-size="16" fill="#7943a3" font-weight="450">GC · threads · synchronization</text><text x="50" y="727" font-size="16" fill="#7943a3" font-weight="450">Safepoints</text><g transform="translate(402 632)" fill="none" stroke="#7943a3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 -9 h30 M-15 2 h30 M-15 13 h30"/><circle cx="-5" cy="-9" r="4" fill="#f4ecfb"/><circle cx="8" cy="2" r="4" fill="#f4ecfb"/><circle cx="-5" cy="13" r="4" fill="#f4ecfb"/></g><text x="38" y="784" font-size="16" fill="#475569" font-weight="550">Working together throughout the program’s life</text></g></svg>
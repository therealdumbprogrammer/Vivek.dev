<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Complete safepoint coordination model</title><desc id="desc">Threads, polls and state transitions lead to a global safepoint where metadata supports VM operations before execution resumes.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="660" rx="28" fill="#fffdf9"/><text x="480" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Execution stays fast while HotSpot stays in control</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="45" y="95" width="235" height="120" rx="20" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="162" y="137" font-size="21" font-weight="700" fill="#172033">Java threads</text><text x="162" y="170" font-size="17" fill="#475569">compiled · interpreted</text><text x="162" y="195" font-size="17" fill="#475569">blocked · native</text><rect x="360" y="95" width="235" height="120" rx="20" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="477" y="137" font-size="21" font-weight="700" fill="#7a4614">Cooperation</text><text x="477" y="170" font-size="17" fill="#54391d">polls · transitions</text><text x="477" y="195" font-size="17" fill="#54391d">accountable states</text><rect x="675" y="95" width="235" height="120" rx="20" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="792" y="137" font-size="21" font-weight="700" fill="#185b42">Global safepoint</text><text x="792" y="170" font-size="17" fill="#244c3d">required threads</text><text x="792" y="195" font-size="17" fill="#244c3d">are safe</text><rect x="105" y="355" width="250" height="120" rx="20" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="230" y="397" font-size="21" font-weight="700" fill="#4d3475">Runtime metadata</text><text x="230" y="430" font-size="17" fill="#4d3475">OopMaps · frames</text><text x="230" y="455" font-size="17" fill="#4d3475">deoptimization state</text><rect x="445" y="325" width="390" height="185" rx="22" fill="#fff" stroke="#4f6f9f" stroke-width="3"/><text x="640" y="368" font-size="21" font-weight="700" fill="#172033">VM operation uses known state</text><g font-size="18" fill="#475569"><text x="550" y="414">GC roots</text><text x="730" y="414">stack walking</text><text x="550" y="454">deoptimization</text><text x="730" y="454">other VM work</text></g><rect x="300" y="565" width="360" height="65" rx="18" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="480" y="605" font-size="21" font-weight="700" fill="#185b42">release → resume application execution</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M280 155H360"/><path d="M595 155H675"/><path d="M792 215C792 270 700 275 680 325"/><path d="M355 415H445"/><path d="M640 510C640 545 560 565 545 565"/></g><text x="480" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#475569">synchronization time precedes operation time</text>

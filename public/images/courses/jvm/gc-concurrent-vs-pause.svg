<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Concurrent work and pause time</title><desc id="desc">Concurrent Mark overlaps the running application, while Remark is a short stop-the-world interval.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Concurrent work and pause time</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687c8c"/></marker></defs><rect x="60" y="100" width="780" height="80" rx="13" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="450.0" y="147.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="600" fill="#183047">Application runs</text><rect x="180" y="210" width="440" height="75" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="400.0" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#183047">Concurrent Mark overlaps application</text><rect x="620" y="210" width="135" height="75" rx="13" fill="#fff0d2" stroke="#687c8c" stroke-width="2"/><text x="687.5" y="254.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">Remark</text><path d="M180 192 L180 210" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M685 180 L685 210" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#183047">Wall-clock collector activity ≠ stop-the-world pause</text></svg>
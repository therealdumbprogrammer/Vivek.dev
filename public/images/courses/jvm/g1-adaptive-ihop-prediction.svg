<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-labelledby="title desc"><title id="title">Adaptive IHOP estimates runway</title><desc id="desc">Earlier marking start leaves time for old growth while marking finishes.</desc><rect class="bg" width="1080" height="550" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.accent{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.bar{fill:#91bdb5}.line{stroke:#647b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.accent{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.bar{fill:#6aa79c}text{fill:#edf2fa}.line,.plain{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b91" stroke-width="1.8"/></marker></defs><text class="title" x="42" y="58">Adaptive IHOP estimates runway</text><path class="plain" d="M105 385 L1000 385"/><path class="plain" d="M105 385 L105 120"/><text class="note" x="43" y="105">old use</text><text class="note" x="877" y="420">time →</text><path class="plain" d="M115 370 L940 170"/><path class="dash" d="M180 232 L940 232"/><text class="note" x="775" y="220">headroom boundary</text><rect class="bar" x="392" y="330" width="360" height="26" rx="5"/><text class="body" x="394" y="315">concurrent marking window</text><path class="dash" d="M397 385 L397 240"/><path class="dash" d="M752 385 L752 240"/><text c
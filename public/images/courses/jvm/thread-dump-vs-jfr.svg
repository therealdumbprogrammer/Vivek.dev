<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">Snapshot and interval</title><desc id="desc">A stack at one instant cannot establish duration</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="450" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">Snapshot and interval</text><text x="36" y="74" class="sub">Thread.print and virtual-thread file dumps provide snapshots; JFR gives a timeline.</text><rect x="36" y="108" width="420" height="290" rx="15" class="accent"/><text x="54" y="138" class="head">Thread dump</text><text x="54" y="164" class="body">10:00:00 — one point in time</text><text x="54" y="184" class="body">worker: RUNNABLE in calculate()</text><text x="54" y="204" class="body">Question: what is visible now?</text><rect x="504" y="108" width="420" height="290" rx="15" class="mint"/><text x="522" y="138" class="head">JFR recording</text><text x="522" y="164" class="body">10:00–10:02 — configured events</text><text x="522" y="184" class="body">CPU samples • GC • locks • I/O</text><text x="522" y="204" class="body">Question: what happened over time?</text><text x="65" y="345" class="small">Repeat snapshots to add context.</text><text x="533" y="345" class="small">Sampling is not a full execution trace.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Performance follows contention and work</title><desc id="desc">Uncontended locking uses a fast path. Contention can add queueing, spinning, parking, wakeups and cache-coherence costs around the protected work.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#23364a}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:17px}.tiny{font-size:15px}.muted{fill:#5c6d7a}.card{fill:#fff;stroke:#9caeba;stroke-width:2}.blue{fill:#e7f0f7;stroke:#547fa8;stroke-width:3}.teal{fill:#e7f2ef;stroke:#57998f;stroke-width:3}.clay{fill:#fbede6;stroke:#d48763;stroke-width:3}.gold{fill:#fbf4df;stroke:#c8a34f;stroke-width:3}.arrow{stroke:#547fa8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547fa8"/></marker></defs><rect width="960" height="540" rx="24" fill="#fbfaf7"/><text x="48" y="56" class="title">Performance follows contention and work</text><rect x="50" y="180" width="245" height="140" rx="18" class="teal"/><text x="172.5" y="242.0" text-anchor="middle" class="label">Uncontended</text><text x="172.5" y="273.0" text-anchor="middle" class="small muted">short fast path</text><path d="M295 250 L380 250" class="arrow"/><text x="337.5" y="240.0" text-anchor="middle" class="small muted">busy</text><rect x="385" y="150" width="250" height="200" rx="18" class="gold"/><text x="510.0" y="242.0" text-anchor="middle" class="label">Coordination</text><text x="510.0" y="273.0" text-anchor="middle" class="small muted">queue · spin · park · wake</text><path d="M635 250 L710 250" class="arrow"/><text x="672.5" y="240.0" text-anchor="middle" class="small muted">costs</text><rect x="715" y="150" width="200" height="200" rx="18" class="clay"/><text x="815.0" y="242.0" text-anchor="middle" class="label">Critical section</text><text x="815.0" y="273.0" text-anchor="middle" class="small muted">duration + useful work</text><rect x="190" y="410" width="580" height="70" rx="18" class="card"/><text x="480.0" y="445.0" text-anchor="middle" class="small">Measure the wait and workload impact; the keyword alone is no diagnosis</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">Metadata guides the allocation</title><desc id="desc">Class preparation establishes the instance layout before repeated allocations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:1.5}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:1.5}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:1.5}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:1.5}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:1.5}.line{fill:none;stroke:#7b8ba0;stroke-width:2}.dash{fill:none;stroke:#8898aa;stroke-width:1.5;stroke-dasharray:6 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}.tag{font-size:16px;font-weight:700;letter-spacing:.06em;fill:#466189}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.tag{fill:#a9c2ef}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="440" rx="22" class="bg"/><text x="36" y="49" class="title">Metadata guides the allocation</text><text x="36" y="77" class="sub">Class preparation establishes the instance layout before repeated allocations.</text><rect x="36" y="130" width="235" height="230" rx="15" class="card"/><text x="54" y="161" class="head">ConstantPool</text><text x="54" y="190" class="body">symbolic Order entry</text><text x="54" y="216" class="body">new #…</text><rect x="306" y="130" width="245" height="230" rx="15" class="blue"/><text x="324" y="161" class="head">InstanceKlass</text><text x="324" y="190" class="body">prepared size + layout</text><text x="324" y="216" class="body">initialization state</text><rect x="590" y="130" width="454" height="230" rx="15" class="mint"/><text x="608" y="161" class="head">Heap instance</text><text x="608" y="190" class="body">header / class identity</text><text x="608" y="216" class="body">id: long    quantity: int</text><text x="608" y="242" class="body">customer: reference  + padding</text><path d="M271 245 L304 245" class="line" marker-end="url(#arrow)"/><path d="M551 245 L588 245" class="line" marker-end="url(#arrow)"/><text x="36" y="396" class="small">Field order, header format and padding vary by build and configuration.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">G1 selects regions to evacuate</title><desc id="desc">Selected young and candidate old regions move survivors into destination regions; other regions remain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="470" rx="22" fill="#f8fafc"/>
<text x="30" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">G1 selects regions to evacuate</text>
<text x="42" y="112" text-anchor="start" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Regional heap</text><rect x="40" y="135" width="150" height="83" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="115.0" y="183.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Young</text><rect x="205" y="135" width="150" height="83" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="280.0" y="183.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Young</text><rect x="370" y="135" width="150" height="83" rx="14" fill="#eef1f5" stroke="#9aafc2" stroke-width="2"/><text x="445.0" y="183.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Old</text><rect x="535" y="135" width="150" height="83" rx="14" fill="#fff2d8" stroke="#9aafc2" stroke-width="2"/><text x="610.0" y="183.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Old selected</text><rect x="700" y="135" width="150" height="83" rx="14" fill="#eef1f5" stroke="#9aafc2" stroke-width="2"/><text x="775.0" y="183.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Old</text><path d="M200 245 L600 305" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><text x="400.0" y="266.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#52657a">selected survivors</text><path d="M695 245 L600 305" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="305" width="280" height="72" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="600.0" y="348.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Destination regions</text>
<rect x="25" y="397" width="850" height="48" rx="10" fill="white" stroke="#d5dfe8"/>
<text x="450" y="427" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="500" fill="#52657a">The collection set is a subset of regional heap space.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Thread identity and execution</title><desc id="desc">Virtual threads mount on carriers temporarily</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="500" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">Thread identity and execution</text><text x="36" y="74" class="sub">Thread is also a C++ base with JavaThread and NonJavaThread subclasses.</text><rect x="36" y="122" width="270" height="120" rx="15" class="accent"/><text x="54" y="152" class="head">Platform java.lang.Thread</text><text x="54" y="178" class="body">Heap identity</text><rect x="344" y="122" width="270" height="120" rx="15" class="mint"/><text x="362" y="152" class="head">JavaThread + OSThread</text><text x="362" y="178" class="body">Native VM and OS execution</text><rect x="652" y="122" width="272" height="120" rx="15" class="card"/><text x="670" y="152" class="head">Physical stack</text><text x="670" y="178" class="body">Frames, JNI, roots</text><path d="M306 181 L342 181" class="line" marker-end="url(#arrow)"/><path d="M614 181 L650 181" class="line" marker-end="url(#arrow)"/><rect x="36" y="308" width="270" height="120" rx="15" class="amber"/><text x="54" y="338" class="head">Virtual java.lang.Thread</text><text x="54" y="364" class="body">Heap identity survives unmount</text><rect x="344" y="308" width="270" height="120" rx="15" class="mint"/><text x="362" y="338" class="head">Carrier JavaThread</text><text x="362" y="364" class="body">May change after remount</text><rect x="652" y="308" width="272" height="120" rx="15" class="card"/><text x="670" y="338" class="head">Current execution</text><text x="670" y="364" class="body">Uses carrier resources</text><path d="M306 367 L342 367" class="line" marker-end="url(#arrow)"/><text x="332.0" y="360.0" class="small">mounts</text><path d="M614 367 L650 367" class="line" marker-end="url(#arrow)"/><text x="40" y="470" class="small">No permanent one-to-one virtual-thread ↔ JavaThread or OS-thread mapping.</text></svg>
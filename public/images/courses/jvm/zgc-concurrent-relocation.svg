<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Relocation overlaps execution</title><desc id="desc">A mutator continues loading references while ZGC relocates objects from a selected ZPage.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Relocation overlaps execution</text><text x="120" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Mutator</text><text x="120" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">ZGC</text><rect x="225" y="105" width="575" height="58" rx="12" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="512" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">load A.child → continue using B</text><rect x="225" y="220" width="575" height="58" rx="12" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="512" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Relocation Set → copy B → forwarding</text><path d="M490 218 L490 170" fill="none" stroke="#536779" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="490.0" y="182.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#183047">old-looking ref</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">The overlap creates the stale-reference problem.</text></svg>
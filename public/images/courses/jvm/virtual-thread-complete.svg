<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">One Java-thread lifetime</title><desc id="desc">V1 starts, mounts on A, suspends with heap-managed state while A serves another task, becomes runnable, mounts on B, and completes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="510" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">One Java-thread lifetime</text><text x="320" y="84" text-anchor="middle" font-size="19" font-weight="400" fill="#243247">V1 retains its identity across every stage</text><rect x="50" y="113" width="230" height="64" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="165.0" y="152.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Start → runnable</text><path d="M280 145 L350 145" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="113" width="240" height="64" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="470.0" y="152.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Mount on A → run</text><path d="M470 177 L470 222" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="222" width="240" height="88" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="470.0" y="260.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Supported wait</text><text x="470.0" y="286.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Unmount; state saved</text><path d="M350 266 L280 266" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="222" width="230" height="88" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="165.0" y="260.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">I/O ready</text><text x="165.0" y="286.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Runnable again</text><path d="M165 310 L165 360" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="360" width="230" height="76" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="165.0" y="392.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Mount on B → run</text><text x="165.0" y="418.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">A may serve V2</text><path d="M280 398 L350 398" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="360" width="240" height="76" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="470.0" y="392.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Task completes</text><text x="470.0" y="418.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">V1 terminates</text><text x="320" y="482" text-anchor="middle" font-size="17" font-weight="400" fill="#243247">A and B may be the same carrier; reuse is independent.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">The young-to-old lifecycle</title><desc id="desc">Marking discovers candidates; mixed pauses evacuate selected Old regions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="520" rx="22" class="bg"/><text x="36" y="51" class="title">The young-to-old lifecycle</text><text x="36" y="81" class="sub">Marking discovers candidates; mixed pauses evacuate selected Old regions.</text><rect x="36" y="155" width="230" height="260" rx="18" class="blue"/><text x="56" y="192" class="head">Eden</text><text x="56" y="229" class="body">TLAB allocation</text><text x="56" y="257" class="body">young STW pause</text><text x="56" y="285" class="body">dead objects disappear</text><rect x="296" y="155" width="230" height="260" rx="18" class="amber"/><text x="316" y="192" class="head">Survivors</text><text x="316" y="229" class="body">copy live objects</text><text x="316" y="257" class="body">some promote</text><text x="316" y="285" class="body">Old pressure grows</text><rect x="556" y="155" width="230" height="260" rx="18" class="mint"/><text x="576" y="192" class="head">Marking</text><text x="576" y="229" class="body">Concurrent Start</text><text x="576" y="257" class="body">SATB + concurrent mark</text><text x="576" y="285" class="body">Remark · Cleanup</text><rect x="816" y="155" width="230" height="260" rx="18" class="blue"/><text x="836" y="192" class="head">Mixed GC</text><text x="836" y="229" class="body">young + selected Old</text><text x="836" y="257" class="body">STW evacuation</text><text x="836" y="285" class="body">regions reusable</text><path d="M270 280 L290 280" class="line" marker-end="url(#arrow)"/><path d="M530 280 L550 280" class="line" marker-end="url(#arrow)"/><path d="M790 280 L810 280" class="line" marker-end="url(#arrow)"/><text x="36" y="475" class="small">Several mixed pauses may follow one marking cycle.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Trace the reachable graph</title><desc id="desc">Root paths reach A through E; the F/G cycle is disconnected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="470" rx="22" fill="#f8fafc"/>
<text x="30" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">Trace the reachable graph</text>
<rect x="35" y="105" width="180" height="65" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="125.0" y="144.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Stack root</text><rect x="35" y="205" width="180" height="65" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="125.0" y="244.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Static root</text><rect x="340" y="105" width="95" height="60" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="387.5" y="142.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">A</text><rect x="530" y="90" width="95" height="60" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="577.5" y="127.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">B</text><rect x="530" y="175" width="95" height="60" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="577.5" y="212.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">C</text><rect x="340" y="260" width="95" height="60" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="387.5" y="297.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">D</text><rect x="530" y="260" width="95" height="60" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="577.5" y="297.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">E</text><rect x="695" y="125" width="95" height="60" rx="14" fill="#eef1f5" stroke="#9aafc2" stroke-width="2"/><text x="742.5" y="162.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">F</text><rect x="695" y="235" width="95" height="60" rx="14" fill="#eef1f5" stroke="#9aafc2" stroke-width="2"/><text x="742.5" y="272.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">G</text><path d="M215 137 L340 137" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><path d="M215 237 L340 290" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><path d="M435 137 L530 120" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><path d="M435 137 L530 205" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><path d="M435 290 L530 290" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><path d="M742 185 L742 235" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 265 H825 V155 H790" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#19324d">A–E reachable    ·    F ↔ G disconnected</text>
<rect x="25" y="397" width="850" height="48" rx="10" fill="white" stroke="#d5dfe8"/>
<text x="450" y="427" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="500" fill="#52657a">A reference cycle can be garbage when no root reaches it.</text>
</svg>
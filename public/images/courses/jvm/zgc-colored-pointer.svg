<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">A conceptual colored reference</title><desc id="desc">An object reference carries location information and GC metadata so the barrier can quickly classify its state. This does not show an exact bit layout.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">A conceptual colored reference</text><rect x="68" y="148" width="300" height="120" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="218.0" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Object location</text><text x="218.0" y="227.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">where B is found</text><rect x="368" y="148" width="210" height="120" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="473.0" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">GC metadata</text><text x="473.0" y="227.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">reference state</text><path d="M583 208 L640 208" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="148" width="190" height="120" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="745.0" y="201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Barrier</text><text x="745.0" y="227.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">fast decision</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">Exact pointer bits are implementation details.</text></svg>
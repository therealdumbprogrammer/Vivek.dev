<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc"><title id="title">The source type changes the opcode</title><desc id="desc">Both displayed calls have a receiver; the declared type chooses the bytecode form.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:1.5}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:1.5}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:1.5}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:1.5}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:1.5}.line{fill:none;stroke:#7b8ba0;stroke-width:2}.dash{fill:none;stroke:#8898aa;stroke-width:1.5;stroke-dasharray:6 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}.tag{font-size:16px;font-weight:700;letter-spacing:.06em;fill:#466189}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.tag{fill:#a9c2ef}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="400" rx="22" class="bg"/><text x="36" y="49" class="title">The source type changes the opcode</text><text x="36" y="77" class="sub">Both displayed calls have a receiver; the declared type chooses the bytecode form.</text><rect x="36" y="130" width="460" height="210" rx="15" class="blue"/><text x="54" y="161" class="head">Payment interface</text><text x="54" y="190" class="body">payment.process()</text><text x="54" y="216" class="body">invokeinterface</text><text x="54" y="242" class="body">receiver supplies implementation</text><rect x="584" y="130" width="460" height="210" rx="15" class="mint"/><text x="602" y="161" class="head">BasePayment class</text><text x="602" y="190" class="body">base.process()</text><text x="602" y="216" class="body">invokevirtual</text><text x="602" y="242" class="body">receiver supplies override</text><text x="36" y="378" class="small">invokespecial, invokestatic and invokedynamic have different invocation rules.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">A disappearing edge</title><desc id="desc">Root to A to B at mark start; A changes to C before marker visits B.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">A disappearing edge</text><rect x="55" y="110" width="215" height="94" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="162.5" y="150.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">At mark start</text><text x="162.5" y="175.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Root → A → B</text><rect x="340" y="110" width="220" height="94" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="150.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Application writes</text><text x="450.0" y="175.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">A.child = C</text><rect x="630" y="110" width="215" height="94" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="737.5" y="150.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Current graph</text><text x="737.5" y="175.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Root → A → C</text><rect x="335" y="285" width="230" height="80" rx="14" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="331.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">B can be missed</text><path d="M270 157 L335 157" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="302.5" y="146.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">write</text><path d="M560 157 L625 157" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="592.5" y="146.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">new graph</text><path d="M738 209 L564 307" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="651.0" y="247.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">old edge lost</text><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">B belonged to the beginning-of-cycle live graph.</text></svg>

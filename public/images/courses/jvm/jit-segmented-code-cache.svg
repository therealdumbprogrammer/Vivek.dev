<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">The Code Cache has distinct regions</title><desc id="desc">Tiered HotSpot commonly separates three kinds of generated code</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#24354b}.bg{fill:#f8fafc}.card{fill:#fff;stroke:#aebed0;stroke-width:2}.blue{fill:#e8f0fc;stroke:#6685b0;stroke-width:2}.teal{fill:#e5f4ef;stroke:#5d9b89;stroke-width:2}.amber{fill:#fff3df;stroke:#bd9654;stroke-width:2}.rose{fill:#f9ecee;stroke:#bc7f89;stroke-width:2}.line{stroke:#657b95;stroke-width:3;fill:none}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52667f}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52667f}@media(prefers-color-scheme:dark){.bg{fill:#182330}.card{fill:#263647;stroke:#61778f}.blue{fill:#243b59;stroke:#87a7db}.teal{fill:#22443d;stroke:#80c3b1}.amber{fill:#4b3d2b;stroke:#dfb976}.rose{fill:#49333e;stroke:#daa1aa}text{fill:#edf3fa}.sub,.small{fill:#c5d3e2}.line{stroke:#abc0d7}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8094aa"/></marker></defs><rect width="1080" height="390" rx="22" class="bg"/><text x="36" y="50" class="title">The Code Cache has distinct regions</text><text x="36" y="80" class="sub">Tiered HotSpot commonly separates three kinds of generated code</text><rect x="36" y="145" width="310" height="180" rx="15" class="card"/><text x="54" y="181" class="head">Non-method</text><text x="54" y="214" class="body">Runtime stubs and</text><text x="54" y="241" class="body">other generated code</text><rect x="385" y="145" width="310" height="180" rx="15" class="blue"/><text x="403" y="181" class="head">Profiled method</text><text x="403" y="214" class="body">C1 code that can</text><text x="403" y="241" class="body">collect profiles</text><rect x="734" y="145" width="310" height="180" rx="15" class="teal"/><text x="752" y="181" class="head">Non-profiled method</text><text x="752" y="214" class="body">Optimized code</text><text x="752" y="241" class="body">including C2 nmethods</text><text x="36" y="364" class="small">Reservation and heap sizes depend on flags and ergonomics.</text></svg>
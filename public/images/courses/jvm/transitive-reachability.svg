<svg xmlns="http://www.w3.org/2000/svg" width="480" height="590" viewBox="0 0 480 590" role="img" aria-labelledby="title desc"><title id="title">ONE PATH REACHES THE CHAIN</title><desc id="desc">ONE PATH REACHES THE CHAIN. Arrows indicate strong references; root labels represent reference starting points.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="590" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="35" font-size="19" fill="#334155">ONE PATH REACHES THE CHAIN</text><text x="24" y="80" font-size="20" fill="#334155">1 · Entry path present</text><text x="26" y="145" font-size="18" fill="#334155">Root reference</text><path d="M160 138 L197 138" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="212" y="113" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="226" y="144" font-size="19" fill="#334155">A</text><path d="M278 137 L311 137" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="113" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="144" font-size="19" fill="#334155">B</text><path d="M352 164 L352 208" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="221" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="252" font-size="19" fill="#334155">C</text><text x="24" y="300" font-size="20" fill="#334155">2 · Only entry path removed</text><text x="26" y="365" font-size="18" fill="#334155">Root reference</text><text x="169" y="365" font-size="24" fill="#334155">×</text><rect x="212" y="333" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="226" y="364" font-size="19" fill="#334155">A</text><path d="M278 357 L311 357" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="333" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="364" font-size="19" fill="#334155">B</text><path d="M352 384 L352 428" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="441" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="472" font-size="19" fill="#334155">C</text><text x="24" y="545" font-size="19" fill="#334155">A, B, C: unreachable together</text><text x="24" y="572" font-size="16" fill="#334155">Assumption: no other root paths.</text></g></svg>
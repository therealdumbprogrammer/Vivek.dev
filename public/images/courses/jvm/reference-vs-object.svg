<svg xmlns="http://www.w3.org/2000/svg" width="480" height="630" viewBox="0 0 480 630" role="img" aria-labelledby="title desc">
<title id="title">A slot inside Person, a separate Address</title><desc id="desc">The address reference contributes to Person shallow size; Address is another object.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker><pattern id="gap" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f1f5f9"/><path d="M0 6 L6 0" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="480" height="630" rx="24" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif"><text x="26" y="36" font-size="16" fill="#334155" font-weight="650">REFERENCE ≠ REFERENCED OBJECT</text><rect x="30" y="59" width="420" height="280" rx="12" fill="none" stroke="#315dcc" stroke-width="2"/><text x="50" y="91" font-size="22" fill="#334155" font-weight="650">Person · its own shallow size</text><rect x="50" y="111" width="380" height="40" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="67" y="138" font-size="19" fill="#334155" font-weight="400">Header</text><rect x="50" y="159" width="380" height="40" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="67" y="186" font-size="19" fill="#334155" font-weight="400">age + salary</text><rect x="50" y="207" width="380" height="40" rx="12" fill="#e9efff" stroke="#dce5ef" stroke-width="2"/><text x="67" y="234" font-size="19" fill="#334155" font-weight="400">address reference</text><rect x="50" y="255" width="380" height="40" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="67" y="282" font-size="19" fill="#334155" font-weight="400">Padding</text><path d="M430 227 L466 227 L466 399 L240 399 L240 421" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="264" y="372" font-size="18" fill="#334155" font-weight="400">points to</text><rect x="60" y="428" width="360" height="139" rx="12" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="80" y="461" font-size="24" fill="#334155" font-weight="650">Address</text><text x="80" y="494" font-size="19" fill="#334155" font-weight="400">Header + fields + padding</text><text x="80" y="539" font-size="20" fill="#315dcc" font-weight="400">A separate shallow size</text><text x="30" y="601" font-size="18" fill="#334155" font-weight="400">Two objects · both inside the Java heap</text></g></svg>

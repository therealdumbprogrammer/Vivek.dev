<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Global safepoint and targeted handshake</title><desc id="desc">A global request coordinates four threads; a handshake targets only the selected thread.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">Global safepoint and targeted handshake</text><rect class="box" x="45" y="115" width="470" height="330" rx="15"/><rect class="box" x="565" y="115" width="470" height="330" rx="15"/><text class="head" x="280" y="160" text-anchor="middle">Global safepoint</text><text class="head" x="800" y="160" text-anchor="middle">Thread-local handshake</text><text class="body" x="90" y="220">Thread A</text><rect class="gold" x="285" y="196" width="165" height="34" rx="7"/><text class="small" x="368" y="218" text-anchor="middle">safe state</text><text class="body" x="605" y="220">Thread A</text><rect class="teal" x="800" y="196" width="165" height="34" rx="7"/><text class="small" x="882" y="218" text-anchor="middle">continues</text><text class="body" x="90" y="285">Thread B</text><rect class="gold" x="285" y="261" width="165" height="34" rx="7"/><text class="small" x="368" y="283" text-anchor="middle">safe state</text><text class="body" x="605" y="285">Thread B</text><rect class="gold" x="800" y="261" width="165" height="34" rx="7"/><text class="small" x="882" y="283" text-anchor="middle">handshake</text><text class="body" x="90" y="350">Thread C</text><rect class="gold" x="285" y="326" width="165" height="34" rx="7"/><text class="small" x="368" y="348" text-anchor="middle">safe state</text><text class="body" x="605" y="350">Thread C</text><rect class="teal" x="800" y="326" width="165" height="34" rx="7"/><text class="small" x="882" y="348" text-anchor="middle">continues</text><text class="body" x="90" y="415">Thread D</text><rect class="gold" x="285" y="391" width="165" height="34" rx="7"/><text class="small" x="368" y="413" text-anchor="middle">safe state</text><text class="body" x="605" y="415">Thread D</text><rect class="teal" x="800" y="391" width="165" height="34" rx="7"/><text class="small" x="882" y="413" text-anchor="middle">continues</text></svg>
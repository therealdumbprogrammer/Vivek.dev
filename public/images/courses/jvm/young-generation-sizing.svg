<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 506" role="img" aria-labelledby="title desc"><title id="title">Young size changes the rhythm</title><desc id="desc">Frequency and pause work both matter.</desc><rect width="600" height="506" fill="#f8fafc"/><text x="300" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183047">Young size changes the rhythm</text><rect x="28" y="105" width="544" height="96" rx="16" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="48" y="140" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Smaller young</text><text x="48" y="176" font-family="Arial,sans-serif" font-size="21" fill="#183047">more frequent GC</text><rect x="28" y="217" width="544" height="96" rx="16" fill="#e8f4e7" stroke="#91a3b3" stroke-width="2"/><text x="48" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Larger young</text><text x="48" y="288" font-family="Arial,sans-serif" font-size="21" fill="#183047">fewer GC events</text><rect x="28" y="329" width="544" height="96" rx="16" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="48" y="364" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Survival matters</text><text x="48" y="400" font-family="Arial,sans-serif" font-size="21" fill="#183047">work per event varies</text></svg>
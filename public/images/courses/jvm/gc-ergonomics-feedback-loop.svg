<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">G1 ergonomics is a feedback loop</title><desc id="desc">Runtime observations update predicted costs and later collection decisions.</desc><rect class="bg" width="1080" height="510" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.accent{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.bar{fill:#91bdb5}.line{stroke:#647b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.accent{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.bar{fill:#6aa79c}text{fill:#edf2fa}.line,.plain{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b91" stroke-width="1.8"/></marker></defs><text class="title" x="42" y="58">G1 ergonomics is a feedback loop</text><rect class="box" x="50" y="125" width="250" height="150" rx="15"/><text class="label" x="69" y="161">Workload</text><text class="body" x="69" y="190">allocation + survival</text><rect class="accent" x="414" y="125" width="250" height="150" rx="15"/><text class="label" x="433" y="161">Observe</text><text class="body" x="433" y="190">pause + old growth</text><rect class="gold" x="778" y="125" width="250" height="150" rx="15"/><text class="label" x="797" y="161">Predict</text><text class="body" x="797" y="190">cost + headroom</text><path class="line" d="M300 200 L408 200"/><path class="line" d="M664 200 L772 200"/><rect class="accent" x="370" y="337" width="340" height="105" rx="15"/><text class="label" x="389" y="373">Choose next cycle</text><text class="body" x="389" y="402">young, CSet, IHOP, workers</text><path class="plain" d="M900 276 L900 310"/><path class="line" d="M900 310 L710 375"/><path class="plain" d="M370 390 L180 390"/><path class="line" d="M180 390 L180 278"/><text class="note" x="720" y="460">Then observe again</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">Young size changes the work per pause</title><desc id="desc">Larger young areas tend to collect less often but can make each evacuation larger.</desc><rect class="bg" width="1080" height="470" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.accent{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.bar{fill:#91bdb5}.line{stroke:#647b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.accent{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.bar{fill:#6aa79c}text{fill:#edf2fa}.line,.plain{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b91" stroke-width="1.8"/></marker></defs><text class="title" x="42" y="58">Young size changes the work per pause</text><rect class="accent" x="45" y="120" width="300" height="245" rx="15"/><text class="label" x="64" y="156">Smaller young area</text><text class="body" x="64" y="185">Shorter allocation interval</text><text class="body" x="64" y="214">More frequent GC</text><text class="body" x="64" y="243">Often less to evacuate</text><rect class="gold" x="735" y="120" width="300" height="245" rx="15"/><text class="label" x="754" y="156">Larger young area</text><text class="body" x="754" y="185">Longer allocation interval</text><text class="body" x="754" y="214">Less frequent GC</text><text class="body" x="754" y="243">Potentially longer pause</text><path class="line" d="M345 240 L726 240"/><text class="label" x="388" y="196">G1 predicts a size</text><text class="body" x="405" y="290">soft pause goal</text><text class="note" x="60" y="430">Survival and remembered-reference work can change the prediction.</text></svg>
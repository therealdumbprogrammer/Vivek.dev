<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-labelledby="title desc"><title id="title">Arena-managed chunks and dedicated mappings</title><desc id="desc">Small chunks may stay in arenas after free; a sufficiently large dedicated mmap mapping can be unmapped.</desc><rect class="bg" width="1080" height="550" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dashed{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.tiny{font-size:16px}.heapline{stroke:#528a80;stroke-width:6;fill:none}.rssline{stroke:#b8776c;stroke-width:6;fill:none}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dashed{stroke:#92a9bf}.heapline{stroke:#83bfb4}.rssline{stroke:#e0a499}}</style><text class="title" x="42" y="60">Two glibc allocation paths</text><rect class="teal" x="55" y="105" width="470" height="390" rx="14"/><text class="head" x="80" y="150">Many smaller allocations</text><rect class="gold" x="555" y="105" width="470" height="390" rx="14"/><text class="head" x="580" y="150">One sufficiently large allocation</text><text class="body" x="90" y="203">malloc → arena-managed chunks</text><text class="body" x="90" y="249">live   free   live   free   live</text><rect class="box" x="90" y="267" width="385" height="59" rx="14"/><rect class="teal" x="108" y="277" width="65" height="39" rx="4"/><rect class="muted" x="179" y="277" width="65" height="39" rx="4"/><rect class="teal" x="250" y="277" width="65" height="39" rx="4"/><rect class="muted" x="321" y="277" width="65" height="39" rx="4"/><rect class="teal" x="392" y="277" width="65" height="39" rx="4"/><text class="body" x="90" y="379">free(): chunks may stay for reuse</text><text class="body" x="90" y="425">RSS may stay elevated</text><text class="body" x="590" y="203">malloc → dedicated mmap mapping</text><rect class="box" x="590" y="246" width="385" height="84" rx="14"/><text class="body" x="610" y="295">independently mapped pages</text><text class="body" x="590" y="379">free(): mapping may be unmapped</text><text class="body" x="590" y="425">RSS may fall</text><text class="small" x="55" y="525">Path depends on allocator threshold, configuration and workload.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">SURVIVOR ROLES ALTERNATE</title><desc id="desc">Successive classic young collections swap the source and destination Survivor spaces. Promoted objects go to Old instead.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">SURVIVOR ROLES ALTERNATE</text><text x="24" y="68" font-size="17">GC 1: Eden + S0 → S1</text><rect x="24.0" y="80" width="138.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="93.0" y="108" text-anchor="middle" font-size="17">Eden: free</text><rect x="168.0" y="80" width="138.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="237.0" y="108" text-anchor="middle" font-size="17">S0: empty</text><rect x="312.0" y="80" width="138.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="381.0" y="108" text-anchor="middle" font-size="17">S1: live</text><path d="M240 130 L240 150" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="173" font-size="17">GC 2: Eden + S1 → S0</text><rect x="24.0" y="185" width="138.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="93.0" y="213" text-anchor="middle" font-size="17">Eden: free</text><rect x="168.0" y="185" width="138.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="213" text-anchor="middle" font-size="17">S0: live</text><rect x="312.0" y="185" width="138.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="381.0" y="213" text-anchor="middle" font-size="17">S1: empty</text><path d="M240 235 L240 255" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="278" font-size="17">GC 3: Eden + S0 → S1</text><rect x="24.0" y="290" width="138.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="93.0" y="318" text-anchor="middle" font-size="17">Eden: free</text><rect x="168.0" y="290" width="138.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="237.0" y="318" text-anchor="middle" font-size="17">S0: empty</text><rect x="312.0" y="290" width="138.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="381.0" y="318" text-anchor="middle" font-size="17">S1: live</text><text x="24" y="415" font-size="16">Each row shows the state after collection.</text></g></svg>
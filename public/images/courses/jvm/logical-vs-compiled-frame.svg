<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">SEMANTICS ≠ PHYSICAL LAYOUT</title><desc id="desc">Logical frames a b and c can become one compiled frame with registers and spill slots after inlining. Metadata preserves logical views.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">SEMANTICS ≠ PHYSICAL LAYOUT</text><rect x="30" y="68" width="420" height="105" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="102.5" font-size="16" text-anchor="middle">JVMS logical view</text><text x="240.0" y="126.5" font-size="16" text-anchor="middle">a() → b() → c()</text><text x="240.0" y="150.5" font-size="16" text-anchor="middle">each invocation: locals + operand stack</text><path d="M240 182 L240 214" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="224" width="420" height="115" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="263.5" font-size="16" text-anchor="middle">Possible optimized representation</text><text x="240.0" y="287.5" font-size="16" text-anchor="middle">one compiled frame after inlining</text><text x="240.0" y="311.5" font-size="16" text-anchor="middle">register values · spill slots</text><path d="M240 348 L240 375" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="385" width="420" height="75" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="416.5" font-size="16" text-anchor="middle">Runtime metadata</text><text x="240.0" y="440.5" font-size="16" text-anchor="middle">stack walking · GC · deoptimization</text><text x="240" y="482" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
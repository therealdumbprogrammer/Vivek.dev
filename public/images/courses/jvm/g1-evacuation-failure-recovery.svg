<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">Partial evacuation preserves both locations</title><desc id="desc">Some objects move, while another remains in its source after destination allocation fails.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#72859b"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#25344a}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line{stroke:#a9b9cd}}</style><rect width="1080" height="500" rx="22" class="bg"/><text x="36" y="51" class="title">Partial evacuation preserves both locations</text><text x="36" y="84" class="sub">An allocation failure occurs partway through a selected region.</text><rect x="42" y="140" width="295" height="235" rx="14" class="card"/><text x="62" y="172" class="head">Original source</text><rect x="65" y="210" width="65" height="58" rx="14" class="blue"/><text x="88" y="246" class="body">A</text><rect x="140" y="210" width="65" height="58" rx="14" class="blue"/><text x="163" y="246" class="body">B</text><rect x="215" y="210" width="65" height="58" rx="14" class="amber"/><text x="238" y="246" class="body">C</text><text x="65" y="314" class="body">C remains here</text><text x="65" y="341" class="small">Region retained</text><path d="M345 234 L465 234" class="line" marker-end="url(#arrow)"/><rect x="480" y="140" width="275" height="235" rx="14" class="mint"/><text x="500" y="172" class="head">Destination</text><rect x="500" y="210" width="65" height="58" rx="14" class="blue"/><text x="523" y="246" class="body">A</text><rect x="575" y="210" width="65" height="58" rx="14" class="blue"/><text x="598" y="246" class="body">B</text><text x="500" y="314" class="body">A and B copied</text><rect x="790" y="140" width="245" height="235" rx="14" class="amber"/><text x="810" y="172" class="head">Before resume</text><text x="810" y="223" class="body">Forwarding and</text><text x="810" y="251" class="body">references made</text><text x="810" y="279" class="body">consistent</text><text x="42" y="445" class="body">A failed pause need not cause immediate Full GC; later collections can retry the retained region.</text></svg>
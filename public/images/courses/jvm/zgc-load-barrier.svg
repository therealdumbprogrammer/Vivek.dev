<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">A check on reference loads</title><desc id="desc">The load barrier checks a loaded reference. Common usable references take a cheap fast path; a slow path resolves references needing attention.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">A check on reference loads</text><rect x="50" y="164" width="180" height="112" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="140.0" y="213.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Load</text><text x="140.0" y="239.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">reference</text><path d="M235 220 L298 220" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="305" y="164" width="190" height="112" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="400.0" y="213.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Load barrier</text><text x="400.0" y="239.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">checks state</text><path d="M500 195 L564 150" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><text x="532.0" y="160.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#183047">common</text><rect x="575" y="105" width="255" height="92" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="702.5" y="144.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Fast path</text><text x="702.5" y="170.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">use reference</text><path d="M500 249 L564 303" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><text x="532.0" y="264.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#183047">needs attention</text><rect x="575" y="260" width="255" height="92" rx="14" fill="#f8e5ea" stroke="#91a3b3" stroke-width="2"/><text x="702.5" y="299.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Slow path</text><text x="702.5" y="325.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">resolve then use</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">The slow path is conditional, not an every-load lookup.</text></svg>
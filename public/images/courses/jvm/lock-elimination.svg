<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
  <title id="title">Private lock elimination</title><desc id="desc">A private lock with monitor enter, work, and monitor exit is reduced to the work when no other thread can observe the monitor.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
  <rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155">
    <text x="24" y="38" font-size="20">NO OBSERVER, NO CONTENTION</text>
    <rect x="24" y="67" width="198" height="302" rx="12" fill="#fff" stroke="#315dcc"/><text x="67" y="96" font-size="16">Source semantics</text><rect x="51" y="118" width="144" height="46" rx="8" fill="#e9efff"/><text x="76" y="147" font-size="14">new private lock</text><path d="M123 166v26" stroke="#315dcc" marker-end="url(#a)"/><rect x="51" y="198" width="144" height="42" rx="8" fill="#eef2f7"/><text x="75" y="224" font-size="14">monitor enter</text><path d="M123 242v20" stroke="#315dcc" marker-end="url(#a)"/><rect x="51" y="267" width="144" height="42" rx="8" fill="#e8f4ee"/><text x="87" y="293" font-size="14">doWork()</text><path d="M123 311v20" stroke="#315dcc" marker-end="url(#a)"/><text x="78" y="351" font-size="14">monitor exit</text>
    <path d="M228 218h46" stroke="#315dcc" stroke-width="2" marker-end="url(#a)"/><rect x="282" y="130" width="174" height="176" rx="12" fill="#e8f4ee" stroke="#4c8c6b"/><text x="315" y="160" font-size="16">Optimized path</text><rect x="307" y="191" width="124" height="58" rx="8" fill="#fff"/><text x="333" y="226" font-size="16">doWork()</text><text x="311" y="278" font-size="13">when proven safe</text>
    <text x="25" y="407" font-size="14">Java-visible synchronization stays when another thread can observe it.</text>
  </g>
</svg>

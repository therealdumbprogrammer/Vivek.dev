<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">AGE COUNTS YOUNG SURVIVALS</title><desc id="desc">A remains the same logical object while its GC age increases across young collections. The numbers are illustrative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">AGE COUNTS YOUNG SURVIVALS</text><text x="24" y="68" font-size="17">Allocation</text><rect x="24.0" y="80" width="426.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="108" text-anchor="middle" font-size="17">A · age 0</text><path d="M240 130 L240 150" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="173" font-size="17">Survives first young collection</text><rect x="24.0" y="185" width="426.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="213" text-anchor="middle" font-size="17">A · age 1</text><path d="M240 235 L240 255" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="278" font-size="17">Survives another young collection</text><rect x="24.0" y="290" width="426.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="318" text-anchor="middle" font-size="17">A · age 2</text><text x="24" y="415" font-size="16">GC age is not a Java semantic property.</text></g></svg>
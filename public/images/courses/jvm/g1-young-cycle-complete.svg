<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">One complete young GC cycle</title><desc id="desc">The application resumes with references to the evacuated copies.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="500" rx="22" class="bg"/><text x="36" y="51" class="title">One complete young GC cycle</text><text x="36" y="81" class="sub">The application resumes with references to the evacuated copies.</text><rect x="36" y="135" width="305" height="120" rx="18" class="blue"/><text x="56" y="172" class="head">Mutators allocate</text><text x="56" y="209" class="body">JavaThreads → TLABs → Eden</text><rect x="388" y="135" width="305" height="120" rx="18" class="amber"/><text x="408" y="172" class="head">Safepoint + CSet</text><text x="408" y="209" class="body">Eden and Survivor selected</text><rect x="740" y="135" width="305" height="120" rx="18" class="card"/><text x="760" y="172" class="head">Roots + cards</text><text x="760" y="209" class="body">find incoming references</text><rect x="36" y="310" width="305" height="120" rx="18" class="blue"/><text x="56" y="347" class="head">Mutators resume</text><text x="56" y="384" class="body">new allocation continues</text><rect x="388" y="310" width="305" height="120" rx="18" class="mint"/><text x="408" y="347" class="head">Regions reusable</text><text x="408" y="384" class="body">after successful evacuation</text><rect x="740" y="310" width="305" height="120" rx="18" class="mint"/><text x="760" y="347" class="head">Copy live graph</text><text x="760" y="384" class="body">Survivor or Old; repair refs</text><path d="M346 195 L382 195" class="line" marker-end="url(#arrow)"/><path d="M698 195 L734 195" class="line" marker-end="url(#arrow)"/><path d="M890 260 L890 304" class="line" marker-end="url(#arrow)"/><path d="M734 370 L698 370" class="line" marker-end="url(#arrow)"/><path d="M382 370 L346 370" class="line" marker-end="url(#arrow)"/><text x="36" y="474" class="small">The next allocation wave begins from the available Eden regions.</text></svg>
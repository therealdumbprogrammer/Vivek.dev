<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Handshake safe-state requirement</title><desc id="desc">The target must already be safe or advance to a suitable poll before callback work can run.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Targeted still means safe</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="330" y="95" width="300" height="80" rx="18" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="480" y="144" font-size="21" font-weight="700" fill="#243c65">Handshake requested</text><path d="M480 230L630 330L480 430L330 330Z" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="480" y="318" font-size="20" font-weight="700" fill="#7a4614">Safe for this</text><text x="480" y="348" font-size="20" font-weight="700" fill="#7a4614">operation?</text><rect x="55" y="290" width="210" height="82" rx="17" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="160" y="322" font-size="18" font-weight="700" fill="#243c65">Advance / transition</text><text x="160" y="349" font-size="17" fill="#475569">reach suitable state</text><rect x="695" y="290" width="210" height="82" rx="17" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="800" y="322" font-size="19" font-weight="700" fill="#185b42">Process callback</text><text x="800" y="349" font-size="17" fill="#244c3d">then complete</text><text x="300" y="285" font-size="17" fill="#9a3412">no</text><text x="655" y="285" font-size="17" fill="#166534">yes</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M480 175V230"/><path d="M330 330H265"/><path d="M630 330H695"/><path d="M160 372C160 500 800 500 800 372"/></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Old-region reclamation value</title><desc id="desc">A mostly live old region requires more copying and yields less space than a sparsely live one.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs>
<rect width="900" height="450" fill="#f8fafc"/>
<text x="450" y="49" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="bold" fill="#183047">Old-region reclamation value</text>
<rect x="70" y="115" width="330" height="112" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="235.0" y="168.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Region A · 90% live</text><text x="235.0" y="196.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">more copying · less recovered</text><rect x="500" y="115" width="330" height="112" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="665.0" y="168.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Region B · 15% live</text><text x="665.0" y="196.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">less copying · more recovered</text><text x="450" y="284" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Selection also considers</text><rect x="78" y="311" width="225" height="70" rx="14" fill="#e7edf2" stroke="#91a3b3" stroke-width="2"/><text x="190.5" y="353.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Root work</text><rect x="338" y="311" width="225" height="70" rx="14" fill="#e7edf2" stroke="#91a3b3" stroke-width="2"/><text x="450.5" y="353.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Connectivity</text><rect x="598" y="311" width="225" height="70" rx="14" fill="#e7edf2" stroke="#91a3b3" stroke-width="2"/><text x="710.5" y="353.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Pause budget</text><text x="450" y="416" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="normal" fill="#536779">Fractions are illustrative; the real choice uses predicted efficiency.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Lightweight ownership follows a virtual thread</title><desc id="desc">During freeze and thaw, JDK 25 HotSpot moves lightweight lock-stack references with continuation state as a virtual thread changes carriers.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#23364a}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:17px}.tiny{font-size:15px}.muted{fill:#5c6d7a}.card{fill:#fff;stroke:#9caeba;stroke-width:2}.blue{fill:#e7f0f7;stroke:#547fa8;stroke-width:3}.teal{fill:#e7f2ef;stroke:#57998f;stroke-width:3}.clay{fill:#fbede6;stroke:#d48763;stroke-width:3}.gold{fill:#fbf4df;stroke:#c8a34f;stroke-width:3}.arrow{stroke:#547fa8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547fa8"/></marker></defs><rect width="960" height="540" rx="24" fill="#fbfaf7"/><text x="48" y="56" class="title">Lightweight ownership follows a virtual thread</text><rect x="35" y="160" width="245" height="185" rx="18" class="blue"/><text x="157.5" y="244.5" text-anchor="middle" class="label">Carrier A</text><text x="157.5" y="275.5" text-anchor="middle" class="small muted">platform thread + LockStack</text><rect x="355" y="145" width="260" height="220" rx="18" class="teal"/><text x="485.0" y="247.0" text-anchor="middle" class="label">Virtual thread V1</text><text x="485.0" y="278.0" text-anchor="middle" class="small muted">continuation + stack chunk</text><rect x="680" y="160" width="245" height="185" rx="18" class="blue"/><text x="802.5" y="244.5" text-anchor="middle" class="label">Carrier B</text><text x="802.5" y="275.5" text-anchor="middle" class="small muted">platform thread + LockStack</text><path d="M280 250 L350 250" class="arrow"/><text x="315.0" y="240.0" text-anchor="middle" class="small muted">mounted</text><path d="M620 250 L675 250" class="arrow"/><text x="647.5" y="240.0" text-anchor="middle" class="small muted">freeze / thaw</text><rect x="390" y="310" width="190" height="40" rx="18" class="gold"/><text x="485.0" y="334.0" text-anchor="middle" class="small">account · order</text><rect x="160" y="405" width="640" height="75" rx="18" class="card"/><text x="480.0" y="442.5" text-anchor="middle" class="small">Logical Java-thread identity owns the monitor across carrier changes</text></svg>
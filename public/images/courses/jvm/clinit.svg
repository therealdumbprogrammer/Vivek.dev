<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
<title id="title">THE CLASS INITIALIZATION PROCEDURE</title><desc id="desc">Constant assignment and required parent initialization precede this class clinit.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="560" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">THE CLASS INITIALIZATION PROCEDURE</text><rect x="32" y="70" width="416" height="65" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="96.0" font-size="16" text-anchor="middle">Initialization procedure</text><text x="240.0" y="119.0" font-size="16" text-anchor="middle">class already verified and prepared</text><path d="M240 137 L240 166" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="32" y="171" width="416" height="85" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="195.5" font-size="16" text-anchor="middle">ConstantValue assignment</text><text x="240.0" y="218.5" font-size="16" text-anchor="middle">before clinit; required parents</text><text x="240.0" y="241.5" font-size="16" text-anchor="middle">initialized before this class’s clinit</text><path d="M240 258 L240 293" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="32" y="298" width="416" height="100" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="330.0" font-size="16" text-anchor="middle">Config.&lt;clinit&gt;</text><text x="240.0" y="353.0" font-size="16" text-anchor="middle">count = 42</text><text x="240.0" y="376.0" font-size="16" text-anchor="middle">print &quot;initializing&quot;</text><path d="M240 401 L240 436" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="32" y="441" width="416" height="57" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="474.5" font-size="16" text-anchor="middle">Successful initialization recorded</text><text x="240" y="535" font-size="15" text-anchor="middle">Static logic is not rerun for each instance.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Investigate, then verify</title><desc id="desc">Evidence should change the next step</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="520" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">Investigate, then verify</text><text x="36" y="74" class="sub">No single observation is proof of root cause.</text><rect x="36" y="112" width="276" height="84" rx="15" class="accent"/><text x="54" y="142" class="head">1  Symptom</text><text x="54" y="168" class="body">Slow, hot, stuck, growing</text><rect x="342" y="112" width="276" height="84" rx="15" class="mint"/><text x="360" y="142" class="head">2  Confirm metrics</text><text x="360" y="168" class="body">Time, scope, trend</text><rect x="648" y="112" width="276" height="84" rx="15" class="amber"/><text x="666" y="142" class="head">3  Suspected layer</text><text x="666" y="168" class="body">Which subsystem can explain it?</text><path d="M312 154 L340 154" class="line" marker-end="url(#arrow)"/><path d="M618 154 L646 154" class="line" marker-end="url(#arrow)"/><rect x="36" y="248" width="276" height="84" rx="15" class="card"/><text x="54" y="278" class="head">4  Targeted evidence</text><text x="54" y="304" class="body">Choose a fitting observation</text><rect x="342" y="248" width="276" height="84" rx="15" class="accent"/><text x="360" y="278" class="head">5  Hypothesis</text><text x="360" y="304" class="body">Predict a second observation</text><rect x="648" y="248" width="276" height="84" rx="15" class="mint"/><text x="666" y="278" class="head">6  Verify</text><text x="666" y="304" class="body">Correlate independent views</text><path d="M312 290 L340 290" class="line" marker-end="url(#arrow)"/><path d="M618 290 L646 290" class="line" marker-end="url(#arrow)"/><rect x="342" y="384" width="276" height="84" rx="15" class="amber"/><text x="360" y="414" class="head">7  Corrective action</text><text x="360" y="440" class="body">Only after verification</text><path d="M786 332 L618 417" class="line" marker-end="url(#arrow)"/><text x="37" y="479" class="small">If evidence disagrees, revise the hypothesis and observe again.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Two different kinds of waiting</title><desc id="desc">An entry contender has not acquired the monitor. Object.wait is called while owning, releases the monitor, waits, then reacquires before returning.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#23364a}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:17px}.muted{fill:#5c6d7a}.card{fill:#fff;stroke:#9caeba;stroke-width:2}.blue{fill:#e7f0f7;stroke:#547fa8;stroke-width:3}.teal{fill:#e7f2ef;stroke:#57998f;stroke-width:3}.clay{fill:#fbede6;stroke:#d48763;stroke-width:3}.gold{fill:#fbf4df;stroke:#c8a34f;stroke-width:3}.arrow{stroke:#547fa8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547fa8"/></marker></defs><rect width="960" height="540" rx="24" fill="#fbfaf7"/><text x="48" y="56" text-anchor="start" class="title">Two different kinds of waiting</text><rect x="55" y="145" width="385" height="350" rx="18" class="blue"/><text x="247" y="187" text-anchor="middle" class="label">Entry contention</text><rect x="475" y="145" width="430" height="350" rx="18" class="gold"/><text x="690" y="187" text-anchor="middle" class="label">Object.wait()</text><rect x="82" y="220" width="150" height="68" rx="18" class="teal"/><text x="157.0" y="246.0" text-anchor="middle" class="small">A owns lock</text><text x="157.0" y="277.0" text-anchor="middle" class="small muted">monitor owner</text><rect x="265" y="220" width="140" height="68" rx="18" class="clay"/><text x="335.0" y="254.0" text-anchor="middle" class="label">B arrives</text><path d="M335 288 L335 350" class="arrow"/><rect x="100" y="355" width="300" height="72" rx="18" class="card"/><text x="250.0" y="391.0" text-anchor="middle" class="label">B waits to enter</text><rect x="515" y="215" width="350" height="66" rx="18" class="teal"/><text x="690.0" y="240.0" text-anchor="middle" class="label">A owns account</text><text x="690.0" y="271.0" text-anchor="middle" class="small muted">calls wait()</text><path d="M690 281 L690 305" class="arrow"/><rect x="515" y="310" width="350" height="72" rx="18" class="card"/><text x="690.0" y="338.0" text-anchor="middle" class="small">Release; join wait set</text><text x="690.0" y="369.0" text-anchor="middle" class="small muted">notify · timeout · interrupt</text><path d="M690 382 L690 405" class="arrow"/><rect x="515" y="410" width="350" height="65" rx="18" class="clay"/><text x="690.0" y="442.5" text-anchor="middle" class="label">Reacquire before wait() returns</text></svg>
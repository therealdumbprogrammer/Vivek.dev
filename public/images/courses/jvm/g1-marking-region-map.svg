<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc"><title id="title">Marking informs reclamation</title><desc id="desc">Live bytes and predicted collection work both matter.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="490" rx="22" class="bg"/><text x="36" y="51" class="title">Marking informs reclamation</text><text x="36" y="81" class="sub">Live bytes and predicted collection work both matter.</text><rect x="36" y="140" width="305" height="265" rx="18" class="rose"/><text x="56" y="177" class="head">Mostly live Old</text><rect x="388" y="140" width="305" height="265" rx="18" class="amber"/><text x="408" y="177" class="head">Partly live Old</text><rect x="740" y="140" width="305" height="265" rx="18" class="mint"/><text x="760" y="177" class="head">Empty Old</text><rect x="58" y="214" width="245" height="54" rx="8" class="blue"/><rect x="410" y="214" width="70" height="54" rx="8" class="blue"/><rect x="480" y="214" width="175" height="54" rx="8" class="card"/><rect x="762" y="214" width="245" height="54" rx="8" class="card"/><text x="58" y="303" class="body">high copy cost</text><text x="410" y="303" class="body">mixed GC candidate</text><text x="762" y="303" class="body">may reclaim directly</text><text x="58" y="365" class="small">live data</text><text x="480" y="365" class="small">garbage</text><text x="762" y="365" class="small">no live copy</text><text x="36" y="454" class="small">Dead humongous objects have additional special reclamation paths.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Humongous object: start + continuation</title><desc id="desc">A 9 MiB object occupies three adjacent 4 MiB old regions. Its final region has unusable tail space.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Humongous object: start + continuation</text><text x="450" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#183047">Illustrative 4 MiB G1 regions · object size 9 MiB</text><rect x="92" y="147" width="222" height="145" rx="11" fill="#d9eafb" stroke="#536779" stroke-width="2"/><text x="203" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Start</text><rect x="107" y="198" width="192" height="67" rx="8" fill="#6b8eb1"/><rect x="325" y="147" width="222" height="145" rx="11" fill="#d9eafb" stroke="#536779" stroke-width="2"/><text x="436" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Continuation</text><rect x="340" y="198" width="192" height="67" rx="8" fill="#6b8eb1"/><rect x="558" y="147" width="222" height="145" rx="11" fill="#d9eafb" stroke="#536779" stroke-width="2"/><text x="669" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Continuation</text><rect x="573" y="198" width="62" height="67" rx="8" fill="#6b8eb1"/><rect x="641" y="198" width="124" height="67" rx="8" fill="#fff0d2" stroke="#b8863b" stroke-dasharray="5 4"/><text x="703" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#183047">tail waste</text><text x="450" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">One contiguous old-generation region run holds the entire object.</text><text x="450" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#183047">The final region’s unused tail cannot serve another allocation until reclamation.</text></svg>

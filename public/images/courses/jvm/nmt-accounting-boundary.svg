</style><text x="38" y="48" class="title" text-anchor="start">NMT has a defined accounting boundary</text><text x="38" y="73" class="sub" text-anchor="start">Different layers observe different parts of memory</text><rect x="38.0" y="130" width="265.3333333333333" height="220" rx="16" class="accent"/><text x="56.0" y="161" class="head" text-anchor="start">Java heap</text><text x="56.0" y="189" class="body" text-anchor="start">NMT: reserved and committed;</text><text x="56.0" y="210" class="body" text-anchor="start">heap tools: objects and</text><text x="56.0" y="231" class="body" text-anchor="start">retention</text><rect x="317.3333333333333" y="130" width="265.3333333333333" height="220" rx="16" class="mint"/><text x="335.3333333333333" y="161" class="head" text-anchor="start">HotSpot native</text><text x="335.3333333333333" y="189" class="body" text-anchor="start">NMT: Class, Thread, Code, GC,</text><text x="335.3333333333333" y="210" class="body" text-anchor="start">Compiler and more</text><rect x="596.6666666666666" y="130" width="265.3333333333333" height="220" rx="16" class="amber"/><text x="614.6666666666666" y="161" class="head" text-anchor="start">Outside NMT</text><text x="614.6666666666666" y="189" class="body" text-anchor="start">JNI libraries, some JDK native</text><text x="614.6666666666666" y="210" class="body" text-anchor="start">allocations and OS mappings</text><text x="450" y="402" class="body" text-anchor="middle">Process RSS and container charges use different accounting rules</text></svg>
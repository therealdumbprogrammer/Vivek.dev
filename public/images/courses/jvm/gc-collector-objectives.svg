<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Match the cost to the workload</title><desc id="desc">Three objectives can point to different collectors.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Match the cost to the workload</text><rect x="45" y="125" width="255" height="170" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="172.5" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Tiny work</text><text x="172.5" y="231.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">Low coordination cost</text><rect x="322" y="125" width="255" height="170" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="449.5" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Batch work</text><text x="449.5" y="231.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">High throughput</text><rect x="599" y="125" width="255" height="170" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="726.5" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Interactive work</text><text x="726.5" y="231.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">Low tail latency</text><text x="450" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">Judge pause time, completion time, CPU, and memory together.</text></svg>
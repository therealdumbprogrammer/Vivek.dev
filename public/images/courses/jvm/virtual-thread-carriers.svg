troke-width="2"/><path d="M564 146 L564 169" fill="none" stroke="#94a0af" stroke-width="2"/><path d="M76 169 L564 169" fill="none" stroke="#94a0af" stroke-width="2"/><path d="M320 169 L320 204" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="145" y="204" width="350" height="65" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="243.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">JDK scheduler</text><path d="M255 269 L167 320" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M385 269 L473 320" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="320" width="250" height="82" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="167.0" y="355.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Carrier A</text><text x="167.0" y="381.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">OS thread A</text><rect x="348" y="320" width="250" height="82" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="473.0" y="355.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Carrier B</text><text x="473.0" y="381.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">OS thread B</text><text x="320" y="443" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">Carrier count is illustrative, not a fixed ratio.</text></g></svg>
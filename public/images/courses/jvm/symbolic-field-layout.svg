<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc"><title id="title">WHICH FIELD, NOT WHICH OFFSET</title><desc id="desc">Example.class uses getfield 7. Entry 7 symbolically describes Example.name of type String. The running JVM resolves the field and accesses it using the object layout selected for this run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="510" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="18" text-anchor="middle">WHICH FIELD, NOT WHICH OFFSET</text><rect x="24" y="65" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="111" text-anchor="middle" font-size="16">Example.class bytecode</text><text x="240" y="135" text-anchor="middle" font-size="16">getfield #7</text><path d="M240 175 V198" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="204" width="432" height="106" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240" y="250" text-anchor="middle" font-size="16">#7 symbolic Fieldref</text><text x="240" y="274" text-anchor="middle" font-size="16">Example · name · String</text><path d="M240 314 V337" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="343" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="389" text-anchor="middle" font-size="16">Running JVM</text><text x="240" y="413" text-anchor="middle" font-size="16">resolve field · use chosen layout</text><text x="240" y="478" font-size="15" text-anchor="middle">The number 7 is not a physical offset</text></g></svg>

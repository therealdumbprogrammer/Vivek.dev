<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">G1: CROSS-REGION REFERENCES</title><desc id="desc">Cards in A and C may point into B. The drawing is conceptual; G1 can group regions in remembered sets.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">G1: CROSS-REGION REFERENCES</text><rect x="24" y="80" width="185" height="60" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="116.0" font-size="17">Region A</text><rect x="270" y="80" width="185" height="60" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="282" y="116.0" font-size="17">Region C</text><path d="M115 145 L210 210" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M355 145 L275 210" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="135" y="220" width="210" height="60" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="147" y="256.0" font-size="17">Region B</text><rect x="24" y="325" width="430" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="358.5" font-size="17">Remember source cards in A and C</text><text x="24" y="420" font-size="17">A G1 region contains many smaller cards.</text></g></svg>
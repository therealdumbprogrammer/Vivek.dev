<svg xmlns="http://www.w3.org/2000/svg" width="480" height="344" viewBox="0 0 480 344" role="img" aria-labelledby="title desc"><title id="title">OBSERVATION BECOMES OPPORTUNITY</title><desc id="desc">A profile dominated by DefaultPricingService can support a checked direct path and inlining while preserving correct behavior for other implementations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="344" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">OBSERVATION BECOMES OPPORTUNITY</text><rect x="25" y="62" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="87.0" font-size="16" text-anchor="middle">DefaultPricingService appears 99.9%</text><text x="240.0" y="111.0" font-size="16" text-anchor="middle">at this call site in our example</text><path d="M240 125 L240 145" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="150" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="175.0" font-size="16" text-anchor="middle">C2 may build a checked direct path</text><text x="240.0" y="199.0" font-size="16" text-anchor="middle">for the common receiver type</text><path d="M240 213 L240 233" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="238" width="430" height="62" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="263.0" font-size="16" text-anchor="middle">Inline when suitable</text><text x="240.0" y="287.0" font-size="16" text-anchor="middle">Keep a correct route for other types</text><text x="240" y="322" font-size="13" text-anchor="middle">Observed frequency describes the past, not a guarantee</text></g></svg>

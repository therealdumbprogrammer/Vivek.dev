<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc"><title id="title">Resolve a reference during relocation</title><desc id="desc">A load barrier checks a colored reference and uses relocation information when remapping is needed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#72859b"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#25344a}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line{stroke:#a9b9cd}}</style><rect width="1080" height="540" rx="22" class="bg"/><text x="36" y="51" class="title">Resolve a reference during relocation</text><rect x="42" y="128" width="270" height="115" rx="14" class="card"/><text x="62" y="164" class="head">Customer field</text><text x="62" y="202" class="body">Order → old location</text><path d="M320 185 L420 185" class="line" marker-end="url(#arrow)"/><rect x="440" y="128" width="285" height="115" rx="14" class="blue"/><text x="460" y="164" class="head">Load barrier</text><text x="460" y="202" class="body">Check reference state</text><path d="M725 185 L820 185" class="line" marker-end="url(#arrow)"/><rect x="840" y="128" width="195" height="115" rx="14" class="mint"/><text x="856" y="164" class="head">Fast path</text><text x="856" y="202" class="body">Usable now</text><path d="M580 250 L580 310" class="line" marker-end="url(#arrow)"/><rect x="350" y="330" width="460" height="128" rx="14" class="amber"/><text x="375" y="366" class="head">Slow path: resolve and repair</text><text x="375" y="405" class="body">Forwarding → Order at new location</text><text x="375" y="434" class="body">Access proceeds with usable reference</text><text x="42" y="500" class="small">Colored metadata is in the reference; the drawing does not specify pointer bits.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="455" viewBox="0 0 480 455" role="img" aria-labelledby="title desc">
<title id="title">THREE JOBS WITHIN LINKING</title><desc id="desc">Verification, preparation and resolution have distinct responsibilities.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="455" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">THREE JOBS WITHIN LINKING</text><rect x="24" y="75" width="432" height="88" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="112.5" font-size="16" text-anchor="middle">1 · Verification</text><text x="240.0" y="135.5" font-size="16" text-anchor="middle">Do the instructions obey JVM rules?</text><rect x="24" y="185" width="432" height="88" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="222.5" font-size="16" text-anchor="middle">2 · Preparation</text><text x="240.0" y="245.5" font-size="16" text-anchor="middle">Establish static defaults and VM state.</text><rect x="24" y="295" width="432" height="88" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="332.5" font-size="16" text-anchor="middle">3 · Resolution</text><text x="240.0" y="355.5" font-size="16" text-anchor="middle">Connect symbols to runtime entities.</text><text x="240" y="422" font-size="16" text-anchor="middle">Resolution can be deferred; it is still linking.</text></g></svg>
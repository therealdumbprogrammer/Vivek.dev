<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Different thread states during safepoint synchronization</title><desc id="desc">Compiled, blocked, native, and interpreted threads use different mechanisms to become accountable.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Threads do not all arrive the same way</text>
  <g font-family="system-ui,sans-serif"><g fill="#eef4ff" stroke="#4f6f9f" stroke-width="2"><rect x="45" y="105" width="220" height="78" rx="15"/><rect x="45" y="220" width="220" height="78" rx="15"/><rect x="45" y="335" width="220" height="78" rx="15"/><rect x="45" y="450" width="220" height="78" rx="15"/></g><g font-size="19" text-anchor="middle" fill="#172033"><text x="155" y="137">Thread A</text><text x="155" y="164">compiled Java</text><text x="155" y="252">Thread B</text><text x="155" y="279">blocked</text><text x="155" y="367">Thread C</text><text x="155" y="394">native code</text><text x="155" y="482">Thread D</text><text x="155" y="509">interpreter</text></g><g fill="#fff3d6" stroke="#bd7a28" stroke-width="2"><rect x="350" y="105" width="270" height="78" rx="15"/><rect x="350" y="220" width="270" height="78" rx="15"/><rect x="350" y="335" width="270" height="78" rx="15"/><rect x="350" y="450" width="270" height="78" rx="15"/></g><g font-size="17" text-anchor="middle" fill="#54391d"><text x="485" y="139">reaches poll / runtime</text><text x="485" y="165">coordination</text><text x="485" y="254">already in an accountable</text><text x="485" y="280">blocked state</text><text x="485" y="369">Java/native transition</text><text x="485" y="395">protocol</text><text x="485" y="484">interpreter and runtime</text><text x="485" y="510">machinery</text></g><rect x="710" y="220" width="205" height="190" rx="22" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="812" y="278" text-anchor="middle" font-size="21" font-weight="700" fill="#185b42">Accounted for</text><text x="812" y="315" text-anchor="middle" font-size="18" fill="#244c3d">safe for this</text><text x="812" y="344" text-anchor="middle" font-size="18" fill="#244c3d">global operation</text></g><g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M265 144H350"/><path d="M265 259H350"/><path d="M265 374H350"/><path d="M265 489H350"/><path d="M620 144C675 144 675 250 710 270"/><path d="M620 259H710"/><path d="M620 374H710"/><path d="M620 489C675 489 675 390 710 370"/></g>
</svg>

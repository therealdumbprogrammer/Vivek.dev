<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">Same heap size, different recovery potential</title><desc id="desc">Two eight-gigabyte heaps can have very different reachable data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#72859b"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#25344a}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line{stroke:#a9b9cd}}</style><rect width="1080" height="470" rx="22" class="bg"/><text x="36" y="51" class="title">Same heap size, different recovery potential</text><rect x="40" y="125" width="470" height="285" rx="14" class="card"/><text x="65" y="165" class="head">Allocation pressure · 8 GB</text><rect x="65" y="205" width="175" height="70" rx="5" class="blue"/><text x="100" y="247" class="body">3 GB live</text><rect x="242" y="205" width="205" height="70" rx="5" class="amber"/><text x="255" y="247" class="body">4 GB garbage</text><rect x="449" y="205" width="39" height="70" rx="5" class="mint"/><text x="65" y="328" class="body">Substantial space can be reclaimed.</text><rect x="570" y="125" width="470" height="285" rx="14" class="card"/><text x="595" y="165" class="head">Live-set pressure · 8 GB</text><rect x="595" y="205" width="405" height="70" rx="5" class="blue"/><text x="700" y="247" class="body">7.7 GB live</text><rect x="1002" y="205" width="18" height="70" rx="5" class="amber"/><text x="595" y="328" class="body">Even Full GC can recover little.</text><text x="40" y="450" class="small">Illustrative capacities; measure after comparable collections and inspect retained roots.</text></svg>
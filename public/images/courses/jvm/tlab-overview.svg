<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">PRIVATE ALLOCATION SLICES</title><desc id="desc">Two execution threads obtain dynamic TLAB slices within the same collector allocation area.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">PRIVATE ALLOCATION SLICES</text><rect x="24" y="70" width="195" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="103.5" font-size="16">Thread A</text><rect x="261" y="70" width="195" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="273" y="103.5" font-size="16">Thread B</text><path d="M121 128 L121 173" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M358 128 L358 173" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="176" width="440" height="185" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="34" y="202" font-size="17">Collector allocation area</text><path d="M121 208 L121 221" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M358 208 L358 221" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="36" y="224" width="188" height="60" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="48" y="260.0" font-size="16">TLAB A · topA</text><rect x="254" y="224" width="188" height="60" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="266" y="260.0" font-size="16">TLAB B · topB</text><rect x="36" y="302" width="406" height="40" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="48" y="328.0" font-size="16">Space available for future slices</text><text x="24" y="393" font-size="16">Buffers are obtained and retired dynamically.</text><text x="24" y="421" font-size="15">Eden is a useful generational picture, not a grid.</text></g></svg>
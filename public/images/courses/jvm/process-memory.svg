<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="title desc"><title id="title">Heap is one part of process memory</title><desc id="desc">The HotSpot process boundary encloses heap and native memory. Xmx bounds only the heap. Sizes are not proportional to usage.</desc><rect width="480" height="760" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="26" y="36" font-size="15" fill="#475569">ONE HOTSPOT PROCESS</text><rect x="18" y="52" width="444" height="656" rx="20" fill="none" stroke="#315dcc" stroke-width="2"/><rect x="34" y="70" width="412" height="100" rx="14" fill="#e9efff"/><text x="52" y="101" font-size="22" font-weight="650" fill="#17243c">Java heap</text><text x="52" y="128" font-size="17" fill="#334155">Objects and arrays · GC lifetime</text><text x="52" y="152" font-size="16" fill="#315dcc">-Xmx bounds this region only</text><text x="36" y="202" font-size="15" font-weight="650" fill="#475569">NATIVE REGIONS</text><rect x="34" y="220" width="412" height="80" rx="14" fill="white" stroke="#dce5ef"/><text x="52" y="251" font-size="21" font-weight="650" fill="#17243c">Platform-thread stacks</text><text x="52" y="279" font-size="16" fill="#334155">Method frames · influenced by -Xss</text><rect x="34" y="312" width="412" height="80" rx="14" fill="white" stroke="#dce5ef"/><text x="52" y="343" font-size="21" font-weight="650" fill="#17243c">Metaspace</text><text x="52" y="371" font-size="16" fill="#334155">Class metadata · loader lifecycle</text><rect x="34" y="404" width="412" height="80" rx="14" fill="white" stroke="#dce5ef"/><text x="52" y="435" font-size="21" font-weight="650" fill="#17243c">Code Cache</text><text x="52" y="463" font-size="16" fill="#334155">Compiled methods and runtime stubs</text><rect x="34" y="496" width="412" height="80" rx="14" fill="white" stroke="#dce5ef"/><text x="52" y="527" font-size="21" font-weight="650" fill="#17243c">Direct / native buffers</text><text x="52" y="555" font-size="16" fill="#334155">Backing storage · JNI / libraries</text><rect x="34" y="588" width="412" height="80" rx="14" fill="white" stroke="#dce5ef"/><text x="52" y="619" font-size="21" font-weight="650" fill="#17243c">HotSpot internal memory</text><text x="52" y="647" font-size="16" fill="#334155">GC, compiler, and runtime structures</text><text x="26" y="737" font-size="14" fill="#475569">Responsibility map · not a scale drawing or RSS sum</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="486" viewBox="0 0 480 486" role="img" aria-labelledby="title desc"><title id="title">GROUP CODE WITH SIMILAR LIFETIMES</title><desc id="desc">A mixed heap leaves scattered holes as short-lived code is reclaimed between long-lived blocks. Segmented heaps separate profiled, non-profiled, and non-method code to improve lifecycle management.</desc><rect width="480" height="486" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="15" text-anchor="middle">GROUP CODE WITH SIMILAR LIFETIMES</text><text x="24" y="69" font-size="14">One mixed heap after reclamation</text><rect x="24" y="84" width="432" height="92" rx="12" fill="#fff" stroke="#9aa8bb"/><rect x="40" y="102" width="70" height="56" rx="7" fill="#dce7ff"/><rect x="118" y="102" width="48" height="56" rx="7" fill="none" stroke="#9aa8bb" stroke-dasharray="5 4"/><rect x="174" y="102" width="112" height="56" rx="7" fill="#e9efff"/><rect x="294" y="102" width="42" height="56" rx="7" fill="none" stroke="#9aa8bb" stroke-dasharray="5 4"/><rect x="344" y="102" width="92" height="56" rx="7" fill="#dce7ff"/><text x="142" y="194" font-size="12" text-anchor="middle">free holes are separated</text><text x="24" y="236" font-size="14">Segmented by role and lifecycle</text><rect x="24" y="252" width="432" height="58" rx="10" fill="#e9efff" stroke="#9aa8bb"/><text x="42" y="278" font-size="14">Profiled nmethods</text><text x="42" y="298" font-size="12">replaceable code managed together</text><rect x="24" y="322" width="432" height="58" rx="10" fill="#dce7ff" stroke="#315dcc"/><text x="42" y="348" font-size="14">Non-profiled nmethods</text><text x="42" y="368" font-size="12">optimized code with different useful lifetimes</text><rect x="24" y="392" width="432" height="58" rx="10" fill="#fff" stroke="#9aa8bb"/><text x="42" y="418" font-size="14">Non-method code</text><text x="42" y="438" font-size="12">interpreter and runtime support isolated</text><text x="240" y="472" font-size="12" text-anchor="middle">Segmentation helps management; it does not guarantee zero fragmentation</text></g></svg>

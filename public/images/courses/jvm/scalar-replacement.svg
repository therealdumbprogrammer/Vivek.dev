<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="title desc">
  <title id="title">Scalar replacement decomposes an object</title><desc id="desc">A Point object with header, x, and y becomes separate x and y scalar values with no aggregate allocation.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
  <rect width="480" height="420" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155">
    <text x="24" y="38" font-size="20">OBJECT → VALUES</text><text x="65" y="78" font-size="16">Source-level Point</text>
    <rect x="45" y="95" width="175" height="210" rx="12" fill="#fff" stroke="#315dcc" stroke-width="1.5"/><rect x="63" y="117" width="139" height="48" rx="7" fill="#eef2f7"/><text x="89" y="146" font-size="15">object header</text><rect x="63" y="177" width="139" height="48" rx="7" fill="#e9efff"/><text x="111" y="207" font-size="16">x = 10</text><rect x="63" y="237" width="139" height="48" rx="7" fill="#e9efff"/><text x="111" y="267" font-size="16">y = 20</text>
    <path d="M227 201h67" stroke="#315dcc" stroke-width="2" marker-end="url(#a)"/><text x="225" y="187" font-size="13">scalar replace</text>
    <text x="319" y="78" font-size="16">Optimized values</text><rect x="306" y="117" width="130" height="72" rx="10" fill="#e8f4ee" stroke="#4c8c6b"/><text x="343" y="160" font-size="18">x = 10</text><rect x="306" y="211" width="130" height="72" rx="10" fill="#e8f4ee" stroke="#4c8c6b"/><text x="343" y="254" font-size="18">y = 20</text>
    <text x="62" y="346" font-size="15">Identity and header are unnecessary here.</text><text x="62" y="374" font-size="15">Values may be folded further to return 30.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">The old page has a managed lifetime</title><desc id="desc">Mark, select, move, publish, resolve and only then safely reuse old storage.</desc>
<rect class="bg" width="1080" height="450" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#243247}.bg{fill:#f7f9fc}.heading{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.box{fill:#fff;stroke:#bdcad9;stroke-width:2}.accent{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.warn{fill:#fff1db;stroke:#b68a46;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#789;stroke-width:2;stroke-dasharray:8 6}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#52667e}.accent{fill:#213f3d;stroke:#73b1a7}.warn{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.line{stroke:#a9b9cd}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#526477" stroke-width="1.7"/></marker></defs>
<text class="heading" x="44" y="55">The old page has a managed lifetime</text><rect class="box" x="35" y="150" width="185" height="160" rx="16"/><text class="label" x="55" y="186">1 Mark</text><text class="body" x="55" y="222">live Order</text><path class="line" d="M220 230 L244 230"/><rect class="box" x="250" y="150" width="185" height="160" rx="16"/><text class="label" x="270" y="186">2 Select</text><text class="body" x="270" y="222">source ZPage</text><path class="line" d="M435 230 L459 230"/><rect class="accent" x="465" y="150" width="185" height="160" rx="16"/><text class="label" x="485" y="186">3 Move</text><text class="body" x="485" y="222">copy or assist</text><path class="line" d="M650 230 L674 230"/><rect class="box" x="680" y="150" width="170" height="160" rx="16"/><text class="label" x="700" y="186">4 Publish</text><text class="body" x="700" y="222">one destination</text><path class="line" d="M850 230 L874 230"/><rect class="warn" x="880" y="150" width="165" height="160" rx="16"/><text class="label" x="900" y="186">5 Resolve</text><text class="body" x="900" y="222">then retire</text><text class="body" x="900" y="249">old page</text><text class="body" x="190" y="378">Source page and forwarding remain available until safe reclamation</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Remark reaches a fixed point</title><desc id="desc">Most traversal is concurrent; Remark finishes pending SATB and descendant work.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">Remark reaches a fixed point</text><rect x="45" y="145" width="230" height="120" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="160.0" y="198.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Concurrent Mark</text><text x="160.0" y="223.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">most traversal</text><rect x="335" y="145" width="230" height="120" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="198.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Remark · STW</text><text x="450.0" y="223.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">drain SATB work</text><rect x="625" y="145" width="230" height="120" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="740.0" y="198.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Fixed point</text><text x="740.0" y="223.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">B → Q → R done</text><path d="M275 205 L330 205" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="302.5" y="194.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">finish</text><path d="M565 205 L620 205" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="592.5" y="194.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">follow</text><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">Remark also performs reference processing and class unloading.</text></svg>

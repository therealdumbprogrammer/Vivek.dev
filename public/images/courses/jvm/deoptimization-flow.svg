<svg xmlns="http://www.w3.org/2000/svg" width="480" height="476" viewBox="0 0 480 476" role="img" aria-labelledby="title desc"><title id="title">CHANGE REPRESENTATION</title><desc id="desc">Optimized execution at a supported point; Earlier side effects have already happened. Compiler metadata + machine state; Reconstruct logical JVM state. Resume interpreter execution; Do not restart the whole method</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="476" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="16" text-anchor="middle">CHANGE REPRESENTATION</text><rect x="22" y="60" width="436" height="104" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="100" font-size="16" text-anchor="middle">Optimized execution at a supported point</text><text x="240" y="124" font-size="16" text-anchor="middle">Earlier side effects have already happened</text><path d="M240 167 V188" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="192" width="436" height="104" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="232" font-size="16" text-anchor="middle">Compiler metadata + machine state</text><text x="240" y="256" font-size="16" text-anchor="middle">Reconstruct logical JVM state</text><path d="M240 299 V320" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="324" width="436" height="104" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="364" font-size="16" text-anchor="middle">Resume interpreter execution</text><text x="240" y="388" font-size="16" text-anchor="middle">Do not restart the whole method</text><text x="240" y="461" font-size="13" text-anchor="middle">Conceptual HotSpot model · not to scale</text></g></svg>

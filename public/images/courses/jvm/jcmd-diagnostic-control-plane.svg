<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">jcmd is an entry point</title><desc id="desc">Operations are separate observations</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="460" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">jcmd is an entry point</text><text x="36" y="74" class="sub">Different commands have different costs and boundaries.</text><rect x="360" y="96" width="240" height="78" rx="15" class="accent"/><text x="378" y="126" class="head">jcmd &lt;pid&gt; help</text><text x="378" y="152" class="body">Choose a VM operation</text><path d="M480 174 L480 207" class="line" marker-end="url(#arrow)"/><rect x="36" y="210" width="280" height="88" rx="15" class="mint"/><text x="54" y="240" class="head">Threads</text><text x="54" y="266" class="body">print • dump_to_file</text><rect x="340" y="210" width="280" height="88" rx="15" class="mint"/><text x="358" y="240" class="head">JFR</tex
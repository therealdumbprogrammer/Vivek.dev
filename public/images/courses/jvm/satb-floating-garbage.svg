<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Floating garbage</title><desc id="desc">B is live at mark start, becomes unreachable, and stays conservatively live this cycle.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">Floating garbage</text><rect x="45" y="145" width="220" height="110" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="155.0" y="193.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Mark starts</text><text x="155.0" y="218.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">A → B</text><rect x="340" y="145" width="220" height="110" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="193.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Edge removed</text><text x="450.0" y="218.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">A.child = null</text><rect x="635" y="145" width="220" height="110" rx="14" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="745.0" y="193.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Current cycle</text><text x="745.0" y="218.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">B retained</text><path d="M265 200 L335 200" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="300.0" y="189.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">mutation</text><path d="M560 200 L630 200" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="595.0" y="189.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">SATB</text><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">A later marking cycle can recognize B as garbage.</text></svg>

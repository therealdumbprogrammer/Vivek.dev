<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">Where GC cost appears</title><desc id="desc">Four overlapping cost dimensions on collector CPU, mutator CPU, and application elapsed time.</desc><rect class="bg" width="1080" height="500" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.accent{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.bar{fill:#91bdb5}.line{stroke:#647b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.accent{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.bar{fill:#6aa79c}text{fill:#edf2fa}.line,.plain{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b91" stroke-width="1.8"/></marker></defs><text class="title" x="42" y="58">Where GC cost appears</text><rect class="gold" x="42" y="125" width="228" height="160" rx="15"/><text class="label" x="61" y="161">STW pauses</text><text class="body" x="61" y="190">All mutators stop</text><text class="body" x="61" y="219">Elapsed time</text><rect class="accent" x="297" y="125" width="228" height="160" rx="15"/><text class="label" x="316" y="161">Concurrent GC</text><text class="body" x="316" y="190">GC-worker CPU</text><text class="body" x="316" y="219">Core competition</text><rect class="box" x="552" y="125" width="228" height="160" rx="15"/><text class="label" x="571" y="161">Mutator work</text><text class="body" x="571" y="190">Barriers + allocation</text><text class="body" x="571" y="219">Application CPU</text><rect class="rose" x="807" y="125" width="228" height="160" rx="15"/><text class="label" x="826" y="161">Allocation stalls</text><text class="body" x="826" y="190">Mutator waits</text><text class="body" x="826" y="219">Request elapsed</text><text class="label" x="72" y="345">Elapsed progress</text><path class="plain" d="M266 337 L949 337"/><rect class="gold" x="305" y="314" width="65" height="45" rx="5"/><rect class="rose" x="590" y="314" width="125" height="45" rx="5"/><text class="body" x="303" y="398">pause</text><text class="body" x="580" y="398">stall</text><text class="note" x="42" y="454">CPU and elapsed intervals may overlap; do not sum these as four independent totals.</text></svg>
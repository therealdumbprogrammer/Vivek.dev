<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Four threads arrive at one safepoint</title><desc id="desc">Early arrivals wait for the last relevant Java thread; the VM operation begins only after synchronization.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">Four threads arrive at one safepoint</text><text class="body" x="56" y="120">request</text><path class="dash" d="M165 90V425"/><text class="body" x="900" y="120">operation</text><path class="dash" d="M785 90V425"/><text class="head" x="58" y="181">Thread A</text><path class="line" d="M180 175H315"/><circle cx="315" cy="175" r="9" fill="#b8873f"/><path class="dash" d="M327 175H785"/><text class="small" x="327" y="162">waiting</text><text class="head" x="58" y="251">Thread B</text><path class="line" d="M180 245H370"/><circle cx="370" cy="245" r="9" fill="#b8873f"/><path class="dash" d="M382 245H785"/><text class="small" x="382" y="232">waiting</text><text class="head" x="58" y="321">Thread C</text><path class="line" d="M180 315H340"/><circle cx="340" cy="315" r="9" fill="#b8873f"/><path class="dash" d="M352 315H785"/><text class="small" x="352" y="302">waiting</text><text class="head" x="58" y="391">Thread D</text><path class="line" d="M180 385H760"/><circle cx="760" cy="385" r="9" fill="#b8873f"/><path class="dash" d="M772 385H785"/><rect class="teal" x="795" y="145" width="225" height="255" rx="14"/><text class="head" x="907" y="275" text-anchor="middle">VM work</text><text class="small" x="530" y="465" text-anchor="middle">Reaching ends when the last relevant thread becomes safe</text></svg>
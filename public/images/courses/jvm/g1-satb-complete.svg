<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">SATB across the G1 cycle</title><desc id="desc">Snapshot and TAMS lead to barrier entries, concurrent work, Remark, and Cleanup.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">SATB across the G1 cycle</text><rect x="35" y="155" width="175" height="120" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="122.5" y="208.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Concurrent Start</text><text x="122.5" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">snapshot / TAMS</text><rect x="250" y="155" width="175" height="120" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="337.5" y="208.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Mutator writes</text><text x="337.5" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">SATB buffers</text><rect x="465" y="155" width="175" height="120" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="552.5" y="208.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Concurrent Mark</text><text x="552.5" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">trace graph</text><rect x="680" y="155" width="175" height="120" rx="14" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="767.5" y="208.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Remark</text><text x="767.5" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">fixed point</text><path d="M210 215 L245 215" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M425 215 L460 215" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 215 L675 215" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">Cleanup follows; Mixed collections use the completed liveness result.</text></svg>

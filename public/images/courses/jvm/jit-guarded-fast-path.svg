<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Profile leads to a guarded fast path</title><desc id="desc">Observed RegularDiscount calls support a type guard; a new receiver may use fallback or an uncommon trap.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="58">Profile leads to a guarded fast path</text><rect class="box" x="70" y="115" width="270" height="105" rx="14"/><text class="head" x="205" y="158" text-anchor="middle">Observed calls</text><text class="body" x="205" y="190" text-anchor="middle">Regular dominates</text><path class="line" d="M340 166H405"/><rect class="gold" x="405" y="115" width="270" height="105" rx="14"/><text class="head" x="540" y="158" text-anchor="middle">Receiver guard</text><text class="body" x="540" y="190" text-anchor="middle">actual runtime type?</text><path class="line" d="M675 166H740"/><rect class="teal" x="740" y="105" width="290" height="115" rx="14"/><text class="head" x="885" y="150" text-anchor="middle">Regular fast path</text><text class="body" x="885" y="185" text-anchor="middle">possible inlining</text><path class="line" d="M540 220V300"/><rect class="rose" x="380" y="300" width="320" height="110" rx="14"/><text class="head" x="540" y="343" text-anchor="middle">Unexpected receiver</text><text class="body" x="540" y="380" text-anchor="middle">fallback or uncommon trap</text><text class="small" x="540" y="475" text-anchor="middle">Which path exists depends on the compiled method</text></svg>
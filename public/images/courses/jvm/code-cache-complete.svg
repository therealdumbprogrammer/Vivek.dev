<svg xmlns="http://www.w3.org/2000/svg" width="480" height="590" viewBox="0 0 480 590" role="img" aria-labelledby="title desc"><title id="title">THE COMPLETE ADAPTIVE EXECUTION LOOP</title><desc id="desc">Bytecode runs through interpretation and profiling to C1 and C2. Compilation creates an nmethod containing machine instructions and runtime maps. HotSpot installs it in the Code Cache for CPU execution, while invalidation and later reclamation feed continued adaptation.</desc><defs><marker id="arrow-complete" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="590" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="15" text-anchor="middle">THE COMPLETE ADAPTIVE EXECUTION LOOP</text><rect x="24" y="58" width="132" height="76" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="90" y="89" font-size="15" text-anchor="middle">Bytecode</text><text x="90" y="113" font-size="13" text-anchor="middle">portable input</text><path d="M158 96h34" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-complete)"/><rect x="196" y="58" width="128" height="76" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="260" y="87" font-size="15" text-anchor="middle">Interpreter</text><text x="260" y="111" font-size="13" text-anchor="middle">+ profiles</text><path d="M326 96h34" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-complete)"/><rect x="364" y="58" width="92" height="76" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="410" y="87" font-size="15" text-anchor="middle">C1 / C2</text><text x="410" y="111" font-size="13" text-anchor="middle">compile</text><path d="M410 136v34" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-complete)"/><rect x="72" y="174" width="384" height="176" rx="16" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="264" y="204" font-size="17" text-anchor="middle">nmethod</text><rect x="92" y="222" width="162" height="104" rx="12" fill="#dce7ff" stroke="#315dcc"/><text x="173" y="253" font-size="15" text-anchor="middle">Machine code</text><text x="173" y="278" font-size="13" text-anchor="middle">entry points · body</text><text x="173" y="300" font-size="13" text-anchor="middle">handlers · stubs</text><rect x="270" y="222" width="166" height="104" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="353" y="249" font-size="15" text-anchor="middle">Runtime maps</text><text x="353" y="274" font-size="13" text-anchor="middle">references · stack scopes</text><text x="353" y="296" font-size="13" text-anchor="middle">safepoints · deopt</text><text x="353" y="316" font-size="13" text-anchor="middle">dependencies · relocation</text><path d="M264 352v34" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-complete)"/><rect x="72" y="390" width="250" height="76" rx="12" fill="#dce7ff" stroke="#315dcc"/><text x="197" y="420" font-size="16" text-anchor="middle">Native Code Cache</text><text x="197" y="444" font-size="13" text-anchor="middle">installed executable artifact</text><path d="M324 428h34" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-complete)"/><rect x="362" y="390" width="94" height="76" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="409" y="420" font-size="16" text-anchor="middle">CPU</text><text x="409" y="444" font-size="13" text-anchor="middle">executes</text><path d="M409 468v42H197v-40" fill="none" stroke="#9aa8bb" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-complete)"/><text x="303" y="532" font-size="13" text-anchor="middle">invalidate · adapt · compile again</text><text x="240" y="568" font-size="13" text-anchor="middle">Metadata connects compiled execution to GC, recovery, and safepoints</text></g></svg>

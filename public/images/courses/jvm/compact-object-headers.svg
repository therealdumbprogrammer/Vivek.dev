<svg xmlns="http://www.w3.org/2000/svg" width="480" height="410" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
<title id="title">Conventional and compact headers</title><desc id="desc">JDK 25 compact object headers encode runtime and class information together in eight bytes and are disabled by default.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker><pattern id="gap" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f1f5f9"/><path d="M0 6 L6 0" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="480" height="410" rx="24" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif"><text x="26" y="36" font-size="16" fill="#334155" font-weight="650">TWO HEADER MODES · JDK 25</text><rect x="30" y="62" width="420" height="130" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="50" y="96" font-size="24" fill="#334155" font-weight="650">Conventional · 12 bytes</text><text x="50" y="132" font-size="20" fill="#334155" font-weight="400">Mark Word: 8 bytes</text><text x="50" y="166" font-size="19" fill="#334155" font-weight="400">Compressed Klass pointer: 4 bytes</text><rect x="30" y="217" width="420" height="116" rx="12" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="50" y="251" font-size="24" fill="#334155" font-weight="650">Compact · 8 bytes</text><text x="50" y="286" font-size="20" fill="#334155" font-weight="400">Runtime + class information</text><text x="50" y="314" font-size="19" fill="#334155" font-weight="400">encoded together</text><text x="30" y="366" font-size="19" fill="#334155" font-weight="400">Product feature · disabled by default</text><text x="30" y="392" font-size="18" fill="#315dcc" font-weight="400">-XX:+UseCompactObjectHeaders</text></g></svg>

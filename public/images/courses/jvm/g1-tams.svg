<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Top At Mark Start</title><desc id="desc">A single G1 region has objects that existed at mark start below a Top At Mark Start boundary and later allocations above it.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Top At Mark Start</text><rect x="275" y="92" width="350" height="270" rx="14" fill="#f8fafc" stroke="#91a3b3" stroke-width="2"/><rect x="278" y="95" width="344" height="112" rx="10" fill="#d9f3ea"/><rect x="278" y="239" width="344" height="120" rx="10" fill="#d9eafb"/><path d="M277 224 L623 224" stroke="#536779" stroke-width="3" stroke-dasharray="9 6"/><text x="450" y="140" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Allocated after mark start</text><text x="450" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Present at mark start</text><text x="640" y="229" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">TAMS</text><text x="450" y="417" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">New allocations are handled conservatively in the current marking cycle.</text></svg>

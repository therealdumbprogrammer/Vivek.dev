<svg xmlns="http://www.w3.org/2000/svg" width="480" height="465" viewBox="0 0 480 465" role="img" aria-labelledby="title desc">
<title id="title">DEFAULTS BEFORE JAVA LOGIC</title><desc id="desc">Ordinary static defaults precede Java initialization assignments.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="465" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">DEFAULTS BEFORE JAVA LOGIC</text><rect x="35" y="69" width="410" height="80" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="102.5" font-size="16" text-anchor="middle">static int count = 42;</text><text x="240.0" y="125.5" font-size="16" text-anchor="middle">static Object owner = new Object();</text><path d="M240 150 L240 180" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="35" y="184" width="410" height="84" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="219.5" font-size="16" text-anchor="middle">Preparation</text><text x="240.0" y="242.5" font-size="16" text-anchor="middle">count = 0  ·  owner = null</text><path d="M240 270 L240 307" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="35" y="312" width="410" height="84" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="347.5" font-size="16" text-anchor="middle">Java initialization logic</text><text x="240.0" y="370.5" font-size="16" text-anchor="middle">count = 42  ·  owner → new object</text><text x="240" y="437" font-size="15" text-anchor="middle">ConstantValue fields use a separate mechanism.</text></g></svg>
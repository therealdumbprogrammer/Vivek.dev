<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="title desc"><title id="title">MATCH THE SIGNAL TO THE QUESTION</title><desc id="desc">Four JFR allocation views: counter deltas, refill triggers, outside allocations, and weighted samples.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="530" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">MATCH THE SIGNAL TO THE QUESTION</text><rect x="24" y="68" width="432" height="91" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="94" font-size="17">Thread Allocation Statistics</text><text x="36" y="119" font-size="15">Cumulative bytes; use deltas for rate.</text><text x="36" y="142" font-size="15">Platform-thread counters in this HotSpot.</text><rect x="24" y="173" width="432" height="91" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="199" font-size="17">Allocation in New TLAB</text><text x="36" y="224" font-size="15">Triggering object + new buffer size.</text><text x="36" y="247" font-size="15">Not every object inside the buffer.</text><rect x="24" y="278" width="432" height="91" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="304" font-size="17">Allocation Outside TLAB</text><text x="36" y="329" font-size="15">Which allocations bypass the buffer?</text><text x="36" y="352" font-size="15">Size and stack help explain the path.</text><rect x="24" y="383" width="432" height="91" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="409" font-size="17">Object Allocation Sample</text><text x="36" y="434" font-size="15">Which classes / stacks drive pressure?</text><text x="36" y="457" font-size="15">Aggregate weights, not event counts.</text><text x="24" y="509" font-size="16">Allocation signals do not establish retention.</text></g></svg>
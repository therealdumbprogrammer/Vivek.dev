<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc"><title id="title">Two barrier jobs, one object graph</title><desc id="desc">Load barriers make reads usable; store barriers maintain marking and young-collection information.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#72859b"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#25344a}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line{stroke:#a9b9cd}}</style><rect width="1080" height="480" rx="22" class="bg"/><text x="36" y="51" class="title">Two barrier jobs, one object graph</text><rect x="40" y="125" width="470" height="280" rx="14" class="blue"/><text x="65" y="165" class="head">Reference load</text><text x="65" y="214" class="body">Customer reads Order</text><path d="M260 232 L260 282" class="line" marker-end="url(#arrow)"/><text x="65" y="320" class="body">Check state; resolve relocation</text><text x="65" y="349" class="body">when needed.</text><rect x="570" y="125" width="470" height="280" rx="14" class="mint"/><text x="595" y="165" class="head">Reference store</text><text x="595" y="214" class="body">Old Customer → Young Order</text><path d="M790 232 L790 282" class="line" marker-end="url(#arrow)"/><text x="595" y="320" class="body">Record changes needed for</text><text x="595" y="349" class="body">marking and young collection.</text><text x="40" y="448" class="small">Colored references carry GC metadata; barriers preserve different invariants.</text></svg>
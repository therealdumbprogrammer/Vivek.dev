<svg xmlns="http://www.w3.org/2000/svg" width="480" height="550" viewBox="0 0 480 550" role="img" aria-labelledby="title desc"><title id="title">FROM NEW TO OBJECT LIFETIME</title><desc id="desc">Normal allocation occurs inside young heap, followed by use and GC. A dashed optimization branch can avoid materializing the object.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="550" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">FROM NEW TO OBJECT LIFETIME</text><rect x="24" y="67" width="193" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="100.5" font-size="16">new in source</text><path d="M220 94 L267 94" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="276" y="62" width="180" height="95" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="288" y="86" font-size="15">Possible JIT</text><text x="288" y="109" font-size="15">scalar replacement</text><text x="288" y="137" font-size="15">No heap object</text><path d="M121 127 L121 175" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="183" width="432" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="216.5" font-size="16">Young heap: allocate, often in a TLAB</text><path d="M240 243 L240 270" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="278" width="432" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="311.5" font-size="16">Initialize → construct → use</text><path d="M240 338 L240 363" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="371" width="432" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="404.5" font-size="16">Young GC: follow reachability</text><path d="M130 430 L130 467" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M350 430 L350 467" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="476" width="205" height="50" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="507.0" font-size="16">Dead → reclaim</text><rect x="251" y="476" width="205" height="50" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="263" y="507.0" font-size="16">Live → preserve</text><text x="257" y="546" font-size="14">May later promote</text></g></svg>
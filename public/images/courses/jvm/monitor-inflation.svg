<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Inflation adds coordination state</title><desc id="desc">A lightweight lock can transition to an ObjectMonitor with ownership, recursion, entry contention, a wait set and park-unpark coordination.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#23364a}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:17px}.muted{fill:#5c6d7a}.card{fill:#fff;stroke:#9caeba;stroke-width:2}.blue{fill:#e7f0f7;stroke:#547fa8;stroke-width:3}.teal{fill:#e7f2ef;stroke:#57998f;stroke-width:3}.clay{fill:#fbede6;stroke:#d48763;stroke-width:3}.gold{fill:#fbf4df;stroke:#c8a34f;stroke-width:3}.arrow{stroke:#547fa8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547fa8"/></marker></defs><rect width="960" height="540" rx="24" fill="#fbfaf7"/><text x="48" y="56" text-anchor="start" class="title">Inflation adds coordination state</text><rect x="50" y="190" width="235" height="130" rx="18" class="teal"/><text x="167.5" y="247.0" text-anchor="middle" class="label">Lightweight state</text><text x="167.5" y="278.0" text-anchor="middle" class="small muted">Mark Word + LockStack</text><path d="M285 255 L365 255" class="arrow"/><rect x="370" y="120" width="535" height="285" rx="18" class="clay"/><text x="637" y="160" text-anchor="middle" class="label">ObjectMonitor</text><rect x="410" y="190" width="210" height="75" rx="18" class="card"/><text x="515.0" y="227.5" text-anchor="middle" class="label">Owner + recursion</text><rect x="650" y="190" width="205" height="75" rx="18" class="card"/><text x="752.5" y="219.5" text-anchor="middle" class="label">Contenders</text><text x="752.5" y="250.5" text-anchor="middle" class="small muted">entry list</text><rect x="410" y="290" width="210" height="75" rx="18" class="gold"/><text x="515.0" y="327.5" text-anchor="middle" class="label">Wait set</text><rect x="650" y="290" width="205" height="75" rx="18" class="blue"/><text x="752.5" y="327.5" text-anchor="middle" class="label">Spin / park / wake</text><rect x="210" y="440" width="545" height="55" rx="18" class="card"/><text x="482.5" y="467.5" text-anchor="middle" class="small">Inflation changes representation; idle monitors can deflate</text></svg>
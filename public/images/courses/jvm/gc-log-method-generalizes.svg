<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">One method, several collectors</title><desc id="desc">The same reading questions apply to G1, Serial, Parallel, and ZGC with different terminology.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">One method, several collectors</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687c8c"/></marker></defs><rect x="45" y="120" width="180" height="86" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="135.0" y="170.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">Collector + config</text><rect x="230" y="120" width="180" height="86" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="320.0" y="170.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">Cadence + occupancy</text><rect x="430" y="120" width="180" height="86" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="520.0" y="170.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">Generation movement</text><rect x="640" y="120" width="180" height="86" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="730.0" y="170.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">Phases + failures</text><path d="M225 163 L230 163" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M425 163 L430 163" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M635 163 L640 163" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="82" y="292" width="150" height="62" rx="13" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="157.0" y="330.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">G1</text><rect x="282" y="292" width="150" height="62" rx="13" fill="#fff0d2" stroke="#687c8c" stroke-width="2"/><text x="357.0" y="330.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">Serial</text><rect x="482" y="292" width="150" height="62" rx="13" fill="#e5e3f5" stroke="#687c8c" stroke-width="2"/><text x="557.0" y="330.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">Parallel</text><rect x="682" y="292" width="150" height="62" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="757.0" y="330.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">ZGC</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">A predicted pause budget</title><desc id="desc">G1 estimates required young, root, and optional old work against a pause goal.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs>
<rect width="900" height="450" fill="#f8fafc"/>
<text x="450" y="49" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="bold" fill="#183047">A predicted pause budget</text>
<text x="450" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="normal" fill="#536779">Illustrative cost model</text><rect x="65" y="150" width="235" height="98" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="182.5" y="196.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Young evacuation</text><text x="182.5" y="224.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">required work</text><rect x="333" y="150" width="235" height="98" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="450.5" y="196.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Roots + cards</text><text x="450.5" y="224.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">required scanning</text><rect x="601" y="150" width="235" height="98" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="718.5" y="196.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Old candidates</text><text x="718.5" y="224.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">selected if useful</text><path d="M449 256 L449 308" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="278" y="315" width="342" height="70" rx="14" fill="#e7edf2" stroke="#91a3b3" stroke-width="2"/><text x="449.0" y="357.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Predicted pause ≤ goal?</text><text x="450" y="421" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="normal" fill="#536779">Prediction may miss; MaxGCPauseMillis is a goal.</text>
</svg>
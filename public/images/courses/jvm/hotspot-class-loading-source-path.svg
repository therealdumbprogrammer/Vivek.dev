<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc"><title id="title">From class file to metadata</title><desc id="desc">Follow class loading by ownership, not every function call</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:1.5}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:1.5}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:1.5}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:1.5}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:1.5}.line{fill:none;stroke:#7b8ba0;stroke-width:2}.dash{fill:none;stroke:#8898aa;stroke-width:1.5;stroke-dasharray:6 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}.tag{font-size:16px;font-weight:700;letter-spacing:.06em;fill:#466189}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.tag{fill:#a9c2ef}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="410" rx="22" class="bg"/><text x="36" y="49" class="title">From class file to metadata</text><text x="36" y="77" class="sub">Follow class loading by ownership, not every function call</text><rect x="36.0" y="125" width="232.5" height="178" rx="15" class="card"/><text x="54.0" y="156" class="head">Class bytes</text><text x="54.0" y="185" class="body">Order.class</text><text x="54.0" y="211" class="body">symbolic entries</text><rect x="294.5" y="125" width="232.5" height="178" rx="15" class="blue"/><text x="312.5" y="156" class="head">ClassFileParser</text><text x="312.5" y="185" class="body">classfile/</text><text x="312.5" y="211" class="body">parse and verify</text><path d="M272.5 214.0 L289.5 214.0" class="line" marker-end="url(#arrow)"/><rect x="553.0" y="125" width="232.5" height="178" rx="15" class="mint"/><text x="571.0" y="156" class="head">InstanceKlass</text><text x="571.0" y="185" class="body">oops/</text><text x="571.0" y="211" class="body">layout + methods</text><path d="M531.0 214.0 L548.0 214.0" class="line" marker-end="url(#arrow)"/><rect x="811.5" y="125" width="232.5" height="178" rx="15" class="amber"/><text x="829.5" y="156" class="head">ClassLoaderData</text><text x="829.5" y="185" class="body">classfile/ + memory/</text><text x="829.5" y="211" class="body">metadata lifetime</text><path d="M789.5 214.0 L806.5 214.0" class="line" marker-end="url(#arrow)"/><text x="36" y="376" class="small">Resolution and initialization happen when required; this map omits intermediate phases.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">SATB records the old value</title><desc id="desc">The mutator overwrites A.ref while marking continues.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="500" rx="22" class="bg"/><text x="36" y="51" class="title">SATB records the old value</text><text x="36" y="81" class="sub">The mutator overwrites A.ref while marking continues.</text><rect x="36" y="145" width="275" height="230" rx="18" class="blue"/><text x="56" y="182" class="head">Before</text><text x="56" y="219" class="body">A.ref → B</text><text x="56" y="247" class="body">snapshot sees B</text><rect x="402" y="145" width="275" height="230" rx="18" class="amber"/><text x="422" y="182" class="head">Overwrite</text><text x="422" y="219" class="body">pre-write reads B</text><text x="422" y="247" class="body">A.ref = C</text><rect x="768" y="145" width="275" height="230" rx="18" class="mint"/><text x="788" y="182" class="head">After</text><text x="788" y="219" class="body">A.ref → C</text><text x="788" y="247" class="body">B stays in mark work</text><path d="M317 260 L396 260" class="line" marker-end="url(#arrow)"/><path d="M683 260 L762 260" class="line" marker-end="url(#arrow)"/><rect x="402" y="394" width="275" height="62" rx="18" class="rose"/><text x="422" y="431" class="head">SATB buffer: B</text><path d="M539 375 L539 389" class="line" marker-end="url(#arrow)"/><text x="36" y="475" class="small">Card tracking serves a different purpose: locating newly written heap edges.</text></svg>
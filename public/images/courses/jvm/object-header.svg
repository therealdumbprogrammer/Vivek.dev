<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title desc">
<title id="title">Header plus application data</title><desc id="desc">The conventional header is 8 bytes of Mark Word and 4 bytes of compressed class pointer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker><pattern id="gap" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f1f5f9"/><path d="M0 6 L6 0" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="480" height="490" rx="24" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif"><text x="26" y="36" font-size="16" fill="#334155" font-weight="650">CONVENTIONAL HOTSPOT HEADER</text><text x="26" y="69" font-size="19" fill="#334155" font-weight="400">64-bit · compressed class pointers</text><rect x="40" y="94" width="400" height="210" rx="12" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="60" y="126" font-size="24" fill="#17243c" font-weight="650">12 bytes of header</text><rect x="60" y="145" width="360" height="66" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="77" y="173" font-size="22" fill="#334155" font-weight="600">Mark Word</text><text x="77" y="197" font-size="17" fill="#334155" font-weight="400">8 bytes · per-object runtime state</text><rect x="60" y="224" width="360" height="60" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="77" y="250" font-size="22" fill="#334155" font-weight="600">Klass pointer</text><text x="77" y="274" font-size="17" fill="#334155" font-weight="400">4 bytes · identifies the class</text><rect x="40" y="324" width="400" height="58" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="60" y="361" font-size="22" fill="#334155" font-weight="400">Instance fields</text><rect x="40" y="397" width="400" height="48" rx="12" fill="url(#gap)" stroke="#dce5ef" stroke-width="2"/><text x="60" y="429" font-size="20" fill="#334155" font-weight="400">Possible padding</text><text x="26" y="476" font-size="16" fill="#334155" font-weight="400">Ordinary instance · compact headers off</text></g></svg>

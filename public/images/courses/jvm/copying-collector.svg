<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Evacuate selected source space</title><desc id="desc">Survivors move into destination space; garbage stays behind.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="450" rx="22" fill="#f8fafc"/>
<text x="30" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">Evacuate selected source space</text>
<rect x="35" y="120" width="360" height="185" rx="14" fill="#e8f1fb" stroke="#9aafc2" stroke-width="2"/><text x="215.0" y="203.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Source space</text><text x="215.0" y="232.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">A · garbage · B · garbage</text><rect x="505" y="120" width="360" height="185" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="685.0" y="203.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Destination space</text><text x="685.0" y="232.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#52657a">A · B · free tail</text><path d="M400 193 L495 193" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/><text x="447.5" y="184.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#52657a">copy survivors</text><text x="215" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#19324d">Source becomes reusable</text><text x="685" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#19324d">Survivors packed together</text>
<rect x="25" y="377" width="850" height="48" rx="10" fill="white" stroke="#d5dfe8"/>
<text x="450" y="407" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="500" fill="#52657a">Reclamation and compaction happen together for the selected source.</text>
</svg>
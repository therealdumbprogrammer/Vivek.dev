<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">SLOTS, NOT SOURCE NAMES</title><desc id="desc">Instance add uses slots zero through three. Static add has no receiver, so arguments begin at zero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="480" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">SLOTS, NOT SOURCE NAMES</text><text x="240" y="72" font-size="16" text-anchor="middle">Instance add(int a, int b)</text><rect x="42" y="90" width="396" height="46" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="119.0" font-size="16" text-anchor="middle">slot 0     receiver: this</text><rect x="42" y="147" width="396" height="46" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="176.0" font-size="16" text-anchor="middle">slot 1     a: 10</text><rect x="42" y="204" width="396" height="46" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="233.0" font-size="16" text-anchor="middle">slot 2     b: 20</text><rect x="42" y="261" width="396" height="46" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="290.0" font-size="16" text-anchor="middle">slot 3     result: not yet stored</text><rect x="42" y="345" width="396" height="94" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="374.0" font-size="16" text-anchor="middle">Static version: no this</text><text x="240.0" y="398.0" font-size="16" text-anchor="middle">slot 0 = a · slot 1 = b</text><text x="240.0" y="422.0" font-size="16" text-anchor="middle">slot 2 = result after the store</text><text x="240" y="462" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
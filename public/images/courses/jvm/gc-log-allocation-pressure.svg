<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Estimate consumption pressure</title><desc id="desc">Four sawtooth intervals show the rise between consecutive young collections.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Estimate consumption pressure</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687c8c"/></marker></defs><path d="M85 340 H820 M85 340 V90" stroke="#687c8c" stroke-width="3" fill="none"/><path d="M140 290 L235 120 L235 282" stroke="#4779a8" stroke-width="5" fill="none"/><text x="192" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">300M after</text><path d="M330 280 L425 300 L425 272" stroke="#4779a8" stroke-width="5" fill="none"/><text x="382" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">320M after</text><path d="M520 270 L615 480 L615 262" stroke="#4779a8" stroke-width="5" fill="none"/><text x="572" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">340M after</text><path d="M710 260 L805 660 L805 252" stroke="#4779a8" stroke-width="5" fill="none"/><text x="762" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">360M after</text><rect x="300" y="355" width="330" height="55" rx="13" fill="#fff0d2" stroke="#687c8c" stroke-width="2"/><text x="465.0" y="389.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#183047">~600 MB rise in ~1 second</text></svg>
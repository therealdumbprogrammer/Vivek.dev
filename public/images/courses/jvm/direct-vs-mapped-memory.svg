<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">TWO OFF-HEAP PATHS</title><desc id="desc">Direct buffers use explicit native storage; file mappings connect virtual addresses to file-backed pages managed through OS paging.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="900" height="450" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="450" y="48" class="title" text-anchor="middle">TWO OFF-HEAP PATHS</text><rect x="20" y="72" width="860" height="320" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30.0" y="130" width="413.0" height="210" rx="16" fill="#e8efff" stroke="#4968b5" stroke-width="1.5"/><text x="236.5" y="164" class="head" text-anchor="middle">allocateDirect()</text><text x="236.5" y="212" class="body" text-anchor="middle">explicit native allocation</text><text x="236.5" y="242" class="body" text-anchor="middle">NIO capacity accounting</text><path d="M 445.0 235.0 H 455.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="457.0" y="130" width="413.0" height="210" rx="16" fill="#eef5f4" stroke="#4d827a" stroke-width="1.5"/><text x="663.5" y="164" class="head" text-anchor="middle">FileChannel.map()</text><text x="663.5" y="212" class="body" text-anchor="middle">file-backed mapping</text><text x="663.5" y="242" class="body" text-anchor="middle">OS paging / page cache</text><text x="450" y="425" class="foot" text-anchor="middle">Same broad location · different mechanism</text></g><style>.title{font-size:20px;font-weight:700;letter-spacing:.3px}.head{font-size:16px;font-weight:650}.body{font-size:14px}.foot{font-size:13px;fill:#58677d}</style></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">The G1 collection cycle</title><desc id="desc">Young-Only phase leads to Concurrent Start, marking, Remark, Cleanup, and Mixed collections.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs>
<rect width="900" height="450" fill="#f8fafc"/>
<text x="450" y="49" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="bold" fill="#183047">The G1 collection cycle</text>
<rect x="60" y="110" width="220" height="82" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="170.0" y="158.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Young-Only</text><path d="M284 151 L334 151" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="340" y="110" width="220" height="82" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="148.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Concurrent Start</text><text x="450.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">young pause</text><path d="M564 151 L614 151" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="110" width="220" height="82" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="730.0" y="158.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Concurrent Mark</text><path d="M730 198 L730 251" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="258" width="220" height="82" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="730.0" y="306.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Remark</text><path d="M614 299 L564 299" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="340" y="258" width="220" height="82" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="306.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Cleanup</text><path d="M334 299 L284 299" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="258" width="220" height="82" rx="14" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="170.0" y="296.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Space-Reclamation</text><text x="170.0" y="324.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">Mixed collections</text><text x="450" y="398" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">Then the Young-Only phase repeats. Evacuation pauses stop application threads.</text>
</svg>
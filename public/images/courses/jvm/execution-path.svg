<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">From Java source to a running program</title><desc id="desc">Three stops: source, class file, and the JVM. javac prepares bytecode; the JVM runs it.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dce3ec"/></pattern></defs><g font-family="system-ui, -apple-system, sans-serif"><rect width="480" height="520" rx="24" fill="#f7f9fc"/><rect width="480" height="520" rx="24" fill="url(#dots)"/><text x="28" y="38" font-size="14" fill="#475569" font-weight="650">YOUR PROGRAM, TWO DIFFERENT JOBS</text><rect x="25" y="70" width="430" height="108" rx="18" fill="#dae1ed"/><rect x="24" y="65" width="430" height="108" rx="18" fill="white"/><rect x="40" y="87" width="54" height="54" rx="14" fill="#e9efff"/><text x="67" y="122" text-anchor="middle" font-size="23" fill="#315dcc" font-weight="650">&lt;/&gt;</text><text x="110" y="95" font-size="12" fill="#315dcc" font-weight="700">01</text><text x="110" y="123" font-size="22" fill="#17243c" font-weight="650">You write Java</text><text x="110" y="150" font-size="16" fill="#334155" font-weight="400">MyApplication.java</text><path d="M67 179 v22 m-5 -5 l5 5 5 -5" fill="none" stroke="#315dcc" stroke-width="2" stroke-linecap="round"/><text x="87" y="198" font-size="14" fill="#315dcc" font-weight="550">javac</text><rect x="25" y="212" width="430" height="108" rx="18" fill="#dae1ed"/><rect x="24" y="207" width="430" height="108" rx="18" fill="white"/><rect x="40" y="229" width="54" height="54" rx="14" fill="#dff4ed"/><text x="67" y="264" text-anchor="middle" font-size="23" fill="#087b6f" font-weight="650">{}</text><text x="110" y="237" font-size="12" fill="#087b6f" font-weight="700">02</text><text x="110" y="265" font-size="22" fill="#17243c" font-weight="650">The compiler prepares it</text><text x="110" y="292" font-size="16" fill="#334155" font-weight="400">Class file · bytecode inside</text><path d="M67 321 v22 m-5 -5 l5 5 5 -5" fill="none" stroke="#087b6f" stroke-width="2" stroke-linecap="round"/><text x="87" y="340" font-size="14" fill="#087b6f" font-weight="550">java MyApplication</text><rect x="25" y="354" width="430" height="108" rx="18" fill="#dae1ed"/><rect x="24" y="349" width="430" height="108" rx="18" fill="white"/><rect x="40" y="371" width="54" height="54" rx="14" fill="#f0e7fa"/><text x="67" y="406" text-anchor="middle" font-size="23" fill="#773bad" font-weight="650">▶</text><text x="110" y="379" font-size="12" fill="#773bad" font-weight="700">03</text><text x="110" y="407" font-size="22" fill="#17243c" font-weight="650">The JVM runs it</text><text x="110" y="434" font-size="16" fill="#334155" font-weight="400">Using the operating system + CPU</text><text x="28" y="496" font-size="13" fill="#475569" font-weight="600">BYTECODE IS THE HANDOFF BETWEEN THEM</text></g></svg>
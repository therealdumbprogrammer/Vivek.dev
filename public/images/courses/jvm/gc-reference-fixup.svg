<svg xmlns="http://www.w3.org/2000/svg" width="480" height="545" viewBox="0 0 480 545" role="img" aria-labelledby="title desc"><title id="title">SAME OBJECT · NEW LOCATION</title><desc id="desc">SAME OBJECT · NEW LOCATION. Live blocks are blue and named; dead or free blocks have explicit labels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="545" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="36" font-size="20" fill="#334155">SAME OBJECT · NEW LOCATION</text><text x="30" y="90" font-size="18" fill="#334155">Before relocation</text><rect x="30" y="115" width="90" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="40" y="146" font-size="18" fill="#334155">A</text><rect x="300" y="115" width="140" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="310" y="146" font-size="18" fill="#334155">B at X</text><path d="M130 139 L286 139" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="230" font-size="18" fill="#334155">GC moves B and preserves references</text><text x="30" y="299" font-size="18" fill="#334155">After relocation</text><rect x="30" y="320" width="90" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="40" y="351" font-size="18" fill="#334155">A</text><rect x="300" y="320" width="140" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="310" y="351" font-size="18" fill="#334155">B at Y</text><path d="M130 344 L286 344" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="412" width="140" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="310" y="443" font-size="18" fill="#334155">X: free</text><text x="30" y="511" font-size="18" fill="#334155">Java still observes A → B.</text></g></svg>
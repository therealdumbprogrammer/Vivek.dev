<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">The cooperating HotSpot graph</title><desc id="desc">Conceptual relationships across memory and execution</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="1120" height="690" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">The cooperating HotSpot graph</text><text x="36" y="74" class="sub">Arrows mean “relates to” or “uses”; they do not specify every C++ pointer.</text><text x="36" y="111" class="small">METASPACE / CLASS PATH</text><rect x="36" y="130" width="310" height="94" rx="15" class="accent"/><text x="54" y="160" class="head">ClassLoaderData</text><text x="54" y="186" class="body">Metadata lifetime and allocation</text><rect x="404" y="130" width="310" height="94" rx="15" class="mint"/><text x="422" y="160" class="head">InstanceKlass</text><text x="422" y="186" class="body">Class identity, fields, methods</text><rect x="772" y="130" width="310" height="94" rx="15" class="card"/><text x="790" y="160" class="head">ConstantPool</text><text x="790" y="186" class="body">Symbolic entries and resolution</text><path d="M346 177 L402 177" class="line" marker-end="url(#arrow)"/><path d="M714 177 L770 177" class="line" marker-end="url(#arrow)"/><rect x="404" y="266" width="310" height="94" rx="15" class="accent"/><text x="422" y="296" class="head">Method + ConstMethod</text><text x="422" y="322" class="body">Bytecodes; optional profile data</text><path d="M558 224 L558 264" class="line" marker-end="url(#arrow)"/><text x="36" y="414" class="small">HEAP / CODE / EXECUTION</text><rect x="36" y="432" width="310" height="94" rx="15" class="amber"/><text x="54" y="462" class="head">Instance + Class mirror</text><text x="54" y="488" class="body">Heap objects related to Klass</text><rect x="404" y="432" width="310" height="94" rx="15" class="mint"/><text x="422" y="462" class="head">nmethod in Code Cache</text><text x="422" y="488" class="body">Machine code + GC metadata</text><rect x="772" y="432" width="310" height="94" rx="15" class="accent"/><text x="790" y="462" class="head">JavaThread + stack</text><text x="790" y="488" class="body">Compiled frame executes code</text><path d="M346 475 L370 475 L370 246 L390 246 L390 208 L402 208" class="line" marker-end="url(#arrow)"/><path d="M558 360 L558 430" class="line" marker-end="url(#arrow)"/><path d="M772 475 L716 475" class="line" marker-end="url(#arrow)"/><rect x="404" y="564" width="310" height="90" rx="15" class="card"/><text x="422" y="594" class="head">OopMap</text><text x="422" y="620" class="body">Live frame reference locations</text><path d="M558 526 L558 562" class="line" marker-end="url(#arrow)"/><text x="36" y="660" class="small">Object reference layout and compiled-frame OopMaps describe different locations.</text></svg>
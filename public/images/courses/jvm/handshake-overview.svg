<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Thread-local handshake overview</title><desc id="desc">One selected Java thread reaches a safe state and completes runtime work while unrelated threads continue.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Coordinate the target, not the whole JVM</text>
<g font-family="system-ui,sans-serif" font-size="19" fill="#172033"><g fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"><rect x="60" y="110" width="200" height="58" rx="14"/><rect x="60" y="190" width="200" height="58" rx="14"/><rect x="60" y="350" width="200" height="58" rx="14"/><rect x="60" y="430" width="200" height="58" rx="14"/></g><text x="160" y="146" text-anchor="middle">Thread 1 continues</text><text x="160" y="226" text-anchor="middle">Thread 2 continues</text><text x="160" y="386" text-anchor="middle">Thread 218 continues</text><text x="160" y="466" text-anchor="middle">Thread 500 continues</text>
<rect x="60" y="270" width="200" height="58" rx="14" fill="#fff3d6" stroke="#bd7a28" stroke-width="4"/><text x="160" y="306" text-anchor="middle" font-weight="700">Thread 217</text>
<g text-anchor="middle"><rect x="350" y="250" width="180" height="98" rx="18" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="440" y="289" font-weight="700" fill="#7a4614">Safe state</text><text x="440" y="321" fill="#54391d">target accounted for</text><rect x="640" y="250" width="235" height="98" rx="18" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="758" y="289" font-weight="700" fill="#185b42">Handshake work</text><text x="758" y="321" fill="#244c3d">then target continues</text></g></g>
<g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M260 299H350"/><path d="M530 299H640"/></g><g stroke="#328361" stroke-width="4"><path d="M285 139H860"/><path d="M285 219H860"/><path d="M285 379H860"/><path d="M285 459H860"/></g><g font-family="system-ui,sans-serif" font-size="15" fill="#328361"><text x="840" y="130">running</text><text x="840" y="210">running</text><text x="840" y="370">running</text><text x="840" y="450">running</text></g>
</svg>

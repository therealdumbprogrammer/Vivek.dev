<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" role="img" aria-labelledby="title desc"><title id="title">Limit the scarce resource</title><desc id="desc">Many virtual-thread requests converge on a pool with one hundred database connections. Waiting tasks remain outside that finite downstream capacity.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="472" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">Limit the scarce resource</text><rect x="105" y="77" width="430" height="68" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="118.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">100,000 virtual-thread requests</text><path d="M320 145 L320 197" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="105" y="197" width="430" height="91" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="236.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Connection pool: 100</text><text x="320.0" y="262.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Only available connections enter</text><path d="M320 288 L320 337" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="337" width="300" height="61" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="374.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Database capacity</text><text x="320" y="444" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">Others wait, time out, or are rejected by policy.</text></g></svg>
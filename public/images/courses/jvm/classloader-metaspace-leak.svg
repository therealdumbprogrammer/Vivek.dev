<svg xmlns="http://www.w3.org/2000/svg" width="480" height="505" viewBox="0 0 480 505" role="img" aria-labelledby="title desc">
<title id="title">FOLLOW THE RETENTION PATH</title><desc id="desc">A retained loader prevents its ordinary named classes and metadata from being unloaded.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="505" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">FOLLOW THE RETENTION PATH</text><rect x="32" y="65" width="416" height="65" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="102.5" font-size="16" text-anchor="middle">GC root → long-lived cache</text><path d="M240 132 L240 156" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="32" y="160" width="416" height="65" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="197.5" font-size="16" text-anchor="middle">Retained old plugin loader</text><path d="M240 227 L240 251" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="32" y="255" width="416" height="65" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="292.5" font-size="16" text-anchor="middle">Ordinary named classes remain live</text><path d="M240 322 L240 346" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="32" y="350" width="416" height="65" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="387.5" font-size="16" text-anchor="middle">Associated metadata stays occupied</text><text x="240" y="452" font-size="15" text-anchor="middle">Repeat reload + retain → more live generations</text><text x="240" y="480" font-size="15" text-anchor="middle">Removing retention enables, not forces, unloading.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc"><title id="title">Find the owning subsystem</title><desc id="desc">JDK 25 HotSpot: src/hotspot/share/ plus platform ports</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:1.5}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:1.5}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:1.5}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:1.5}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:1.5}.line{fill:none;stroke:#7b8ba0;stroke-width:2}.dash{fill:none;stroke:#8898aa;stroke-width:1.5;stroke-dasharray:6 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}.tag{font-size:16px;font-weight:700;letter-spacing:.06em;fill:#466189}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.tag{fill:#a9c2ef}.line,.dash{stroke:#a9b9cd}}</style><rect width="1120" height="580" rx="22" class="bg"/><text x="36" y="49" class="title">Find the owning subsystem</text><text x="36" y="77" class="sub">JDK 25 HotSpot: src/hotspot/share/ plus platform ports</text><rect x="36" y="125" width="238" height="238" rx="15" class="blue"/><text x="54" y="156" class="head">METADATA</text><text x="54" y="185" class="body">oops/  object + type</text><text x="54" y="211" class="body">classfile/  loading</text><text x="54" y="237" class="body">memory/  VM memory</text><rect x="300" y="125" width="238" height="238" rx="15" class="mint"/><text x="318" y="156" class="head">EXECUTION</text><text x="318" y="185" class="body">runtime/  threads</text><text x="318" y="211" class="body">interpreter/  bytecodes</text><text x="318" y="237" class="body">prims/  JVM + JNI</text><rect x="564" y="125" width="238" height="238" rx="15" class="amber"/><text x="582" y="156" class="head">COMPILATION</text><text x="582" y="185" class="body">compiler/ + ci/</text><text x="582" y="211" class="body">c1/ + opto/</text><text x="582" y="237" class="body">code/  nmethod</text><rect x="828" y="125" width="238" height="238" rx="15" class="card"/><text x="846" y="156" class="head">OBSERVE + GC</text><text x="846" y="185" class="body">gc/  shared + collectors</text><text x="846" y="211" class="body">nmt/  accounting</text><text x="846" y="237" class="body">services/ + jfr/</text><text x="36" y="420" class="body">Platform ports: cpu/ generates instructions  •  os/ provides system services  •  os_cpu/ joins both</text><text x="36" y="459" class="small">The same behavior can cross several owners; start at the most specific one.</text></svg>
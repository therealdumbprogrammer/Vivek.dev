<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">CODE HEAP PRESSURE CAN CONSTRAIN JIT</title><desc id="desc">A hot method enters a compiler queue and becomes an nmethod, but installation requires usable space in the matching Code Heap. Pressure can trigger reclamation or constrain compilation while heap and GC remain healthy.</desc><defs><marker id="arrow-pressure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="15" text-anchor="middle">CODE HEAP PRESSURE CAN CONSTRAIN JIT</text><rect x="24" y="60" width="126" height="74" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="87" y="90" font-size="15" text-anchor="middle">Hot method</text><text x="87" y="114" font-size="13" text-anchor="middle">needs compilation</text><path d="M152 97h36" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-pressure)"/><rect x="192" y="60" width="126" height="74" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="255" y="90" font-size="15" text-anchor="middle">C1 / C2</text><text x="255" y="114" font-size="13" text-anchor="middle">creates nmethod</text><path d="M320 97h36" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-pressure)"/><rect x="360" y="60" width="96" height="74" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="408" y="90" font-size="15" text-anchor="middle">Install</text><text x="408" y="114" font-size="13" text-anchor="middle">needs space</text><path d="M408 136v40" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-pressure)"/><rect x="194" y="180" width="262" height="92" rx="12" fill="#dce7ff" stroke="#315dcc"/><text x="325" y="211" font-size="16" text-anchor="middle">Matching Code Heap is tight</text><text x="325" y="237" font-size="13" text-anchor="middle">usable space · fragmentation · lifecycle</text><text x="325" y="257" font-size="13" text-anchor="middle">must be evaluated together</text><path d="M325 274v42" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow-pressure)"/><rect x="24" y="320" width="200" height="108" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="124" y="350" font-size="15" text-anchor="middle">Runtime response</text><text x="124" y="376" font-size="13" text-anchor="middle">reclaim obsolete code</text><text x="124" y="398" font-size="13" text-anchor="middle">stop / later restart compiler</text><rect x="248" y="320" width="208" height="108" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="352" y="350" font-size="15" text-anchor="middle">Application effect</text><text x="352" y="376" font-size="13" text-anchor="middle">hot work stays less optimized</text><text x="352" y="398" font-size="13" text-anchor="middle">while heap + GC may look healthy</text><text x="240" y="476" font-size="13" text-anchor="middle">Correlate capacity, compilation, queues, JFR, and latency</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc"><title id="title">Leak, retention and page touching</title><desc id="desc">Three distinct ownership and residency mechanisms can produce rising RSS.</desc><rect class="bg" width="1080" height="570" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dashed{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.tiny{font-size:16px}.heapline{stroke:#528a80;stroke-width:6;fill:none}.rssline{stroke:#b8776c;stroke-width:6;fill:none}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dashed{stroke:#92a9bf}.heapline{stroke:#83bfb4}.rssline{stroke:#e0a499}}</style><text class="title" x="42" y="60">Three ways RSS can rise</text><rect class="rose" x="45" y="110" width="310" height="354" rx="14"/><text class="head" x="63" y="153">Live native leak</text><rect class="box" x="62" y="185" width="276" height="61" rx="14"/><text class="small" x="74" y="222">allocation remains owned</text><rect class="box" x="62" y="266" width="276" height="61" rx="14"/><text class="small" x="74" y="303">outstanding bytes grow</text><rect class="box" x="62" y="347" width="276" height="61" rx="14"/><text class="small" x="74" y="384">find owner and missing free</text><rect class="gold" x="385" y="110" width="310" height="354" rx="14"/><text class="head" x="403" y="153">Allocator retention</text><rect class="box" x="402" y="185" width="276" height="61" rx="14"/><text class="small" x="414" y="222">allocation is freed</text><rect class="box" x="402" y="266" width="276" height="61" rx="14"/><text class="small" x="414" y="303">reusable pages remain resident</text><rect class="box" x="402" y="347" width="276" height="61" rx="14"/><text class="small" x="414" y="384">test reuse and trimming</text><rect class="teal" x="725" y="110" width="310" height="354" rx="14"/><text class="head" x="743" y="153">Page touching</text><rect class="box" x="742" y="185" width="276" height="61" rx="14"/><text class="small" x="754" y="222">commitment already exists</text><rect class="box" x="742" y="266" width="276" height="61" rx="14"/><text class="small" x="754" y="303">more pages become resident</text><rect class="box" x="742" y="347" width="276" height="61" rx="14"/><text class="small" x="754" y="384">inspect mapping residency</text><text class="body" x="54" y="528">The mechanisms can coexist; a plateau suggests reuse but does not prove no leak.</text></svg>
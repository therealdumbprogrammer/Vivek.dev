<svg xmlns="http://www.w3.org/2000/svg" width="480" height="408" viewBox="0 0 480 408" role="img" aria-labelledby="title desc"><title id="title">TWO PATHS, ONE HEAP</title><desc id="desc">An ordinary small object uses a TLAB while an unsuitable allocation takes the collector path. Both yield heap objects.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="408" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">TWO PATHS, ONE HEAP</text><rect x="24" y="75" width="205" height="65" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="113.5" font-size="16">Small object</text><rect x="251" y="75" width="205" height="65" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="263" y="113.5" font-size="15">Large / unsuitable</text><path d="M125 145 L125 191" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M353 145 L353 191" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="200" width="205" height="65" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="238.5" font-size="16">TLAB fast path</text><rect x="251" y="200" width="205" height="65" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="263" y="238.5" font-size="16">Collector path</text><path d="M125 270 L188 309" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M353 270 L291 309" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="318" width="432" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="351.5" font-size="16">Ordinary heap objects on both paths</text><text x="24" y="396" font-size="14">Outside TLAB does not imply direct-to-old allocation.</text></g></svg>
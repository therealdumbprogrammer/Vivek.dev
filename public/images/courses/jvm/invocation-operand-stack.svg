<svg xmlns="http://www.w3.org/2000/svg" width="480" height="475" viewBox="0 0 480 475" role="img" aria-labelledby="title desc"><title id="title">CALL AND RETURN</title><desc id="desc">Caller operands receiver 10 and 20 initialize callee locals. The callee returns 30 to the caller operand stack.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="475" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">CALL AND RETURN</text><rect x="28" y="65" width="424" height="94" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="106.0" font-size="16" text-anchor="middle">CALLER before invoke</text><text x="240.0" y="130.0" font-size="16" text-anchor="middle">operand stack: […, receiver, 10, 20]</text><path d="M240 163 L240 185" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="189" width="424" height="94" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="218.0" font-size="16" text-anchor="middle">CALLEE add begins</text><text x="240.0" y="242.0" font-size="16" text-anchor="middle">locals: [receiver, 10, 20, unset]</text><text x="240.0" y="266.0" font-size="16" text-anchor="middle">operand stack: [ ]</text><path d="M240 287 L240 309" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="313" width="424" height="94" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="342.0" font-size="16" text-anchor="middle">CALLEE ireturn → CALLER resumes</text><text x="240.0" y="366.0" font-size="16" text-anchor="middle">callee frame completes</text><text x="240.0" y="390.0" font-size="16" text-anchor="middle">caller operand stack: […, 30]</text><text x="240" y="457" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
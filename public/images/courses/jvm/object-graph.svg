<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc">
<title id="title">From the inside of a node to paths between nodes</title><desc id="desc">User points to B, which points to C. Each object has its own shallow size. GC reachability requires paths from roots.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker><pattern id="gap" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f1f5f9"/><path d="M0 6 L6 0" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="480" height="510" rx="24" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif"><text x="26" y="36" font-size="16" fill="#334155" font-weight="650">LAYOUT COUNTS · GRAPH CONNECTS</text><rect x="35" y="63" width="410" height="142" rx="12" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="55" y="96" font-size="23" fill="#334155" font-weight="650">User · 24 bytes in our example</text><text x="55" y="132" font-size="20" fill="#334155" font-weight="400">Header + fields + padding</text><text x="55" y="174" font-size="21" fill="#315dcc" font-weight="650">ref</text><path d="M126 168 L126 252" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="150" y="234" font-size="17" fill="#334155" font-weight="400">reference</text><rect x="35" y="269" width="410" height="64" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="55" y="309" font-size="21" fill="#334155" font-weight="400">Object B · its own shallow size</text><path d="M126 336 L126 374" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="390" width="410" height="64" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="55" y="430" font-size="21" fill="#334155" font-weight="400">Object C · its own shallow size</text><text x="26" y="486" font-size="19" fill="#334155" font-weight="400">Next: which paths start from GC roots?</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Parallel and concurrent are different</title><desc id="desc">Parallel GC workers run during a stop; concurrent work overlaps application execution.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Parallel and concurrent are different</text><text x="105" y="135" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Parallel</text><rect x="210" y="90" width="250" height="75" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="335.0" y="134.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Application paused</text><rect x="475" y="90" width="330" height="75" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="640.0" y="134.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">GC workers run together</text><text x="105" y="280" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Concurrent</text><rect x="210" y="235" width="595" height="62" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="507.5" y="273.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Application running</text><rect x="295" y="315" width="420" height="60" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="505.0" y="352.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">GC work overlaps</text><text x="450" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#183047">Concurrent collectors may still use brief pauses.</text></svg>
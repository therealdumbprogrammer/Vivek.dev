<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">Compilation is a CPU investment</title><desc id="desc">Shared capacity during warm-up; possible savings after optimized code is installed</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#24354b}.bg{fill:#f8fafc}.card{fill:#fff;stroke:#aebed0;stroke-width:2}.blue{fill:#e8f0fc;stroke:#6685b0;stroke-width:2}.teal{fill:#e5f4ef;stroke:#5d9b89;stroke-width:2}.amber{fill:#fff3df;stroke:#bd9654;stroke-width:2}.rose{fill:#f9ecee;stroke:#bc7f89;stroke-width:2}.line{stroke:#657b95;stroke-width:3;fill:none}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52667f}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52667f}@media(prefers-color-scheme:dark){.bg{fill:#182330}.card{fill:#263647;stroke:#61778f}.blue{fill:#243b59;stroke:#87a7db}.teal{fill:#22443d;stroke:#80c3b1}.amber{fill:#4b3d2b;stroke:#dfb976}.rose{fill:#49333e;stroke:#daa1aa}text{fill:#edf3fa}.sub,.small{fill:#c5d3e2}.line{stroke:#abc0d7}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8094aa"/></marker></defs><rect width="1080" height="440" rx="22" class="bg"/><text x="36" y="50" class="title">Compilation is a CPU investment</text><text x="36" y="80" class="sub">Shared capacity during warm-up; possible savings after optimized code is installed</text><rect x="36" y="130" width="300" height="190" rx="15" class="blue"/><text x="54" y="166" class="head">Application now</text><text x="54" y="199" class="body">Requests execute</text><text x="54" y="226" class="body">existing code</text><rect x="390" y="130" width="300" height="190" rx="15" class="amber"/><text x="408" y="166" class="head">Compiler now</text><text x="408" y="199" class="body">CPU spent producing</text><text x="408" y="226" class="body">optimized nmethod</text><rect x="744" y="130" width="300" height="190" rx="15" class="teal"/><text x="762" y="166" class="head">Application later</text><text x="762" y="199" class="body">Optimized calls may</text><text x="762" y="226" class="body">cost less CPU</text><path d="M340 225 L383 225" class="line" marker-end="url(#arrow)"/><path d="M695 225 L738 225" class="line" marker-end="url(#arrow)"/><text x="36" y="414" class="small">Payoff depends on workload and time spent using the optimized method.</text></svg>
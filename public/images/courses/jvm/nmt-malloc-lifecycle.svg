<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">One tracked malloc, from request to free</title><desc id="desc">A tagged HotSpot allocation goes through native malloc, MemTracker and MallocTracker, then is reversed on free.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="640" rx="22"/><text class="title" x="42" y="60">One tracked malloc, from request to free</text><rect class="teal" x="175" y="85" width="730" height="76" rx="14"/><text class="head" x="210" y="115">1  GC request</text><text class="small" x="210" y="142">os::malloc(4096, mtGC)</text><path class="line" d="M540 161 L540 195"/><rect class="box" x="175" y="195" width="730" height="76" rx="14"/><text class="head" x="210" y="225">2  Native block</text><text class="small" x="210" y="252">allocator provides outer block</text><path class="line" d="M540 271 L540 305"/><rect class="gold" x="175" y="305" width="730" height="76" rx="14"/><text class="head" x="210" y="335">3  Tracking</text><text class="small" x="210" y="362">MallocHeader + GC live counters</text><path class="line" d="M540 381 L540 415"/><rect class="box" x="175" y="415" width="730" height="76" rx="14"/><text class="head" x="210" y="445">4  Caller uses payload</text><text class="small" x="210" y="472">inner pointer returned to GC</text><path class="line" d="M540 491 L540 525"/><rect class="teal" x="175" y="525" width="730" height="76" rx="14"/><text class="head" x="210" y="555">5  Free</text><text class="small" x="210" y="582">recover metadata; decrement counters</text><rect class="muted" x="920" y="195" width="105" height="296" rx="14"/><text class="small" x="972" y="244" text-anchor="middle">NMT</text><text class="small" x="972" y="282" text-anchor="middle">live</text><text class="small" x="972" y="320" text-anchor="middle">bytes</text><text class="small" x="972" y="390" text-anchor="middle">↑ then</text><text class="small" x="972" y="425" text-anchor="middle">↓</text></svg>
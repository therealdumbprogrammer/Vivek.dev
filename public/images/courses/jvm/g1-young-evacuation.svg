<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Young evacuation</title><desc id="desc">Live objects are copied from Eden to destinations; successfully evacuated source regions become free.</desc>

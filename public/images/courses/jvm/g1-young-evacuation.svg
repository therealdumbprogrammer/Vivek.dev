ext><text x="698.0" y="316.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">C</text><text x="450" y="402" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="normal" fill="#536779">After successful copying, both Eden source regions are reusable.</text>

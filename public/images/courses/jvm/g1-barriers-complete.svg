<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Two barriers, two jobs</title><desc id="desc">Old reference flows to SATB marking; new relationship flows to remembered information.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">Two barriers, two jobs</text><rect x="345" y="100" width="210" height="85" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="148.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">A.child = C</text><rect x="50" y="265" width="330" height="105" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="215.0" y="311.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Pre-write · old B</text><text x="215.0" y="336.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">SATB buffer → marker</text><rect x="520" y="265" width="330" height="105" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="685.0" y="311.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Post-write · new C</text><text x="685.0" y="336.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">card → remembered set</text><path d="M410 185 L215 260" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="312.5" y="211.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">old</text><path d="M490 185 L685 260" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="587.5" y="211.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">new</text><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">Marking correctness and incoming-reference maintenance cooperate.</text></svg>

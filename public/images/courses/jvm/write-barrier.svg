<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">STORE + GC BOOKKEEPING</title><desc id="desc">The mutator stores a reference and runs lightweight GC logic; this is not a blocking gate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">STORE + GC BOOKKEEPING</text><rect x="24" y="70" width="425" height="50" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="101.0" font-size="17">customer.latestOrder = order</text><path d="M235 124 L235 165" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="175" width="425" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="208.5" font-size="17">1. Store the reference</text><path d="M235 234 L235 275" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="285" width="425" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="318.5" font-size="17">2. Record GC metadata</text><text x="24" y="380" font-size="17">Conceptual post-write barrier path</text><text x="24" y="411" font-size="17">Actual checks vary by collector and JDK.</text></g></svg>
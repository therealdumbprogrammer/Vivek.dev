<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Uncontended fast path</title><desc id="desc">A thread attempts an atomic Mark Word transition. A competing acquisition cannot claim the same neutral state and follows a slow path.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#23364a}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:17px}.tiny{font-size:15px}.muted{fill:#5c6d7a}.card{fill:#fff;stroke:#9caeba;stroke-width:2}.blue{fill:#e7f0f7;stroke:#547fa8;stroke-width:3}.teal{fill:#e7f2ef;stroke:#57998f;stroke-width:3}.clay{fill:#fbede6;stroke:#d48763;stroke-width:3}.gold{fill:#fbf4df;stroke:#c8a34f;stroke-width:3}.arrow{stroke:#547fa8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547fa8"/></marker></defs><rect width="960" height="540" rx="24" fill="#fbfaf7"/><text x="48" y="56" class="title">Uncontended fast path</text><rect x="35" y="185" width="210" height="115" rx="18" class="card"/><text x="125.0" y="242.5" text-anchor="middle" class="label">Read Mark Word</text><path d="M245 243 L280 243" class="arrow"/><rect x="285" y="185" width="190" height="115" rx="18" class="blue"/><text x="380.0" y="234.5" text-anchor="middle" class="label">Neutral?</text><text x="380.0" y="265.5" text-anchor="middle" class="small muted">lock available</text><path d="M475 220 L550 185" class="arrow"/><text x="512.5" y="192.5" text-anchor="middle" class="small muted">yes</text><path d="M475 265 L550 340" class="arrow"/><text x="512.5" y="292.5" text-anchor="middle" class="small muted">no</text><rect x="555" y="130" width="210" height="115" rx="18" class="teal"/><text x="660.0" y="179.5" text-anchor="middle" class="label">Atomic claim</text><text x="660.0" y="210.5" text-anchor="middle" class="small muted">one winner</text><path d="M765 187 L835 187" class="arrow"/><rect x="840" y="130" width="90" height="115" rx="18" class="gold"/><text x="885.0" y="187.5" text-anchor="middle" class="small">Enter</text><rect x="555" y="300" width="315" height="115" rx="18" class="clay"/><text x="712.5" y="349.5" text-anchor="middle" class="label">Slow path</text><text x="712.5" y="380.5" text-anchor="middle" class="small muted">owner / contention / monitor state</text><path d="M660 245 L660 295" class="arrow"/><rect x="105" y="390" width="360" height="90" rx="18" class="card"/><text x="285.0" y="427.0" text-anchor="middle" class="small">Record object in LockStack</text><text x="285.0" y="458.0" text-anchor="middle" class="small muted">supports ownership and unlock bookkeeping</text></svg>
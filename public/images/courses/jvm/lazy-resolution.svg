<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc">
<title id="title">INITIALIZED ≠ ALL RESOLVED</title><desc id="desc">Execution may resolve a needed reference while an unused one remains symbolic.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs>
<rect width="480" height="460" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="20" text-anchor="middle">INITIALIZED ≠ ALL RESOLVED</text><rect x="32" y="72" width="416" height="60" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240.0" y="107.0" font-size="16" text-anchor="middle">Class initialized; references A and B exist</text><path d="M240 133 L240 167" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><rect x="32" y="171" width="416" height="60" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240.0" y="206.0" font-size="16" text-anchor="middle">Execution reaches a use of A</text><path d="M135 232 L126 277" fill="none" stroke="#315dcc" stroke-width="2"  marker-end="url(#a)"/><path d="M345 232 L353 277" fill="none" stroke="#315dcc" stroke-width="2"  stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="24" y="282" width="205" height="110" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="126.5" y="319.0" font-size="16" text-anchor="middle">A is needed</text><text x="126.5" y="342.0" font-size="16" text-anchor="middle">resolve A</text><text x="126.5" y="365.0" font-size="16" text-anchor="middle">then use target</text><rect x="251" y="282" width="205" height="110" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="353.5" y="319.0" font-size="16" text-anchor="middle">B is unused</text><text x="353.5" y="342.0" font-size="16" text-anchor="middle">may remain</text><text x="353.5" y="365.0" font-size="16" text-anchor="middle">symbolic</text><text x="240" y="435" font-size="16" text-anchor="middle">Eager resolution is also permitted.</text></g></svg>
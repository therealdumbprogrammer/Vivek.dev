<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">One identity; two execution models</title><desc id="desc">A platform thread keeps an OS-thread association. A virtual thread mounts on a carrier platform thread backed by an OS thread.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="450" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">One identity; two execution models</text><text x="164" y="88" text-anchor="middle" font-size="21" font-weight="700" fill="#243247">Platform thread</text><text x="476" y="88" text-anchor="middle" font-size="21" font-weight="700" fill="#243247">Virtual thread</text><path d="M320 80 L320 375" fill="none" stroke="#94a0af" stroke-width="2"/><rect x="42" y="115" width="244" height="64" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="164.0" y="154.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Java Thread P</text><path d="M164 179 L164 290" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="208" width="220" height="25" fill="#fffdf9"/><text x="164" y="226" text-anchor="middle" font-size="17" font-weight="400" fill="#243247">lifetime association</text><rect x="42" y="290" width="244" height="64" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="164.0" y="329.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">OS thread</text><rect x="354" y="115" width="244" height="64" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="476.0" y="154.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Java Thread V1</text><path d="M476 179 L476 230" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="193" width="222" height="23" fill="#fffdf9"/><text x="476" y="209" text-anchor="middle" font-size="17" font-weight="400" fill="#243247">mount while running</text><rect x="354" y="230" width="244" height="64" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="476.0" y="269.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Carrier platform thread</text><path d="M476 294 L476 324" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="354" y="324" width="244" height="64" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="476.0" y="363.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">OS thread</text><text x="320" y="423" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">V1 can outlive its association with any one carrier.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">A REFERENCE ENTERS YOUNG</title><desc id="desc">A root reaches an old Customer, which keeps a young Order reachable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">A REFERENCE ENTERS YOUNG</text><rect x="24" y="65" width="180" height="45" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="93.5" font-size="17">GC root</text><path d="M115 113 L115 145" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="155" width="425" height="85" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="203.5" font-size="17">OLD: Customer.latestOrder</text><path d="M235 242 L235 300" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="310" width="425" height="65" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="36" y="348.5" font-size="17">YOUNG: Order</text><text x="24" y="415" font-size="17">Young GC must find the incoming edge.</text></g></svg>
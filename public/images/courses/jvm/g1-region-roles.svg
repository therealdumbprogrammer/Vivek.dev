<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Physical regions, logical roles</title><desc id="desc">Interleaved regions show logical generation roles; a free region can become Eden and return to free.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs>
<rect width="900" height="450" fill="#f8fafc"/>
<text x="450" y="49" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="bold" fill="#183047">Physical regions, logical roles</text>
<text x="450" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="normal" fill="#536779">Address order →</text><rect x="90" y="125" width="88" height="74" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="134.0" y="169.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">E</text><rect x="188" y="125" width="88" height="74" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="232.0" y="169.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">O</text><rect x="286" y="125" width="88" height="74" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="330.0" y="169.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">S</text><rect x="384" y="125" width="88" height="74" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="428.0" y="169.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">O</text><rect x="482" y="125" width="88" height="74" rx="14" fill="#e7edf2" stroke="#91a3b3" stroke-width="2"/><text x="526.0" y="169.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">F</text><rect x="580" y="125" width="88" height="74" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="624.0" y="169.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">E</text><rect x="678" y="125" width="88" height="74" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="722.0" y="169.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">O</text><text x="450" y="250" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">One region over time</text><rect x="104" y="288" width="170" height="76" rx="14" fill="#e7edf2" stroke="#91a3b3" stroke-width="2"/><text x="189.0" y="333.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Free</text><path d="M282 326 L360 326" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="370" y="288" width="170" height="76" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="455.0" y="333.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Eden</text><path d="M548 326 L626 326" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="636" y="288" width="170" height="76" rx="14" fill="#e7edf2" stroke="#91a3b3" stroke-width="2"/><text x="721.0" y="333.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Free again</text><text x="450" y="408" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="normal" fill="#536779">Each role describes current collector use, not a fixed heap address.</text>

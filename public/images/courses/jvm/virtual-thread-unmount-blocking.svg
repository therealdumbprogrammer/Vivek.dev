<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Follow V1 through a supported wait</title><desc id="desc">V1 runs on A, blocks and unmounts while A runs V2, then becomes runnable and resumes on B. Its Java identity persists across the wait.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="480" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">Follow V1 through a supported wait</text><text x="54" y="107" text-anchor="middle" font-size="22" font-weight="700" fill="#243247">1</text><rect x="96" y="72" width="495" height="68" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="343.5" y="100.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">V1 runs on Carrier A</text><text x="343.5" y="126.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Socket read needs data</text><path d="M343 140 L215 180" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><text x="54" y="219" text-anchor="middle" font-size="22" font-weight="700" fill="#243247">2</text><rect x="96" y="182" width="238" height="96" rx="14" fill="#f3f4f6" stroke="#94a0af" stroke-width="2"/><text x="215.0" y="224.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">V1 waits</text><text x="215.0" y="250.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">State preserved</text><rect x="354" y="182" width="237" height="96" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="472.5" y="224.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Carrier A runs V2</text><text x="472.5" y="250.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Execution reused</text><path d="M215 278 L215 333" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><text x="386" y="313" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">I/O ready → runnable</text><text x="54" y="372" text-anchor="middle" font-size="22" font-weight="700" fill="#243247">3</text><rect x="96" y="333" width="495" height="78" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="343.5" y="366.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">V1 resumes on Carrier B</text><text x="343.5" y="392.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Same Java thread; another carrier</text><text x="320" y="455" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">Carrier B is possible, not required.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Humongous allocation needs a run</title><desc id="desc">Three free regions are separated by used regions, so they cannot satisfy a request for three adjacent regions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Humongous allocation needs a run</text><text x="450" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183047">Request: 3 adjacent free regions</text><rect x="65" y="155" width="146" height="120" rx="10" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="138" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">FREE</text><text x="138" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#183047">R1</text><rect x="224" y="155" width="146" height="120" rx="10" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="297" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">USED</text><text x="297" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#183047">R2</text><rect x="383" y="155" width="146" height="120" rx="10" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="456" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">FREE</text><text x="456" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#183047">R3</text><rect x="542" y="155" width="146" height="120" rx="10" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="615" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">USED</text><text x="615" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#183047">R4</text><rect x="701" y="155" width="146" height="120" rx="10" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="774" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">FREE</text><text x="774" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#183047">R5</text><text x="450" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183047">3 free regions in total  ≠  one 3-region run</text><text x="450" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#183047">A free-byte total cannot reveal this adjacency constraint.</text></svg>

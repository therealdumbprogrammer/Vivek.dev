<svg xmlns="http://www.w3.org/2000/svg" width="480" height="475" viewBox="0 0 480 475" role="img" aria-labelledby="title desc"><title id="title">READY TO EXECUTE BYTECODE</title><desc id="desc">Class bytecode and runtime constant-pool information feed an invocation frame. Instructions change its state until a call or completion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="475" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">READY TO EXECUTE BYTECODE</text><rect x="28" y="65" width="424" height="94" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="106.0" font-size="16" text-anchor="middle">Class-file bytecode + runtime pool</text><text x="240.0" y="130.0" font-size="16" text-anchor="middle">operations + symbolic dependencies</text><path d="M240 163 L240 185" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="189" width="424" height="94" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="230.0" font-size="16" text-anchor="middle">Method invocation → JVM frame</text><text x="240.0" y="254.0" font-size="16" text-anchor="middle">indexed locals + operand stack</text><path d="M240 287 L240 309" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="313" width="424" height="94" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="342.0" font-size="16" text-anchor="middle">Execute instructions</text><text x="240.0" y="366.0" font-size="16" text-anchor="middle">call → another logical frame</text><text x="240.0" y="390.0" font-size="16" text-anchor="middle">return → caller resumes</text><text x="240" y="457" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
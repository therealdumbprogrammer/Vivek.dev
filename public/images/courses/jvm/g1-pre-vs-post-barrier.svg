<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Before and after one store</title><desc id="desc">Pre-write captures old B; post-write records the new relationship to C.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">Before and after one store</text><rect x="45" y="155" width="245" height="120" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="167.5" y="196.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Before store</text><text x="167.5" y="221.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">old reference B</text><text x="167.5" y="246.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">SATB marking</text><rect x="330" y="155" width="240" height="120" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="208.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Reference store</text><text x="450.0" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">A.child = C</text><rect x="610" y="155" width="245" height="120" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="732.5" y="196.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">After store</text><text x="732.5" y="221.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">new relationship C</text><text x="732.5" y="246.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">card / remembered set</text><path d="M290 215 L325 215" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="307.5" y="204.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">pre</text><path d="M570 215 L605 215" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="587.5" y="204.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">post</text><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">Old disappearing edge and new incoming edge solve different problems.</text></svg>

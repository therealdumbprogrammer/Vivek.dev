<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">TOTAL FREE ≠ LARGEST HOLE</title><desc id="desc">TOTAL FREE ≠ LARGEST HOLE. Live blocks are blue and named; dead or free blocks have explicit labels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="460" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="36" font-size="20" fill="#334155">TOTAL FREE ≠ LARGEST HOLE</text><text x="30" y="88" font-size="18" fill="#334155">Separated by live objects</text><rect x="30.0" y="110" width="135.0" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="40.0" y="141" font-size="18" fill="#334155">used</text><rect x="170.0" y="110" width="135.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="180.0" y="141" font-size="18" fill="#334155">2 MB free</text><rect x="310.0" y="110" width="135.0" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="320.0" y="141" font-size="18" fill="#334155">used</text><rect x="30.0" y="180" width="135.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="40.0" y="211" font-size="18" fill="#334155">3 MB free</text><rect x="170.0" y="180" width="135.0" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="180.0" y="211" font-size="18" fill="#334155">used</text><rect x="310.0" y="180" width="135.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="320.0" y="211" font-size="18" fill="#334155">4 MB free</text><text x="30" y="268" font-size="18" fill="#334155">Free blocks: 2 + 3 + 4 = 9 MB</text><rect x="30" y="300" width="350" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="40" y="331" font-size="18" fill="#334155">Request: one contiguous 6 MB</text><text x="30" y="389" font-size="18" fill="#334155">Largest hole: 4 MB</text><text x="30" y="425" font-size="18" fill="#334155">No individual hole fits the request.</text></g></svg>
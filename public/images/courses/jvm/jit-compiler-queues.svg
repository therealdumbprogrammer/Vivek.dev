<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">Two compiler work streams</title><desc id="desc">Runtime profiles inform policy; the broker coordinates queued compilation</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#24354b}.bg{fill:#f8fafc}.card{fill:#fff;stroke:#aebed0;stroke-width:2}.blue{fill:#e8f0fc;stroke:#6685b0;stroke-width:2}.teal{fill:#e5f4ef;stroke:#5d9b89;stroke-width:2}.amber{fill:#fff3df;stroke:#bd9654;stroke-width:2}.rose{fill:#f9ecee;stroke:#bc7f89;stroke-width:2}.line{stroke:#657b95;stroke-width:3;fill:none}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52667f}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52667f}@media(prefers-color-scheme:dark){.bg{fill:#182330}.card{fill:#263647;stroke:#61778f}.blue{fill:#243b59;stroke:#87a7db}.teal{fill:#22443d;stroke:#80c3b1}.amber{fill:#4b3d2b;stroke:#dfb976}.rose{fill:#49333e;stroke:#daa1aa}text{fill:#edf3fa}.sub,.small{fill:#c5d3e2}.line{stroke:#abc0d7}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8094aa"/></marker></defs><rect width="1080" height="440" rx="22" class="bg"/><text x="36" y="50" class="title">Two compiler work streams</text><text x="36" y="80" class="sub">Runtime profiles inform policy; the broker coordinates queued compilation</text><rect x="36" y="125" width="215" height="120" rx="15" class="blue"/><text x="54" y="161" class="head">Profiles</text><text x="54" y="194" class="body">Hot methods</text><rect x="292" y="125" width="215" height="120" rx="15" class="card"/><text x="310" y="161" class="head">Policy</text><text x="310" y="194" class="body">Choose level</text><rect x="548" y="125" width="215" height="120" rx="15" class="amber"/><text x="566" y="161" class="head">CompileBroker</text><text x="566" y="194" class="body">Schedule tasks</text><rect x="810" y="115" width="234" height="112" rx="15" class="teal"/><text x="828" y="151" class="head">C1 queue</text><text x="828" y="184" class="body">C1 threads</text><rect x="810" y="245" width="234" height="112" rx="15" class="blue"/><text x="828" y="281" class="head">C2 queue</text><text x="828" y="314" class="body">C2 threads</text><path d="M255 185 L284 185" class="line" marker-end="url(#arrow)"/><path d="M511 185 L540 185" class="line" marker-end="url(#arrow)"/><path d="M766 178 L802 170" class="line" marker-end="url(#arrow)"/><path d="M766 207 L802 292" class="line" marker-end="url(#arrow)"/><text x="36" y="414" class="small">Both compiler streams produce nmethods that require Code Cache space.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Low survival, small copy</title><desc id="desc">Only live young objects are evacuated and source space is reused.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="450" rx="22" fill="#f8fafc"/>
<text x="30" y="51" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">Low survival, small copy</text>
<path d="M380 205 L540 205" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="460" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">copy live</text>
<path d="M210 280 L385 320" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="297.5" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">after evacuation</text>
<rect x="45" y="130" width="335" height="150" rx="13" fill="#e8f1fb" stroke="#8eaecb" stroke-width="2"/>
<text x="212.5" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Young source</text>
<rect x="75" y="190" width="140" height="58" rx="13" fill="#e5f5ef" stroke="#91baa9" stroke-width="2"/>
<text x="145" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">A · B · C live</text>
<rect x="225" y="190" width="135" height="58" rx="13" fill="#edf1f4" stroke="#bac7d0" stroke-width="2"/>
<text x="292.5" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">95 MB dead</text>
<rect x="540" y="130" width="305" height="150" rx="13" fill="#e5f5ef" stroke="#91baa9" stroke-width="2"/>
<text x="692.5" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Destination</text>
<rect x="585" y="190" width="220" height="58" rx="13" fill="#ffffff" stroke="#b7c7d5" stroke-width="2"/>
<text x="695" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">5 MB survivors</text>
<rect x="245" y="320" width="395" height="65" rx="13" fill="#fff2d8" stroke="#d4b67c" stroke-width="2"/>
<text x="442.5" y="358.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Source reusable</text>
<rect x="25" y="398" width="850" height="38" rx="9" fill="#ffffff" stroke="#d5dfe8"/>
<text x="450" y="423" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#52657a">100 MB cohort: 95 MB dead and 5 MB live (illustrative).</text>
</svg>

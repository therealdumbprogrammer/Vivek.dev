<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Evacuate a reachable graph</title><desc id="desc">Trace from incoming roots, then copy only reachable objects.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="520" rx="22" class="bg"/><text x="36" y="51" class="title">Evacuate a reachable graph</text><text x="36" y="81" class="sub">Trace from incoming roots, then copy only reachable objects.</text><rect x="40" y="125" width="480" height="315" rx="18" class="amber"/><text x="60" y="162" class="head">Source Eden E1</text><rect x="560" y="125" width="480" height="315" rx="18" class="mint"/><text x="580" y="162" class="head">Destination regions</text><rect x="75" y="193" width="95" height="75" rx="18" class="card"/><text x="95" y="230" class="head">A</text><rect x="205" y="193" width="95" height="75" rx="18" class="card"/><text x="225" y="230" class="head">C</text><rect x="335" y="193" width="95" height="75" rx="18" class="rose"/><text x="355" y="230" class="head">B</text><rect x="75" y="320" width="95" height="75" rx="18" class="card"/><text x="95" y="357" class="head">D</text><rect x="615" y="193" width="95" height="75" rx="18" class="card"/><text x="635" y="230" class="head">A′</text><rect x="760" y="193" width="95" height="75" rx="18" class="card"/><text x="780" y="230" class="head">C′</text><rect x="615" y="320" width="95" height="75" rx="18" class="card"/><text x="635" y="357" class="head">D′</text><path d="M175 228 L199 228" class="line" marker-end="url(#arrow)"/><path d="M715 228 L754 228" class="line" marker-end="url(#arrow)"/><path d="M525 280 L554 280" class="line" marker-end="url(#arrow)"/><text x="73" y="180" class="small">root → A</text><text x="73" y="307" class="small">Old → D</text><text x="335" y="300" class="small">no root reaches B</text><text x="762" y="304" class="small">Survivor / Old</text><text x="36" y="485" class="small">Forwarding sends each relevant reference to its copy; B stays behind.</text></svg>
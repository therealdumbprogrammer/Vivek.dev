<svg xmlns="http://www.w3.org/2000/svg" width="480" height="455" viewBox="0 0 480 455" role="img" aria-labelledby="title desc"><title id="title">MANY VIRTUAL THREADS, FEW CARRIERS</title><desc id="desc">Virtual threads take turns mounted on carriers. TLAB state stays with the underlying execution thread.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="455" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">MANY VIRTUAL THREADS, FEW CARRIERS</text><rect x="24" y="73" width="432" height="60" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="109.0" font-size="16">Virtual threads A, B, C, D, E, …</text><text x="24" y="163" font-size="15">Scheduled over time; one mounted per carrier</text><path d="M140 180 L140 210" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M348 180 L348 210" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="220" width="205" height="65" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="258.5" font-size="16">Carrier 1</text><rect x="251" y="220" width="205" height="65" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="263" y="258.5" font-size="16">Carrier 2</text><path d="M125 290 L125 326" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M353 290 L353 326" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="335" width="205" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="368.5" font-size="16">Current TLAB 1</text><rect x="251" y="335" width="205" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="263" y="368.5" font-size="16">Current TLAB 2</text><text x="24" y="422" font-size="16">A later mount may use another carrier.</text><text x="24" y="445" font-size="15">The virtual thread does not take a TLAB with it.</text></g></svg>
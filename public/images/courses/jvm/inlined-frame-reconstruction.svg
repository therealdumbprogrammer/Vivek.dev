<svg xmlns="http://www.w3.org/2000/svg" width="480" height="476" viewBox="0 0 480 476" role="img" aria-labelledby="title desc"><title id="title">ONE PHYSICAL FRAME, SEVERAL CALLS</title><desc id="desc">One compiled frame for A; Contains inlined B and C. Scope metadata records logical callers; And each suspended program position. Reconstructed frames: A → B → C; Each has locals and operand state</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="476" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="16" text-anchor="middle">ONE PHYSICAL FRAME, SEVERAL CALLS</text><rect x="22" y="60" width="436" height="104" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="100" font-size="16" text-anchor="middle">One compiled frame for A</text><text x="240" y="124" font-size="16" text-anchor="middle">Contains inlined B and C</text><path d="M240 167 V188" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="192" width="436" height="104" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="232" font-size="16" text-anchor="middle">Scope metadata records logical callers</text><text x="240" y="256" font-size="16" text-anchor="middle">And each suspended program position</text><path d="M240 299 V320" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="324" width="436" height="104" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="364" font-size="16" text-anchor="middle">Reconstructed frames: A → B → C</text><text x="240" y="388" font-size="16" text-anchor="middle">Each has locals and operand state</text><text x="240" y="461" font-size="13" text-anchor="middle">Conceptual HotSpot model · not to scale</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Read the summary line</title><desc id="desc">Labels identify event ID, type, whole heap before and after, current capacity, and pause time.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Read the summary line</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687c8c"/></marker></defs><rect x="45" y="100" width="118" height="95" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="104.0" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">GC(36)</text><rect x="178" y="100" width="150" height="95" rx="13" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="253.0" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#183047">Pause Young</text><rect x="343" y="100" width="108" height="95" rx="13" fill="#fff0d2" stroke="#687c8c" stroke-width="2"/><text x="397.0" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">391M</text><rect x="466" y="100" width="108" height="95" rx="13" fill="#fff0d2" stroke="#687c8c" stroke-width="2"/><text x="520.0" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">114M</text><rect x="589" y="100" width="108" height="95" rx="13" fill="#e5e3f5" stroke="#687c8c" stroke-width="2"/><text x="643.0" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#183047">(508M)</text><rect x="712" y="100" width="143" height="95" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="783.5" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#183047">13.075ms</text><path d="M104 195 L104 269" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="104" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">Event ID</text><path d="M253 195 L253 269" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="253" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">Type</text><path d="M397 195 L397 269" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="397" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">Heap before</text><path d="M520 195 L520 269" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="520" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">Heap after</text><path d="M643 195 L643 269" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="643" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">Capacity</text><path d="M783 195 L783 269" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="783" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#183047">Pause time</text><rect x="170" y="352" width="560" height="54" rx="13" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="450.0" y="386.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">391M → 114M (508M) = whole-heap usage, capacity</text></svg>
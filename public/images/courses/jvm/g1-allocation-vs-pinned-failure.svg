<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">Two reasons evacuation can fail</title><desc id="desc">Allocation and pinning both prevent movement but point to different investigations.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#72859b"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#25344a}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line{stroke:#a9b9cd}}</style><rect width="1080" height="470" rx="22" class="bg"/><text x="36" y="51" class="title">Two reasons evacuation can fail</text><rect x="40" y="125" width="470" height="300" rx="14" class="rose"/><text x="65" y="165" class="head">Allocation failure</text><text x="65" y="213" class="body">No suitable destination space</text><path d="M260 230 L260 278" class="line" marker-end="url(#arrow)"/><text x="65" y="314" class="body">Inspect free regions, survival,</text><text x="65" y="344" class="body">promotion and marking timing.</text><rect x="570" y="125" width="470" height="300" rx="14" class="amber"/><text x="595" y="165" class="head">Pinned failure</text><text x="595" y="213" class="body">Object must stay at its address</text><path d="M790 230 L790 278" class="line" marker-end="url(#arrow)"/><text x="595" y="314" class="body">Inspect JNI critical access</text><text x="595" y="344" class="body">and its duration and release.</text><text x="40" y="456" class="small">A GC event can report both reasons. Neither alone proves immediate Full GC.</text></svg>
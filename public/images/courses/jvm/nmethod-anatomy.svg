<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">AN NMETHOD IS CODE PLUS RUNTIME MAPS</title><desc id="desc">A compiled method artifact contains entry points and machine instructions together with relocation data, object-reference maps, stack and scope metadata, safepoint information, deoptimization data, handlers, and dependencies.</desc><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="15" text-anchor="middle">AN NMETHOD IS CODE PLUS RUNTIME MAPS</text><rect x="24" y="58" width="432" height="390" rx="16" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="91" font-size="18" text-anchor="middle">HotSpot nmethod</text><rect x="42" y="112" width="396" height="92" rx="12" fill="#dce7ff" stroke="#315dcc"/><text x="62" y="143" font-size="16">Executable portion</text><text x="62" y="169" font-size="14">entry points · machine instructions · stubs · handlers</text><rect x="42" y="220" width="188" height="94" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="58" y="249" font-size="15">References and movement</text><text x="58" y="274" font-size="13">relocation data</text><text x="58" y="296" font-size="13">object / metadata tables</text><rect x="250" y="220" width="188" height="94" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="266" y="249" font-size="15">Java-state maps</text><text x="266" y="274" font-size="13">inlined scopes · stack maps</text><text x="266" y="296" font-size="13">deoptimization information</text><rect x="42" y="330" width="188" height="94" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="58" y="359" font-size="15">Runtime coordination</text><text x="58" y="384" font-size="13">safepoint / poll locations</text><text x="58" y="406" font-size="13">GC-visible references</text><rect x="250" y="330" width="188" height="94" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="266" y="359" font-size="15">Lifecycle support</text><text x="266" y="384" font-size="13">dependencies · state</text><text x="266" y="406" font-size="13">exception/runtime metadata</text><text x="240" y="478" font-size="13" text-anchor="middle">Conceptual grouping · exact layout is an implementation detail</text></g></svg>

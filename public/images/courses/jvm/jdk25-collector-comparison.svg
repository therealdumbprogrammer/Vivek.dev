<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">JDK 25 collector cost profiles</title><desc id="desc">Serial favors small simple work, Parallel throughput, G1 balanced pause goals, and ZGC very low latency.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">JDK 25 collector cost profiles</text><rect x="42" y="110" width="190" height="195" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="137.0" y="186.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Serial</text><text x="137.0" y="214.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">small work</text><text x="137.0" y="242.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">low coordination</text><rect x="250" y="110" width="190" height="195" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="345.0" y="186.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Parallel</text><text x="345.0" y="214.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">throughput</text><text x="345.0" y="242.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">multiple workers</text><rect x="458" y="110" width="190" height="195" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="553.0" y="186.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">G1</text><text x="553.0" y="214.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">pause goals</text><text x="553.0" y="242.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">high throughput</text><rect x="666" y="110" width="190" height="195" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="761.0" y="186.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">ZGC</text><text x="761.0" y="214.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">very low</text><text x="761.0" y="242.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">pause latency</text><text x="450" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">Selection depends on the workload and available resources.</text></svg>
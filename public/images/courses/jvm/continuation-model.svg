<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" role="img" aria-labelledby="title desc"><title id="title">Resume the computation</title><desc id="desc">VirtualThread holds Java-level identity and scheduling state. Continuation machinery preserves a resumable computation and its stack state across suspension.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="478" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">Resume the computation</text><rect x="125" y="83" width="390" height="79" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="116.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">VirtualThread V1</text><text x="320.0" y="142.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Identity + scheduling state</text><path d="M320 162 L320 207" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="125" y="207" width="390" height="79" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="240.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Continuation machinery</text><text x="320.0" y="266.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Suspend and resume Java execution</text><path d="M320 286 L320 329" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="125" y="329" width="390" height="79" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="362.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Preserved stack state</text><text x="320.0" y="388.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Frames, values, return locations</text><text x="320" y="451" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">Applications use Thread and blocking APIs.</text></g></svg>
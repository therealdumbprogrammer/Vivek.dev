<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Handshake scalability motivation</title><desc id="desc">A global request coordinates five hundred threads, while a targeted handshake coordinates Thread 217 and leaves 499 threads outside the boundary.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="28" fill="#fffdf9"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="250" y="58" font-size="25" font-weight="700" fill="#172033">Global coordination</text><text x="710" y="58" font-size="25" font-weight="700" fill="#172033">Targeted coordination</text><path d="M480 85V535" stroke="#d6d3d1" stroke-width="3" stroke-dasharray="9 10"/><rect x="70" y="115" width="360" height="105" rx="20" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="250" y="158" font-size="24" font-weight="700" fill="#243c65">500 application threads</text><text x="250" y="192" font-size="18" fill="#475569">all enter coordination boundary</text><g fill="#fff3d6" stroke="#bd7a28" stroke-width="2"><circle cx="105" cy="300" r="23"/><circle cx="175" cy="275" r="23"/><circle cx="245" cy="315" r="23"/><circle cx="315" cy="275" r="23"/><circle cx="385" cy="310" r="23"/></g><text x="245" y="375" font-size="18" fill="#7a4614">… hundreds more …</text><rect x="100" y="430" width="300" height="78" rx="18" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="250" y="462" font-size="20" font-weight="700" fill="#4d3475">Wait for required set</text><text x="250" y="490" font-size="17" fill="#4d3475">then run global work</text><rect x="555" y="115" width="310" height="105" rx="20" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="710" y="158" font-size="24" font-weight="700" fill="#185b42">Thread 217</text><text x="710" y="192" font-size="18" fill="#244c3d">one selected target</text><rect x="555" y="290" width="310" height="90" rx="18" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="710" y="327" font-size="20" font-weight="700" fill="#7a4614">Safe state + callback</text><text x="710" y="355" font-size="17" fill="#54391d">499 threads stay outside</text><rect x="555" y="450" width="310" height="58" rx="16" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="710" y="486" font-size="18" font-weight="700" fill="#243c65">Target continues</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M250 220V252"/><path d="M250 390V430"/><path d="M710 220V290"/><path d="M710 380V450"/></g></svg>

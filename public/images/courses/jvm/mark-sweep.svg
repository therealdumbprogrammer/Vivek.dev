<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Mark, then sweep</title><desc id="desc">Survivors remain in place and unmarked positions become separated holes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="430" rx="22" fill="#f8fafc"/>
<text x="30" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">Mark, then sweep</text>
<text x="42" y="104" text-anchor="start" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Before marking</text><rect x="40" y="120" width="150" height="68" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="115.0" y="161.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">A live</text><rect x="203" y="120" width="150" height="68" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="278.0" y="161.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">B live</text><rect x="366" y="120" width="150" height="68" rx="14" fill="#eef1f5" stroke="#9aafc2" stroke-width="2"/><text x="441.0" y="161.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">X dead</text><rect x="529" y="120" width="150" height="68" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="604.0" y="161.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">C live</text><rect x="692" y="120" width="150" height="68" rx="14" fill="#eef1f5" stroke="#9aafc2" stroke-width="2"/><text x="767.0" y="161.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">Y dead</text><text x="42" y="240" text-anchor="start" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">After sweeping</text><rect x="40" y="255" width="150" height="68" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="115.0" y="296.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">A live</text><rect x="203" y="255" width="150" height="68" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="278.0" y="296.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">B live</text><rect x="366" y="255" width="150" height="68" rx="14" fill="#fff2d8" stroke="#9aafc2" stroke-width="2"/><text x="441.0" y="296.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">free hole</text><rect x="529" y="255" width="150" height="68" rx="14" fill="#e5f5ef" stroke="#9aafc2" stroke-width="2"/><text x="604.0" y="296.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">C live</text><rect x="692" y="255" width="150" height="68" rx="14" fill="#fff2d8" stroke="#9aafc2" stroke-width="2"/><text x="767.0" y="296.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#19324d">free hole</text>
<rect x="25" y="357" width="850" height="48" rx="10" fill="white" stroke="#d5dfe8"/>
<text x="450" y="387" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="500" fill="#52657a">Free bytes may be fragmented across holes.</text>

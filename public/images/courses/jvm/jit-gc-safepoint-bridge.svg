<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">JIT to GC safepoint bridge</title><desc id="desc">The JIT emits code and maps, which HotSpot combines at a safe state to expose roots to GC.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Compiler output becomes runtime evidence</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="55" y="210" width="190" height="110" rx="20" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="150" y="254" font-size="22" font-weight="700" fill="#172033">JIT compiler</text><text x="150" y="286" font-size="17" fill="#475569">C1 / C2</text><rect x="330" y="105" width="245" height="110" rx="20" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="452" y="150" font-size="20" font-weight="700" fill="#7a4614">machine code</text><text x="452" y="181" font-size="17" fill="#54391d">executes on CPU</text><rect x="330" y="335" width="245" height="110" rx="20" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="452" y="380" font-size="20" font-weight="700" fill="#185b42">reference maps</text><text x="452" y="411" font-size="17" fill="#244c3d">describe machine state</text><rect x="665" y="210" width="240" height="110" rx="20" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="785" y="250" font-size="20" font-weight="700" fill="#4d3475">safe machine state</text><text x="785" y="282" font-size="17" fill="#4d3475">HotSpot walks frames</text><rect x="665" y="420" width="240" height="90" rx="20" fill="#fff" stroke="#4f6f9f" stroke-width="3"/><text x="785" y="457" font-size="20" font-weight="700" fill="#172033">GC thread roots</text><text x="785" y="485" font-size="17" fill="#475569">start heap traversal</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M245 245C285 245 285 160 330 160"/><path d="M245 285C285 285 285 390 330 390"/><path d="M575 160C625 160 625 235 665 235"/><path d="M575 390C625 390 625 295 665 295"/><path d="M785 320V420"/></g>
</svg>

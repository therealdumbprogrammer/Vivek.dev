<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">COPY LIVE DATA · REUSE SOURCE</title><desc id="desc">COPY LIVE DATA · REUSE SOURCE. Live blocks are blue and named; dead or free blocks have explicit labels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="560" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="36" font-size="20" fill="#334155">COPY LIVE DATA · REUSE SOURCE</text><text x="30" y="85" font-size="18" fill="#334155">1 · From-space</text><rect x="30.0" y="103" width="100.0" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="40.0" y="134" font-size="18" fill="#334155">A</text><rect x="135.0" y="103" width="100.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="145.0" y="134" font-size="18" fill="#334155">dead</text><rect x="240.0" y="103" width="100.0" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="250.0" y="134" font-size="18" fill="#334155">B</text><rect x="345.0" y="103" width="100.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="355.0" y="134" font-size="18" fill="#334155">dead</text><text x="30" y="209" font-size="18" fill="#334155">2 · Copy A and B to to-space</text><rect x="30.0" y="230" width="100.0" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="40.0" y="261" font-size="18" fill="#334155">A</text><rect x="135.0" y="230" width="100.0" height="48" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="145.0" y="261" font-size="18" fill="#334155">B</text><rect x="240.0" y="230.0" width="205.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="250.0" y="261.0" font-size="18" fill="#334155">free</text><text x="30" y="335" font-size="18" fill="#334155">3 · References now resolve to copies</text><text x="30" y="371" font-size="18" fill="#334155">From-space is reusable</text><rect x="30.0" y="394" width="100.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="40.0" y="425" font-size="18" fill="#334155">reuse</text><rect x="135.0" y="394" width="100.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="145.0" y="425" font-size="18" fill="#334155">reuse</text><rect x="240.0" y="394" width="100.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="250.0" y="425" font-size="18" fill="#334155">reuse</text><rect x="345.0" y="394" width="100.0" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="355.0" y="425" font-size="18" fill="#334155">reuse</text><text x="30" y="485" font-size="17" fill="#334155">To-space needs room for survivors.</text><text x="30" y="521" font-size="17" fill="#334155">No individual freeing of dead objects.</text></g></svg>
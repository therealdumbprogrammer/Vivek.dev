<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Four observation boundaries</title><desc id="desc">Heap, NMT, process and cgroup reports answer different questions.</desc><rect class="bg" width="1080" height="510" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.accent{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.bar{fill:#91bdb5}.line{stroke:#647b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.accent{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.bar{fill:#6aa79c}text{fill:#edf2fa}.line,.plain{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b91" stroke-width="1.8"/></marker></defs><text class="title" x="42" y="58">Four observation boundaries</text><rect class="accent" x="50" y="135" width="225" height="260" rx="15"/><text class="label" x="69" y="171">1  Java heap</text><text class="body" x="69" y="200">used + committed</text><text class="body" x="69" y="229">live set vs Xmx</text><rect class="box" x="301" y="135" width="225" height="260" rx="15"/><text class="label" x="320" y="171">2  HotSpot NMT</text><text class="body" x="320" y="200">reserved + committed</text><text class="body" x="320" y="229">tracked categories</text><rect class="gold" x="552" y="135" width="225" height="260" rx="15"/><text class="label" x="571" y="171">3  Process</text><text class="body" x="571" y="200">VmSize + RSS</text><text class="body" x="571" y="229">smaps mappings</text><rect class="rose" x="803" y="135" width="225" height="260" rx="15"/><text class="label" x="822" y="171">4  Cgroup</text><text class="body" x="822" y="200">memory.current</text><text class="body" x="822" y="229">limit + events</text><path class="line" d="M275 265 L294 265"/><path class="line" d="M526 265 L545 265"/><path class="line" d="M777 265 L796 265"/><text class="note" x="54" y="458">Align timestamps; no layer is a complete ledger for every other layer.</text></svg>
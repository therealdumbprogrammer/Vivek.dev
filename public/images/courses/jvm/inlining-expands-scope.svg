<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">SEE ACROSS CALL BOUNDARIES</title><desc id="desc">Inlining includes callee operations in the caller compilation scope, exposing opportunities for constant folding and allocation elimination.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="480" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">SEE ACROSS CALL BOUNDARIES</text><rect x="25" y="65" width="430" height="90" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="104.0" font-size="16" text-anchor="middle">Before inlining: total(order)</text><text x="240.0" y="128.0" font-size="16" text-anchor="middle">calls price() and tax()</text><path d="M240 157 L240 185" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="190" width="430" height="190" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="255.0" font-size="16" text-anchor="middle">After inlining: one compilation scope</text><text x="240.0" y="279.0" font-size="16" text-anchor="middle">price implementation</text><text x="240.0" y="303.0" font-size="16" text-anchor="middle">+ tax implementation</text><text x="240.0" y="327.0" font-size="16" text-anchor="middle">Constants and object uses visible together</text><text x="240" y="419" font-size="15" text-anchor="middle">More visible evidence → more opportunities</text><text x="240" y="458" font-size="13" text-anchor="middle">Conceptual HotSpot model · not to scale</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">Waiting keeps thread resources</title><desc id="desc">A request blocks in a socket read. Its platform thread retains its OS thread, native stack resources, and OS bookkeeping while not using a CPU.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="450" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">Waiting keeps thread resources</text><rect x="160" y="78" width="320" height="66" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="118.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Request → platform thread</text><path d="M320 144 L320 179" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="179" width="320" height="70" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="208.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Socket read waits</text><text x="320.0" y="234.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">No continuous CPU use</text><path d="M320 249 V274 H170 V291 M320 274 H470 V291" fill="none" stroke="#6283ad" stroke-width="3"/><rect x="40" y="293" width="260" height="84" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="170.0" y="329.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">OS thread retained</text><text x="170.0" y="355.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Scheduling state</text><rect x="340" y="293" width="260" height="84" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="470.0" y="329.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Native stack resources</text><text x="470.0" y="355.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Reservation ≠ residency</text><path d="M320 274 L170 274" fill="none" stroke="#94a0af" stroke-width="2"/><path d="M170 274 L170 293" fill="none" stroke="#94a0af" stroke-width="2"/><path d="M320 274 L470 274" fill="none" stroke="#94a0af" stroke-width="2"/><path d="M470 274 L470 293" fill="none" stroke="#94a0af" stroke-width="2"/><text x="320" y="421" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">Waiting is idle CPU time, but not zero resource cost.</text></g></svg>
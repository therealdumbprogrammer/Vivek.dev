<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Begin marking with headroom</title><desc id="desc">Adaptive IHOP estimates when Old pressure needs a new cycle.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="460" rx="22" class="bg"/><text x="36" y="51" class="title">Begin marking with headroom</text><text x="36" y="81" class="sub">Adaptive IHOP estimates when Old pressure needs a new cycle.</text><rect x="36" y="155" width="235" height="180" rx="18" class="amber"/><text x="56" y="192" class="head">Old occupancy</text><text x="56" y="229" class="body">promotion rises</text><text x="56" y="257" class="body">headroom shrinks</text><rect x="294" y="155" width="235" height="180" rx="18" class="blue"/><text x="314" y="192" class="head">Adaptive IHOP</text><text x="314" y="229" class="body">predict cycle time</text><text x="314" y="257" class="body">schedule start</text><rect x="552" y="155" width="235" height="180" rx="18" class="mint"/><text x="572" y="192" class="head">Marking cycle</text><text x="572" y="229" class="body">mark while mutators run</text><text x="572" y="257" class="body">Remark + Cleanup</text><rect x="810" y="155" width="235" height="180" rx="18" class="blue"/><text x="830" y="192" class="head">Mixed pauses</text><text x="830" y="229" class="body">reclaim candidates</text><text x="830" y="257" class="body">restore headroom</text><path d="M274 245 L289 245" class="line" marker-end="url(#arrow)"/><path d="M532 245 L547 245" class="line" marker-end="url(#arrow)"/><path d="M790 245 L805 245" class="line" marker-end="url(#arrow)"/><text x="36" y="393" class="small">An earlier start is useful only if the cycle and mixed recovery can keep up.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">A carrier serves different tasks</title><desc id="desc">At an earlier time V1 runs on Carrier A. Later V1 is unmounted and V2 runs on the same Carrier A.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="450" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">A carrier serves different tasks</text><text x="165" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#243247">Earlier</text><text x="475" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#243247">Later</text><rect x="45" y="125" width="240" height="70" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="165.0" y="167.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">V1 running</text><rect x="355" y="125" width="240" height="70" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="475.0" y="167.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">V2 running</text><path d="M165 195 L165 265" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M475 195 L475 265" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="265" width="240" height="85" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="165.0" y="301.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Carrier A</text><text x="165.0" y="327.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">OS thread A</text><rect x="355" y="265" width="240" height="85" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="475.0" y="301.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Carrier A</text><text x="475.0" y="327.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">OS thread A</text><path d="M292 307 L348 307" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="396" text-anchor="middle" font-size="19" font-weight="400" fill="#243247">Same carrier, different virtual-thread identity.</text><text x="320" y="426" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">V1 is unmounted before V2 uses A.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Concurrency still needs headroom</title><desc id="desc">Live objects, new allocations, and relocation working space must fit while concurrent collection runs. SoftMaxHeapSize is preferred and Xmx is hard.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Concurrency still needs headroom</text><rect x="55" y="146" width="220" height="120" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="165.0" y="199.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Live set</text><text x="165.0" y="225.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">objects still needed</text><rect x="275" y="146" width="220" height="120" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="385.0" y="199.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">New allocation</text><text x="385.0" y="225.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">while GC runs</text><rect x="495" y="146" width="220" height="120" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="605.0" y="199.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Collector space</text><text x="605.0" y="225.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">relocated copies</text><text x="450" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">SoftMaxHeapSize: preferred ceiling; ZGC may grow beyond it</text><text x="450" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">-Xmx: hard maximum heap size</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">Free capacity helps collection keep up with allocation.</text></svg>
<text class="heading" x="44" y="55">C2 delegates access rules to the collector</text><rect class="box" x="40" y="105" width="265" height="195" rx="16"/><text class="label" x="60" y="141">C2 memory IR</text><text class="body" x="60" y="177">loads, stores, atomics</text><path class="line" d="M305 200 L365 200"/><rect class="accent" x="370" y="105" width="285" height="195" rx="16"/><text class="label" x="390" y="141">BarrierSetC2</text><text class="body" x="390" y="177">shared access hooks</text><path class="line" d="M655 165 L715 155"/><path class="line" d="M655 245 L715 345"/><rect class="box" x="720" y="85" width="325" height="135" rx="16"/><text class="label" x="740" y="121">G1BarrierSetC2</text><text class="body" x="740" y="157">SATB / card bookkeeping</text><rect class="box" x="720" y="280" width="325" height="135" rx="16"/><text class="label" x="740" y="316">ZBarrierSetC2</text><text class="body" x="740" y="352">load / store protocols</text><text class="body" x="350" y="385">Optimization and lowering produce collector-specific machine code</text></svg>
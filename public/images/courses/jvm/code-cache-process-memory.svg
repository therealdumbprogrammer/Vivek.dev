<svg xmlns="http://www.w3.org/2000/svg" width="480" height="458" viewBox="0 0 480 458" role="img" aria-labelledby="title desc"><title id="title">THE CODE CACHE IS OUTSIDE THE JAVA HEAP</title><desc id="desc">The JVM process contains the Java heap plus separate native areas including Metaspace, thread stacks, the Code Cache, and runtime structures. Xmx limits only the Java heap.</desc><rect width="480" height="458" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="15" text-anchor="middle">THE CODE CACHE IS OUTSIDE THE JAVA HEAP</text><rect x="20" y="58" width="440" height="348" rx="16" fill="none" stroke="#9aa8bb" stroke-width="1.5"/><text x="40" y="86" font-size="14">JVM process memory</text><rect x="38" y="104" width="188" height="126" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="132" y="139" font-size="17" text-anchor="middle">Java heap</text><text x="132" y="167" font-size="14" text-anchor="middle">Java objects</text><text x="132" y="195" font-size="14" text-anchor="middle">limited by -Xmx</text><rect x="250" y="104" width="192" height="126" rx="12" fill="#dce7ff" stroke="#315dcc" stroke-width="1.5"/><text x="346" y="139" font-size="17" text-anchor="middle">Code Cache</text><text x="346" y="167" font-size="14" text-anchor="middle">generated native code</text><text x="346" y="195" font-size="14" text-anchor="middle">separate from -Xmx</text><rect x="38" y="252" width="124" height="112" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="100" y="290" font-size="15" text-anchor="middle">Metaspace</text><text x="100" y="318" font-size="13" text-anchor="middle">class metadata</text><rect x="178" y="252" width="124" height="112" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="290" font-size="15" text-anchor="middle">Thread stacks</text><text x="240" y="318" font-size="13" text-anchor="middle">native memory</text><rect x="318" y="252" width="124" height="112" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="380" y="282" font-size="15" text-anchor="middle">GC / compiler</text><text x="380" y="306" font-size="13" text-anchor="middle">and other</text><text x="380" y="328" font-size="13" text-anchor="middle">native structures</text><text x="240" y="438" font-size="13" text-anchor="middle">Reserved, committed, and resident memory remain distinct measures</text></g></svg>

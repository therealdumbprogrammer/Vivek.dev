<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">SPEND WHERE WORK CAN REPAY IT</title><desc id="desc">An illustrative startup touches many methods, but only a smaller hot group has enough future execution to repay expensive compilation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">SPEND WHERE WORK CAN REPAY IT</text><rect x="25" y="65" width="430" height="80" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="99.0" font-size="16" text-anchor="middle">Startup touches 50,000 methods</text><text x="240.0" y="123.0" font-size="16" text-anchor="middle">Illustrative workload</text><path d="M240 147 L130 185" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 147 L350 185" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="190" width="205" height="150" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="127.5" y="247.0" font-size="16" text-anchor="middle">Most are brief</text><text x="127.5" y="271.0" font-size="16" text-anchor="middle">Little future work</text><text x="127.5" y="295.0" font-size="16" text-anchor="middle">to repay C2</text><rect x="250" y="190" width="205" height="150" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="352.5" y="247.0" font-size="16" text-anchor="middle">500 stay hot</text><text x="352.5" y="271.0" font-size="16" text-anchor="middle">Repeated execution</text><text x="352.5" y="295.0" font-size="16" text-anchor="middle">may repay C2</text><rect x="25" y="372" width="430" height="55" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="405.5" font-size="16" text-anchor="middle">Policy shares limited compiler resources</text><text x="240" y="478" font-size="13" text-anchor="middle">Counts illustrate the trade-off · not measurements</text></g></svg>

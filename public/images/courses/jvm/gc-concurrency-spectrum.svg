<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Where GC work lands in time</title><desc id="desc">Serial and Parallel mainly pause application threads, G1 overlaps marking, and ZGC overlaps marking and relocation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Where GC work lands in time</text><rect x="35" y="120" width="200" height="180" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="135.0" y="189.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Serial</text><text x="135.0" y="217.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">one worker</text><text x="135.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">STW</text><rect x="245" y="120" width="200" height="180" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="345.0" y="189.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Parallel</text><text x="345.0" y="217.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">many workers</text><text x="345.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">STW</text><rect x="455" y="120" width="200" height="180" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="555.0" y="189.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">G1</text><text x="555.0" y="217.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">mark overlaps</text><text x="555.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">evacuation STW</text><rect x="665" y="120" width="200" height="180" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="765.0" y="189.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">ZGC</text><text x="765.0" y="217.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">mark + relocate</text><text x="765.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">overlap app</text><text x="450" y="383" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">All collectors spend CPU and memory; overlap changes timing.</text></svg>
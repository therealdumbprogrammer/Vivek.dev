<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">Two jobs around one G1 reference store</title><desc id="desc">Conditional SATB pre-write records an overwritten reference; post-write tracks relevant cards.</desc>
<rect class="bg" width="1080" height="450" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#243247}.bg{fill:#f7f9fc}.heading{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.box{fill:#fff;stroke:#bdcad9;stroke-width:2}.accent{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.warn{fill:#fff1db;stroke:#b68a46;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#789;stroke-width:2;stroke-dasharray:8 6}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#52667e}.accent{fill:#213f3d;stroke:#73b1a7}.warn{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.line{stroke:#a9b9cd}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#526477" stroke-width="1.7"/></marker></defs>
<text class="heading" x="44" y="55">Two jobs around one G1 reference store</text><rect class="warn" x="35" y="145" width="310" height="180" rx="16"/><text class="label" x="55" y="181">Before store</text><text class="body" x="55" y="217">oldOrder non-null?</text><text class="body" x="55" y="244">marking active?</text><text class="body" x="55" y="271">record for SATB if needed</text><path class="line" d="M345 235 L390 235"/><rect class="accent" x="395" y="145" width="290" height="180" rx="16"/><text class="label" x="415" y="181">Java store</text><text class="body" x="415" y="217">latestOrder = newOrder</text><path class="line" d="M685 235 L730 235"/><rect class="box" x="735" y="145" width="310" height="180" rx="16"/><text class="label" x="755" y="181">After store</text><text class="body" x="755" y="217">relevant cross-region edge?</text><text class="body" x="755" y="244">dirty card if needed</text><text class="body" x="65" y="385">Marking snapshot</text><text class="body" x="805" y="385">Remembered information</text></svg>
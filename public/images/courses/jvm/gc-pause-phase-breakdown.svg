<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Break down the pause</title><desc id="desc">G1 pause phases show evacuation as the largest part, with two subphase explanations to compare.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Break down the pause</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687c8c"/></marker></defs><rect x="45" y="122" width="100" height="105" rx="13" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="95.0" y="181.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">Pre Evacuate</text><rect x="145" y="122" width="150" height="105" rx="13" fill="#e5e3f5" stroke="#687c8c" stroke-width="2"/><text x="220.0" y="181.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">Merge Heap Roots</text><rect x="295" y="122" width="430" height="105" rx="13" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="510.0" y="181.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#183047">Evacuate Collection Set</text><rect x="725" y="122" width="120" height="105" rx="13" fill="#fff0d2" stroke="#687c8c" stroke-width="2"/><text x="785.0" y="181.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#183047">Post Evacuate</text><rect x="140" y="278" width="245" height="72" rx="13" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="262.5" y="321.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#183047">Object Copy dominates</text><rect x="515" y="278" width="245" height="72" rx="13" fill="#e5e3f5" stroke="#687c8c" stroke-width="2"/><text x="637.5" y="321.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#183047">Root scan dominates</text><path d="M590 227 L590 278" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Allocation and accounting are different paths</title><desc id="desc">HotSpot initiates a request, NMT records it, and native allocation supplies memory; freeing can lower NMT while RSS remains.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><rect class="bg" width="1080" height="520" rx="22"/><text class="title" x="42" y="60">Allocation and accounting are different paths</text><rect class="teal" x="355" y="105" width="370" height="70" rx="14"/><text class="head" x="540" y="149" text-anchor="middle">HotSpot requests memory</text><path class="line" d="M540 175 L540 220"/><path class="line" d="M235 220 L845 220"/><path class="line" d="M235 220 L235 255"/><path class="line" d="M845 220 L845 255"/><rect class="gold" x="65" y="255" width="340" height="110" rx="14"/><text class="head" x="235" y="299" text-anchor="middle">NMT accounting</text><text class="small" x="235" y="333" text-anchor="middle">tag · bytes · site · live count</text><rect class="box" x="675" y="255" width="340" height="110" rx="14"/><text class="head" x="845" y="299" text-anchor="middle">Native allocator / OS</text><text class="small" x="845" y="333" text-anchor="middle">supplies backing memory</text><path class="line" d="M235 365 L235 402"/><path class="line" d="M845 365 L845 402"/><rect class="teal" x="65" y="402" width="340" height="70" rx="14"/><text class="body" x="235" y="446" text-anchor="middle">free → live count falls</text><rect class="rose" x="675" y="402" width="340" height="70" rx="14"/><text class="body" x="845" y="446" text-anchor="middle">pages may remain resident</text></svg>
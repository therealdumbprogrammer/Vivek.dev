<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Choose the observation layer</title><desc id="desc">Six layers from application to container</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#74869b"/></marker></defs><rect width="960" height="620" rx="22" class="bg" fill="#f7f9fc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#243247}.title{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#53647a}.card{fill:#fff;stroke:#bac9d9;stroke-width:1.5}.accent{fill:#e8efff;stroke:#5270b6;stroke-width:1.5}.mint{fill:#e8f3f1;stroke:#588d83;stroke-width:1.5}.amber{fill:#fff2dd;stroke:#b7823d;stroke-width:1.5}.line{stroke:#74869b;stroke-width:2;fill:none}.boundary{stroke:#9aabc0;stroke-width:1.5;stroke-dasharray:6 6;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#50637b}.accent{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.boundary{stroke:#a2b4c8}}</style><text x="36" y="48" class="title">Choose the observation layer</text><text x="36" y="74" class="sub">Each view has a scope; compare evidence across boundaries.</text><rect x="36" y="100" width="888" height="70" rx="15" class="accent"/><text x="54" y="130" class="head">Application behavior</text><text x="54" y="156" class="body">Request latency, error rate, traces</text><rect x="36" y="182" width="888" height="70" rx="15" class="mint"/><text x="54" y="212" class="head">Execution and threads</text><text x="54" y="238" class="body">Stacks, locks, CPU samples, virtual-thread state</text><rect x="36" y="264" width="888" height="70" rx="15" class="amber"/><text x="54" y="294" class="head">Java heap</text><text x="54" y="320" class="body">Object counts, allocation, retention, GC roots</text><rect x="36" y="346" width="888" height="70" rx="15" class="accent"/><text x="54" y="376" class="head">HotSpot runtime</text><text x="54" y="402" class="body">GC cycles, compilation, Metaspace, Code Cache</text><rect x="36" y="428" width="888" height="70" rx="15" class="mint"/><text x="54" y="458" class="head">Native process</text><text x="54" y="484" class="body">RSS, mappings, native allocations, per-thread CPU</text><rect x="36" y="510" width="888" height="70" rx="15" class="amber"/><text x="54" y="540" class="head">OS and container</text><text x="54" y="566" class="body">Limits, cgroup charges, throttling, I/O, external kills</text></svg>
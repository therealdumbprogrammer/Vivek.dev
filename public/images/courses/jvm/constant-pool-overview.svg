<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc"><title id="title">FROM SOURCE TO NUMBERED REFERENCES</title><desc id="desc">Example.java compiles to Example.class. Its value method uses getfield 7 and invokevirtual 13. Those numbers select symbolic field and method entries in Example.class's constant pool.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="510" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="18" text-anchor="middle">FROM SOURCE TO NUMBERED REFERENCES</text><rect x="24" y="65" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="111" text-anchor="middle" font-size="16">Example.java</text><text x="240" y="135" text-anchor="middle" font-size="16">javac → Example.class</text><path d="M240 175 V198" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="204" width="432" height="106" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240" y="250" text-anchor="middle" font-size="16">value() bytecode</text><text x="240" y="274" text-anchor="middle" font-size="16">getfield #7 · invokevirtual #13</text><path d="M240 314 V337" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="343" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="377" text-anchor="middle" font-size="16">Example.class constant pool</text><text x="240" y="401" text-anchor="middle" font-size="16">#7 Fieldref · #13 Methodref</text><text x="240" y="425" text-anchor="middle" font-size="16">symbolic descriptions</text><text x="240" y="478" font-size="15" text-anchor="middle">7 and 13 are indexes in Example.class</text></g></svg>

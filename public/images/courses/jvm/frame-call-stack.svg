<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">TWO DIFFERENT STACKS</title><desc id="desc">The thread stack contains c b and a frames. Each contains its own locals and operand stack.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="480" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">TWO DIFFERENT STACKS</text><text x="240" y="71" font-size="16" text-anchor="middle">Thread’s logical call stack</text><rect x="38" y="91" width="404" height="88" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="129.0" font-size="16" text-anchor="middle">c() frame ← current</text><text x="240.0" y="153.0" font-size="16" text-anchor="middle">own locals + own operand stack</text><rect x="38" y="197" width="404" height="88" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="235.0" font-size="16" text-anchor="middle">b() frame ← suspended</text><text x="240.0" y="259.0" font-size="16" text-anchor="middle">own locals + own operand stack</text><rect x="38" y="303" width="404" height="88" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="341.0" font-size="16" text-anchor="middle">a() frame ← suspended</text><text x="240.0" y="365.0" font-size="16" text-anchor="middle">own locals + own operand stack</text><text x="240" y="440" font-size="16" text-anchor="middle">Return removes c; it does not merge stacks.</text><text x="240" y="462" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
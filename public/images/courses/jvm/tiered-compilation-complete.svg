<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">EXECUTION, EVIDENCE, AND RESOURCES</title><desc id="desc">Execution supplies profiles to compilation policy; queues and compiler threads produce versions stored in the Code Cache. Assumptions may later require recovery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="520" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">EXECUTION, EVIDENCE, AND RESOURCES</text><rect x="25" y="62" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="87.0" font-size="16" text-anchor="middle">Interpreter / C1 profiling execution</text><text x="240.0" y="111.0" font-size="16" text-anchor="middle">produces runtime observations</text><path d="M240 125 L240 145" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="150" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="175.0" font-size="16" text-anchor="middle">Policy + compiler queues</text><text x="240.0" y="199.0" font-size="16" text-anchor="middle">select and schedule useful work</text><path d="M240 213 L240 233" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="238" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="263.0" font-size="16" text-anchor="middle">C1 / C2 compiler threads</text><text x="240.0" y="287.0" font-size="16" text-anchor="middle">produce native executable versions</text><path d="M240 301 L240 321" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="326" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="351.0" font-size="16" text-anchor="middle">Code Cache stores installed code</text><text x="240.0" y="375.0" font-size="16" text-anchor="middle">application execution can use it</text><path d="M240 389 L240 409" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="414" width="430" height="62" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="439.0" font-size="16" text-anchor="middle">Changing assumptions</text><text x="240.0" y="463.0" font-size="16" text-anchor="middle">recovery + new optimization decisions</text><text x="240" y="498" font-size="13" text-anchor="middle">Adaptive cycle · not one guaranteed linear journey</text></g></svg>

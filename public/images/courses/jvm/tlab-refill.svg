<svg xmlns="http://www.w3.org/2000/svg" width="480" height="505" viewBox="0 0 480 505" role="img" aria-labelledby="title desc"><title id="title">REFILL COST IS SHARED OVER TIME</title><desc id="desc">A 64-byte object cannot fit a 24-byte remainder; one possible path retires the buffer and obtains another.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="505" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">REFILL COST IS SHARED OVER TIME</text><text x="24" y="77" font-size="16">Next object: 64 bytes · remainder: 24 bytes</text><rect x="24" y="97" width="326" height="57" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="131.5" font-size="16">Allocated objects remain alive*</text><rect x="350" y="97" width="106" height="57" rx="8" fill="#ffffff" stroke="#315dcc" stroke-width="1.5"/><text x="362" y="131.5" font-size="15">Tail 24 B</text><path d="M240 159 L240 192" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="200" width="432" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="233.5" font-size="16">Possible decision: retire current TLAB</text><path d="M240 260 L240 294" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="302" width="432" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="335.5" font-size="16">Obtain new slice from shared space</text><path d="M240 362 L240 391" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="399" width="432" height="55" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="1.5"/><text x="36" y="432.5" font-size="16">Many local allocations follow</text><text x="24" y="486" font-size="14">*Lifetime follows reachability, not buffer retirement.</text></g></svg>
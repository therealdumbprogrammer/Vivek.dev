<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Where thread stacks live</title><desc id="desc">Carrier platform threads still own native stacks.</desc><rect width="900" height="450" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#687c8c"/></marker></defs><text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Where thread stacks live</text><rect x="30" y="126" width="260" height="196" rx="16" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="160" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Platform threads</text><text x="160" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#29465b">one native stack per platform thread</text><path d="M292 224 L315 224" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="320" y="126" width="260" height="196" rx="16" fill="#e5e3f5" stroke="#687c8c" stroke-width="2"/><text x="450" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Virtual threads</text><text x="450" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#29465b">unmounted stack chunks on Java heap</text><path d="M582 224 L605 224" stroke="#687c8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="610" y="126" width="260" height="196" rx="16" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="740" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Carriers</text><text x="740" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#29465b">platform threads + native stacks</text><text x="450" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#29465b">Carrier platform threads still own native stacks.</text></svg>
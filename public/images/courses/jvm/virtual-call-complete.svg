<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc"><title id="title">From receiver to optimized call</title><desc id="desc">Correct dispatch is required through every tier and recovery path.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:1.5}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:1.5}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:1.5}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:1.5}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:1.5}.line{fill:none;stroke:#7b8ba0;stroke-width:2}.dash{fill:none;stroke:#8898aa;stroke-width:1.5;stroke-dasharray:6 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}.tag{font-size:16px;font-weight:700;letter-spacing:.06em;fill:#466189}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.tag{fill:#a9c2ef}.line,.dash{stroke:#a9b9cd}}</style><rect width="1120" height="490" rx="22" class="bg"/><text x="36" y="49" class="title">From receiver to optimized call</text><text x="36" y="77" class="sub">Correct dispatch is required through every tier and recovery path.</text><style>.head{font-size:18px}.body{font-size:17px}</style><rect x="36.0" y="125" width="153.0" height="178" rx="15" class="card"/><text x="54.0" y="156" class="head">Object</text><text x="54.0" y="185" class="body">receiver oop</text><text x="54.0" y="211" class="body">from new</text><rect x="215.0" y="125" width="153.0" height="178" rx="15" class="blue"/><text x="233.0" y="156" class="head">Klass</text><text x="233.0" y="185" class="body">runtime type</text><text x="233.0" y="211" class="body">and interfaces</text><path d="M193.0 214.0 L210.0 214.0" class="line" marker-end="url(#arrow)"/><rect x="394.0" y="125" width="153.0" height="178" rx="15" class="mint"/><text x="412.0" y="156" class="head">Dispatch</text><text x="412.0" y="185" class="body">select process</text><text x="412.0" y="211" class="body">implementation</text><path d="M372.0 214.0 L389.0 214.0" class="line" marker-end="url(#arrow)"/><rect x="573.0" y="125" width="153.0" height="178" rx="15" class="amber"/><text x="591.0" y="156" class="head">Profile</text><text x="591.0" y="185" class="body">observed types</text><text x="591.0" y="211" class="body">in MethodData</text><path d="M551.0 214.0 L568.0 214.0" class="line" marker-end="url(#arrow)"/><rect x="752.0" y="125" width="153.0" height="178" rx="15" class="blue"/><text x="770.0" y="156" class="head">C2 nmethod</text><text x="770.0" y="185" class="body">guard + inline</text><text x="770.0" y="211" class="body">when useful</text><path d="M730.0 214.0 L747.0 214.0" class="line" marker-end="url(#arrow)"/><rect x="931.0" y="125" width="153.0" height="178" rx="15" class="mint"/><text x="949.0" y="156" class="head">Recovery</text><text x="949.0" y="185" class="body">fallback or</text><text x="949.0" y="211" class="body">deopt when</text><text x="949.0" y="237" class="body">needed</text><path d="M909.0 214.0 L926.0 214.0" class="line" marker-end="url(#arrow)"/><text x="36" y="456" class="small">A type profile guides optimization; it does not restrict future valid receivers.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Preserve the old value</title><desc id="desc">SATB barrier sees B before the assignment replaces it with C.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">Preserve the old value</text><rect x="55" y="145" width="220" height="110" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="165.0" y="193.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Read old value</text><text x="165.0" y="218.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">A.child → B</text><rect x="340" y="145" width="220" height="110" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="193.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">SATB pre-barrier</text><text x="450.0" y="218.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">preserve B</text><rect x="625" y="145" width="220" height="110" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="735.0" y="193.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Install new value</text><text x="735.0" y="218.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">A.child → C</text><path d="M275 200 L335 200" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="305.0" y="189.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">before</text><path d="M560 200 L620 200" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="590.0" y="189.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">then</text><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">The old reference must be captured before it disappears.</text></svg>

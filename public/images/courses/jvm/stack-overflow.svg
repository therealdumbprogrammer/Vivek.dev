<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">CALL DEPTH USES STACK SPACE</title><desc id="desc">Repeated recursive invocations accumulate frames until required stack exceeds what is permitted, causing StackOverflowError.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="500" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="34" font-size="18" text-anchor="middle">CALL DEPTH USES STACK SPACE</text><text x="240" y="77" font-size="16" text-anchor="middle">Recursion before earlier calls return</text><rect x="55" y="101" width="340" height="48" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="225.0" y="131.0" font-size="16" text-anchor="middle">recurse() invocation</text><rect x="70" y="162" width="340" height="48" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="192.0" font-size="16" text-anchor="middle">recurse() invocation</text><rect x="85" y="223" width="340" height="48" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="255.0" y="253.0" font-size="16" text-anchor="middle">recurse() invocation</text><rect x="100" y="284" width="340" height="48" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="270.0" y="314.0" font-size="16" text-anchor="middle">recurse() invocation</text><path d="M240 339 L240 370" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="380" width="420" height="76" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="412.0" font-size="16" text-anchor="middle">Required stack exceeds permitted stack</text><text x="240.0" y="436.0" font-size="16" text-anchor="middle">StackOverflowError</text><text x="240" y="482" font-size="13" text-anchor="middle">Conceptual JVM state · not native layout</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">ONE FRAME, ONE ADDITION</title><desc id="desc">iadd replaces 10 and 20 on the operand stack with 30; the local slots do not change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="460" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">ONE FRAME, ONE ADDITION</text><rect x="25" y="65" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="101" font-size="16" text-anchor="middle">Locals stay unchanged: 1 → 10, 2 → 20</text><path d="M240 127v22" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="152" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="188" font-size="16" text-anchor="middle">Before iadd: [ …, 10, 20 ] ← top</text><path d="M240 214v22" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="239" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="275" font-size="16" text-anchor="middle">iadd: consume two ints, add their values</text><path d="M240 301v22" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="326" width="430" height="61" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="362" font-size="16" text-anchor="middle">After iadd: [ …, 30 ] ← top</text><text x="240" y="425" font-size="14" text-anchor="middle">Conceptual HotSpot execution · not to scale</text></g></svg>

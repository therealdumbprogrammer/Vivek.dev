<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Buffer then trace</title><desc id="desc">Thread-local SATB entries become collector marking work, including descendants.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">Buffer then trace</text><rect x="50" y="115" width="200" height="110" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="150.0" y="163.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Thread A</text><text x="150.0" y="188.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">old: B, D</text><rect x="50" y="270" width="200" height="95" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="150.0" y="311.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Thread B</text><text x="150.0" y="336.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">old: M</text><rect x="345" y="175" width="210" height="115" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="450.0" y="226.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">SATB buffers</text><text x="450.0" y="251.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">queued references</text><rect x="650" y="175" width="210" height="115" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="755.0" y="226.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Concurrent marker</text><text x="755.0" y="251.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">B → Q → R</text><path d="M250 170 L340 205" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="295.0" y="176.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">enqueue</text><path d="M250 315 L340 260" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="295.0" y="276.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">enqueue</text><path d="M555 230 L645 230" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="600.0" y="219.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#536779">drain</text><text x="450" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#536779">Enqueued does not mean fully marked.</text></svg>

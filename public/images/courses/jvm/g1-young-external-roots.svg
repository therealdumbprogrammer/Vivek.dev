<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc"><title id="title">Find all incoming references</title><desc id="desc">The collection set must account for VM roots and heap roots.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8192a7"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#233249}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#75879b;stroke-width:3}.dash{fill:none;stroke:#8293a7;stroke-width:2;stroke-dasharray:7 6}.title{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line,.dash{stroke:#a9b9cd}}</style><rect width="1080" height="490" rx="22" class="bg"/><text x="36" y="51" class="title">Find all incoming references</text><text x="36" y="81" class="sub">The collection set must account for VM roots and heap roots.</text><rect x="36" y="135" width="275" height="145" rx="18" class="blue"/><text x="56" y="172" class="head">VM and code roots</text><text x="56" y="209" class="body">stack · JNI · class</text><text x="56" y="237" class="body">OopMaps locate oops</text><rect x="36" y="320" width="275" height="125" rx="18" class="amber"/><text x="56" y="357" class="head">Old region O1</text><text x="56" y="394" class="body">Customer.latestOrder</text><rect x="422" y="195" width="255" height="180" rx="18" class="card"/><text x="442" y="232" class="head">Merged root work</text><text x="442" y="269" class="body">candidate cards</text><text x="442" y="297" class="body">scan actual fields</text><rect x="789" y="195" width="255" height="180" rx="18" class="mint"/><text x="809" y="232" class="head">Young CSet</text><text x="809" y="269" class="body">Eden E1 · Survivor S1</text><text x="809" y="297" class="body">reachable Order</text><path d="M315 204 L416 240" class="line" marker-end="url(#arrow)"/><path d="M315 380 L416 320" class="line" marker-end="url(#arrow)"/><path d="M682 284 L783 284" class="line" marker-end="url(#arrow)"/><text x="36" y="112" class="small">Heap roots are incoming references from other heap regions.</text></svg>
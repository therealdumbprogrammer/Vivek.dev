<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">Carrier availability ≠ lock availability</title><desc id="desc">In JDK 25 V1 can unmount during a supported wait while holding an ordinary monitor. Its carrier can run V3, but V2 still waits for the same monitor.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6283ad"/></marker></defs><rect width="640" height="450" rx="22" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#243247">Carrier availability ≠ lock availability</text><rect x="75" y="79" width="490" height="72" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="320.0" y="109.0" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">V1 holds an ordinary Java monitor</text><text x="320.0" y="135.0" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">Supported blocking operation</text><path d="M235 151 L174 218" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M406 151 L474 218" fill="none" stroke="#6283ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="218" width="268" height="115" rx="14" fill="#edf3fb" stroke="#6283ad" stroke-width="2"/><text x="174.0" y="269.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Carrier can be released</text><text x="174.0" y="295.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">V3 can run on it</text><rect x="332" y="218" width="268" height="115" rx="14" fill="#f3f4f6" stroke="#94a0af" stroke-width="2"/><text x="466.0" y="269.5" text-anchor="middle" font-size="20" font-weight="700" fill="#243247">Monitor remains owned</text><text x="466.0" y="295.5" text-anchor="middle" font-size="20" font-weight="400" fill="#243247">V2 waits for that lock</text><text x="320" y="383" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">JEP 491: delivered in JDK 24; applies to JDK 25.</text><text x="320" y="419" text-anchor="middle" font-size="18" font-weight="400" fill="#243247">Native-frame interactions remain a caveat.</text></g></svg>
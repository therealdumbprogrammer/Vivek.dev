<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Generation sizing changes the pattern</title><desc id="desc">Smaller generations tend toward more frequent collections; larger ones toward fewer collections with potentially more work.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Generation sizing changes the pattern</text><rect x="60" y="120" width="360" height="170" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="240.0" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Smaller generation</text><text x="240.0" y="212.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">more frequent GC</text><text x="240.0" y="240.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">potentially shorter work</text><rect x="480" y="120" width="360" height="170" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="660.0" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Larger generation</text><text x="660.0" y="212.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">less frequent GC</text><text x="660.0" y="240.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">potentially longer work</text><text x="450" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#183047">Adaptive sizing balances pause, throughput, and footprint goals.</text></svg>
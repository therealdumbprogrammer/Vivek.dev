<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">TWO NATIVE EXECUTION PATHS</title><desc id="desc">Interpreted execution uses shared dispatch machinery; compiled execution can combine and optimize operations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="460" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">TWO NATIVE EXECUTION PATHS</text><rect x="25" y="65" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="101" font-size="16" text-anchor="middle">INTERPRETED: dispatch each bytecode</text><rect x="25" y="152" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="188" font-size="16" text-anchor="middle">Shared native code updates frame state</text><rect x="25" y="239" width="430" height="61" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="275" font-size="16" text-anchor="middle">COMPILED: method-specific native code</text><rect x="25" y="326" width="430" height="61" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240" y="362" font-size="16" text-anchor="middle">Less dispatch; optimization across operations</text><text x="240" y="425" font-size="14" text-anchor="middle">Conceptual HotSpot execution · not to scale</text></g></svg>

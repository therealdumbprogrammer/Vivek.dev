<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Barriers protect different invariants</title><desc id="desc">G1 SATB pre-write preserves overwritten marking edges; G1 post-write records incoming edges; ZGC load resolves references; generational ZGC store records writes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Barriers protect different invariants</text><rect x="65" y="88" width="310" height="58" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="220.0" y="123.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">G1 SATB pre-write</text><path d="M382 117 L470 117" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="88" width="340" height="58" rx="14" fill="#f8fafc" stroke="#91a3b3" stroke-width="2"/><text x="650.0" y="123.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">old edge for marking</text><rect x="65" y="163" width="310" height="58" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="220.0" y="198.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">G1 post-write/card</text><path d="M382 192 L470 192" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="163" width="340" height="58" rx="14" fill="#f8fafc" stroke="#91a3b3" stroke-width="2"/><text x="650.0" y="198.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">new incoming edge</text><rect x="65" y="238" width="310" height="58" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="220.0" y="273.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">ZGC load</text><path d="M382 267 L470 267" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="238" width="340" height="58" rx="14" fill="#f8fafc" stroke="#91a3b3" stroke-width="2"/><text x="650.0" y="273.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">resolve loaded reference</text><rect x="65" y="313" width="310" height="58" rx="14" fill="#f8e5ea" stroke="#91a3b3" stroke-width="2"/><text x="220.0" y="348.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">Generational ZGC store</text><path d="M382 342 L470 342" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="313" width="340" height="58" rx="14" fill="#f8fafc" stroke="#91a3b3" stroke-width="2"/><text x="650.0" y="348.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#183047">generation bookkeeping</text><text x="450" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#536779">Read and write barriers solve different GC problems.</text></svg>
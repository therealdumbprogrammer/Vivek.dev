<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">Two different compiler proofs</title><desc id="desc">A known-null old value can remove G1 SATB pre-work; scalar replacement removes the heap store itself.</desc>
<rect class="bg" width="1080" height="450" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#243247}.bg{fill:#f7f9fc}.heading{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.box{fill:#fff;stroke:#bdcad9;stroke-width:2}.accent{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.warn{fill:#fff1db;stroke:#b68a46;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#789;stroke-width:2;stroke-dasharray:8 6}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#52667e}.accent{fill:#213f3d;stroke:#73b1a7}.warn{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.line{stroke:#a9b9cd}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#526477" stroke-width="1.7"/></marker></defs>
<text class="heading" x="44" y="55">Two different compiler proofs</text><rect class="accent" x="40" y="120" width="465" height="260" rx="16"/><text class="label" x="60" y="156">Known-null first write</text><text class="body" x="60" y="192">Holder.value begins null</text><text class="body" x="60" y="219">No old reference to enqueue</text><text class="body" x="60" y="246">Pre-barrier may be removed</text><text class="body" x="60" y="273">Store and other needed work remain</text><rect class="warn" x="575" y="120" width="465" height="260" rx="16"/><text class="label" x="595" y="156">Scalar replacement</text><text class="body" x="595" y="192">Holder does not escape</text><text class="body" x="595" y="219">No physical Holder allocation</text><text class="body" x="595" y="246">No corresponding heap store</text><text class="body" x="595" y="273">Associated barriers disappear</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">COPY LIVE DATA, REUSE EDEN</title><desc id="desc">A, B, and C survive; dead objects are not copied. After successful evacuation, Eden is reusable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">COPY LIVE DATA, REUSE EDEN</text><text x="24" y="68" font-size="17">Eden before collection</text><rect x="24.0" y="80" width="80.4" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="64.2" y="108" text-anchor="middle" font-size="17">A</text><rect x="110.4" y="80" width="80.4" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="150.60000000000002" y="108" text-anchor="middle" font-size="17">dead</text><rect x="196.8" y="80" width="80.4" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="237.0" y="108" text-anchor="middle" font-size="17">B</text><rect x="283.20000000000005" y="80" width="80.4" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="323.40000000000003" y="108" text-anchor="middle" font-size="17">dead</text><rect x="369.6" y="80" width="80.4" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="409.8" y="108" text-anchor="middle" font-size="17">C</text><path d="M240 130 L240 150" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="173" font-size="17">Survivor destination after copying</text><rect x="24.0" y="185" width="102.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="75.0" y="213" text-anchor="middle" font-size="17">A</text><rect x="132.0" y="185" width="102.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="183.0" y="213" text-anchor="middle" font-size="17">B</text><rect x="240.0" y="185" width="102.0" height="44" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="291.0" y="213" text-anchor="middle" font-size="17">C</text><rect x="348.0" y="185" width="102.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="399.0" y="213" text-anchor="middle" font-size="17">free</text><path d="M240 235 L240 255" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="278" font-size="17">Eden after evacuation</text><rect x="24.0" y="290" width="426.0" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="237.0" y="318" text-anchor="middle" font-size="17">reusable / free</text><text x="24" y="415" font-size="16">Reference scanning and bookkeeping still cost work.</text></g></svg>
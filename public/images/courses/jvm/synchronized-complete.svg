<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">From Java semantics to HotSpot representation</title><desc id="desc">Blocks and synchronized methods use the same Java monitor contract. HotSpot commonly uses lightweight state and may inflate, then later deflate, an idle monitor.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#23364a}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:17px}.tiny{font-size:15px}.muted{fill:#5c6d7a}.card{fill:#fff;stroke:#9caeba;stroke-width:2}.blue{fill:#e7f0f7;stroke:#547fa8;stroke-width:3}.teal{fill:#e7f2ef;stroke:#57998f;stroke-width:3}.clay{fill:#fbede6;stroke:#d48763;stroke-width:3}.gold{fill:#fbf4df;stroke:#c8a34f;stroke-width:3}.arrow{stroke:#547fa8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547fa8"/></marker></defs><rect width="960" height="540" rx="24" fill="#fbfaf7"/><text x="48" y="56" class="title">From Java semantics to HotSpot representation</text><rect x="35" y="150" width="215" height="135" rx="18" class="card"/><text x="142.5" y="209.5" text-anchor="middle" class="label">Java semantics</text><text x="142.5" y="240.5" text-anchor="middle" class="small muted">block or method</text><path d="M250 215 L310 215" class="arrow"/><rect x="315" y="140" width="245" height="155" rx="18" class="teal"/><text x="437.5" y="209.5" text-anchor="middle" class="label">Lightweight path</text><text x="437.5" y="240.5" text-anchor="middle" class="small muted">Mark Word + LockStack</text><path d="M560 205 L620 205" class="arrow"/><text x="590.0" y="195.0" text-anchor="middle" class="small muted"></text><rect x="625" y="135" width="280" height="165" rx="18" class="clay"/><text x="765.0" y="209.5" text-anchor="middle" class="label">ObjectMonitor</text><text x="765.0" y="240.5" text-anchor="middle" class="small muted">contention / wait / notify</text><path d="M765 305 L765 370" class="arrow"/><text x="765.0" y="327.5" text-anchor="middle" class="small muted"></text><rect x="620" y="375" width="290" height="80" rx="18" class="gold"/><text x="765.0" y="407.0" text-anchor="middle" class="small">Deflation eligible</text><text x="765.0" y="438.0" text-anchor="middle" class="small muted">runtime reclamation</text><rect x="115" y="365" width="405" height="90" rx="18" class="blue"/><text x="317.5" y="402.0" text-anchor="middle" class="small">JDK 25 virtual threads</text><text x="317.5" y="433.0" text-anchor="middle" class="small muted">ownership follows Java identity</text><path d="M430 295 L350 360" class="arrow"/><text x="390.0" y="317.5" text-anchor="middle" class="small muted"></text></svg>
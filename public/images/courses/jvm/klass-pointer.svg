<svg xmlns="http://www.w3.org/2000/svg" width="480" height="570" viewBox="0 0 480 570" role="img" aria-labelledby="title desc">
<title id="title">The object identifies its class</title><desc id="desc">A compressed Klass pointer in User leads to shared native class metadata.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker><pattern id="gap" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f1f5f9"/><path d="M0 6 L6 0" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="480" height="570" rx="24" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif"><text x="26" y="36" font-size="16" fill="#334155" font-weight="650">OBJECT → CLASS METADATA</text><rect x="30" y="60" width="420" height="211" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="50" y="92" font-size="23" fill="#334155" font-weight="650">Java heap · User object</text><rect x="50" y="112" width="380" height="43" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="65" y="141" font-size="20" fill="#334155" font-weight="400">Mark Word</text><rect x="50" y="167" width="380" height="43" rx="12" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="65" y="196" font-size="20" fill="#334155" font-weight="600">Klass pointer</text><text x="50" y="247" font-size="19" fill="#334155" font-weight="400">Instance fields + possible padding</text><path d="M430 188 L466 188 L466 354 L240 354 L240 375" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="254" y="285" width="197" height="55" rx="12" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="2"/><text x="265" y="307" font-size="17" fill="#334155" font-weight="400">decode class</text><text x="265" y="330" font-size="17" fill="#334155" font-weight="400">encoding</text><rect x="30" y="382" width="420" height="129" rx="12" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="50" y="415" font-size="23" fill="#334155" font-weight="650">Native class metadata</text><text x="50" y="446" font-size="20" fill="#334155" font-weight="400">HotSpot Klass for User</text><text x="50" y="480" font-size="18" fill="#334155" font-weight="400">Field / method / runtime information</text><text x="30" y="540" font-size="18" fill="#334155" font-weight="400">Shared by instances of this loaded class</text></g></svg>

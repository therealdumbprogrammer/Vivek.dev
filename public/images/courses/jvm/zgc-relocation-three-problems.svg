<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">One moved Order, three races</title><desc id="desc">Old reference, two candidate copies and concurrent writes must all be coordinated.</desc>
<rect class="bg" width="1080" height="450" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#243247}.bg{fill:#f7f9fc}.heading{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.box{fill:#fff;stroke:#bdcad9;stroke-width:2}.accent{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.warn{fill:#fff1db;stroke:#b68a46;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#789;stroke-width:2;stroke-dasharray:8 6}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#52667e}.accent{fill:#213f3d;stroke:#73b1a7}.warn{fill:#4b3b2c;stroke:#d7a968}text{fill:#edf2fa}.line{stroke:#a9b9cd}}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#526477" stroke-width="1.7"/></marker></defs>
<text class="heading" x="44" y="55">One moved Order, three races</text><rect class="box" x="45" y="115" width="300" height="225" rx="16"/><text class="label" x="65" y="151">Stale reference</text><text class="body" x="65" y="187">Customer still names</text><text class="body" x="65" y="214">Order at 0x1000</text><text class="body" x="65" y="241">after move to 0x5000</text><rect class="warn" x="390" y="115" width="300" height="225" rx="16"/><text class="label" x="410" y="151">Competing copies</text><text class="body" x="410" y="187">Worker and mutator</text><text class="body" x="410" y="214">both encounter Order</text><text class="body" x="410" y="241">before forwarding exists</text><rect class="accent" x="735" y="115" width="300" height="225" rx="16"/><text class="label" x="755" y="151">Concurrent write</text><text class="body" x="755" y="187">quantity changes while</text><text class="body" x="755" y="214">the object is moving</text><text class="body" x="755" y="241">Which state survives?</text><text class="body" x="145" y="395">Resolve</text><text class="body" x="489" y="395">Publish once</text><text class="body" x="819" y="395">Coordinate access</text></svg>
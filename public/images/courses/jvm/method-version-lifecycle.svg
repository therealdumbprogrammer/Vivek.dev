<svg xmlns="http://www.w3.org/2000/svg" width="480" height="432" viewBox="0 0 480 432" role="img" aria-labelledby="title desc"><title id="title">ONE METHOD, CHANGING VERSIONS</title><desc id="desc">A method can execute through the interpreter, C1, and C2; old compiled frames may remain active, and invalidation can lead to recovery and recompilation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="432" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">ONE METHOD, CHANGING VERSIONS</text><rect x="25" y="62" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="87.0" font-size="16" text-anchor="middle">Bytecode remains available</text><text x="240.0" y="111.0" font-size="16" text-anchor="middle">shared interpreter can execute it</text><path d="M240 125 L240 145" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="150" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="175.0" font-size="16" text-anchor="middle">Install C1, then perhaps C2</text><text x="240.0" y="199.0" font-size="16" text-anchor="middle">older versions may still have frames</text><path d="M240 213 L240 233" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="238" width="430" height="62" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="263.0" font-size="16" text-anchor="middle">Assumption no longer holds</text><text x="240.0" y="287.0" font-size="16" text-anchor="middle">invalidate / recover valid execution</text><path d="M240 301 L240 321" fill="none" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="326" width="430" height="62" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="351.0" font-size="16" text-anchor="middle">New evidence → possible recompilation</text><text x="240.0" y="375.0" font-size="16" text-anchor="middle">reclaim old code when safe</text><text x="240" y="410" font-size="13" text-anchor="middle">Installing code does not move every active frame</text></g></svg>

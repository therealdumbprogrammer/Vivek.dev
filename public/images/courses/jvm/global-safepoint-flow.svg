<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Global safepoint flow</title><desc id="desc">Six stages show request, thread coordination, synchronization, operation, release, and resume.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="640" rx="28" fill="#fffdf9"/><text x="480" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">One global safepoint, end to end</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><g stroke-width="3"><rect x="55" y="100" width="240" height="90" rx="18" fill="#fff3d6" stroke="#bd7a28"/><rect x="360" y="100" width="240" height="90" rx="18" fill="#eef4ff" stroke="#4f6f9f"/><rect x="665" y="100" width="240" height="90" rx="18" fill="#e6f5ee" stroke="#328361"/><rect x="665" y="360" width="240" height="90" rx="18" fill="#f3eefe" stroke="#7555a7"/><rect x="360" y="360" width="240" height="90" rx="18" fill="#fff3d6" stroke="#bd7a28"/><rect x="55" y="360" width="240" height="90" rx="18" fill="#e6f5ee" stroke="#328361"/></g><g font-size="19" fill="#172033"><text x="175" y="138">1 · request</text><text x="175" y="166">global safepoint</text><text x="480" y="138">2 · threads reach or</text><text x="480" y="166">are recognized safe</text><text x="785" y="138">3 · all required</text><text x="785" y="166">threads accounted for</text><text x="785" y="398">4 · VM operation</text><text x="785" y="426">executes</text><text x="480" y="398">5 · release</text><text x="480" y="426">safepoint</text><text x="175" y="398">6 · application</text><text x="175" y="426">threads resume</text></g><text x="480" y="555" font-size="18" fill="#475569">The operation does not begin before the coordinated state exists.</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M295 145H360"/><path d="M600 145H665"/><path d="M785 190V360"/><path d="M665 405H600"/><path d="M360 405H295"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">NO SINGLE GLOBAL TIER</title><desc id="desc">Cold, moderate, and hot paths can use different executable forms at the same time. The illustrative progression is not a timing curve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="480" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="35" font-size="17" text-anchor="middle">NO SINGLE GLOBAL TIER</text><text x="240" y="77" font-size="16" text-anchor="middle">Early traffic                     Later traffic</text><rect x="25" y="105" width="430" height="75" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="136.5" font-size="16" text-anchor="middle">Cold path</text><text x="240.0" y="160.5" font-size="16" text-anchor="middle">Interpreter → Interpreter</text><rect x="25" y="205" width="430" height="75" rx="12" fill="#fff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="236.5" font-size="16" text-anchor="middle">Moderate path</text><text x="240.0" y="260.5" font-size="16" text-anchor="middle">Interpreter → C1</text><rect x="25" y="305" width="430" height="75" rx="12" fill="#e9efff" stroke="#9aa8bb" stroke-width="1.5"/><text x="240.0" y="336.5" font-size="16" text-anchor="middle">Hot path</text><text x="240.0" y="360.5" font-size="16" text-anchor="middle">Interpreter → C1 → C2</text><text x="240" y="419" font-size="15" text-anchor="middle">Different methods adapt at different times.</text><text x="240" y="458" font-size="13" text-anchor="middle">Traffic changes can trigger further adaptation</text></g></svg>

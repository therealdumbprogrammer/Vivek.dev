<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">An object's generational path</title><desc id="desc">Young objects die or survive, and later may promote into old.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="450" rx="22" fill="#f8fafc"/>
<text x="30" y="51" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">An object's generational path</text>
<path d="M180 198 L225 198" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M400 198 L455 198" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="427.5" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">live</text>
<path d="M630 198 L700 198" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="665" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">may promote</text>
<path d="M313 240 L313 310" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="313" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">dies</text>
<rect x="35" y="155" width="145" height="85" rx="13" fill="#ffffff" stroke="#b7c7d5" stroke-width="2"/>
<text x="107.5" y="203.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Allocate</text>
<rect x="225" y="155" width="175" height="85" rx="13" fill="#e8f1fb" stroke="#8eaecb" stroke-width="2"/>
<text x="312.5" y="203.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Eden / young</text>
<rect x="455" y="155" width="175" height="85" rx="13" fill="#e5f5ef" stroke="#91baa9" stroke-width="2"/>
<text x="542.5" y="203.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Survivor</text>
<rect x="700" y="155" width="155" height="85" rx="13" fill="#fff2d8" stroke="#d4b67c" stroke-width="2"/>
<text x="777.5" y="203.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Old</text>
<rect x="235" y="310" width="165" height="65" rx="13" fill="#edf1f4" stroke="#bac7d0" stroke-width="2"/>
<text x="317.5" y="348.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Unreachable</text>
<rect x="25" y="398" width="850" height="38" rx="9" fill="#ffffff" stroke="#d5dfe8"/>
<text x="450" y="423" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#52657a">Survival is conditional; promotion has no universal fixed age.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Normal G1 and Full GC</title><desc id="desc">Normal regional evacuation and concurrent marking contrast with stop-the-world full-heap in-place compaction.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Normal G1 and Full GC</text><rect x="40.0" y="145" width="190.0" height="145" rx="15" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="135.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Young / Mixed</text><text x="135.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">STW evacuation</text><path d="M233.0 217 L245.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="250.0" y="145" width="190.0" height="145" rx="15" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="345.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Concurrent Mark</text><text x="345.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">mutators run</text><path d="M443.0 217 L455.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="460.0" y="145" width="190.0" height="145" rx="15" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="555.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Severe pressure</text><text x="555.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Full GC</text><path d="M653.0 217 L665.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="670.0" y="145" width="190.0" height="145" rx="15" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="765.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Full heap</text><text x="765.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">STW compact</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 506" role="img" aria-labelledby="title desc"><title id="title">Address space and physical memory</title><desc id="desc">Reservation is not immediate RAM consumption.</desc><rect width="600" height="506" fill="#f8fafc"/><text x="300" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183047">Address space and physical</text><text x="300" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183047">memory</text><rect x="28" y="105" width="544" height="96" rx="16" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="48" y="140" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Reserved virtual range</text><text x="48" y="176" font-family="Arial,sans-serif" font-size="21" fill="#183047">8 GB ceiling</text><rect x="28" y="217" width="544" height="96" rx="16" fill="#e8f4e7" stroke="#91a3b3" stroke-width="2"/><text x="48" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Committed heap</text><text x="48" y="288" font-family="Arial,sans-serif" font-size="21" fill="#183047">1 GB initially</text><rect x="28" y="329" width="544" height="96" rx="16" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="48" y="364" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183047">Resident pages</text><text x="48" y="400" font-family="Arial,sans-serif" font-size="21" fill="#183047">OS view varies</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Evacuation needs working space</title><desc id="desc">Survivors remain in source regions while copies occupy free destinations. Source regions are reclaimed after successful copying and reference updates.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">Evacuation needs working space</text><text x="220" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Collection set: source regions</text><text x="675" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183047">Destination: free regions</text><rect x="75" y="135" width="165" height="105" rx="12" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><rect x="87" y="168" width="56" height="57" rx="7" fill="#d9eafb" stroke="#536779"/><rect x="155" y="168" width="66" height="57" rx="7" fill="#f8fafc" stroke="#91a3b3" stroke-dasharray="5 4"/><text x="157" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#183047">R1</text><text x="115" y="201" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#183047">live</text><text x="188" y="201" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#183047">dead</text><rect x="255" y="135" width="165" height="105" rx="12" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><rect x="267" y="168" width="56" height="57" rx="7" fill="#d9eafb" stroke="#536779"/><rect x="335" y="168" width="66" height="57" rx="7" fill="#f8fafc" stroke="#91a3b3" stroke-dasharray="5 4"/><text x="337" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#183047">R2</text><text x="295" y="201" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#183047">live</text><text x="368" y="201" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#183047">dead</text><rect x="550" y="135" width="155" height="105" rx="12" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="627" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#183047">R8</text><text x="627" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#183047">copy target</text><rect x="730" y="135" width="155" height="105" rx="12" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="807" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#183047">R9</text><text x="807" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#183047">copy target</text><path d="M420 190 L535 190" fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><text x="477" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#183047">copy</text><path d="M160 270 L160 320 L735 320 L735 270" fill="none" stroke="#536779" stroke-width="2" stroke-dasharray="7 5"/><text x="450" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#183047">Source space becomes reusable only after survivors move and references are updated.</text></svg>

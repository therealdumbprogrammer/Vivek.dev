<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">COARSE ADDRESS METADATA</title><desc id="desc">Each table entry represents a heap range. Dirty means inspect this area, not a confirmed reference.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="440" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif" fill="#334155"><text x="24" y="36" font-size="20">COARSE ADDRESS METADATA</text><text x="24" y="80" font-size="17">Heap address ranges (not object boundaries)</text><rect x="24" y="105" width="80" height="75" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="36" y="148.5" font-size="17">0</text><rect x="24" y="255" width="80" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="36" y="286.0" font-size="17">clean</text><path d="M64 185 L64 245" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="111" y="105" width="80" height="75" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="123" y="148.5" font-size="17">1</text><rect x="111" y="255" width="80" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="123" y="286.0" font-size="17">clean</text><path d="M151 185 L151 245" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="198" y="105" width="80" height="75" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="210" y="148.5" font-size="17">2</text><rect x="198" y="255" width="80" height="50" rx="8" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="210" y="286.0" font-size="17">dirty</text><path d="M238 185 L238 245" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="285" y="105" width="80" height="75" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="297" y="148.5" font-size="17">3</text><rect x="285" y="255" width="80" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="297" y="286.0" font-size="17">clean</text><path d="M325 185 L325 245" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="372" y="105" width="80" height="75" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="384" y="148.5" font-size="17">4</text><rect x="372" y="255" width="80" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="384" y="286.0" font-size="17">clean</text><path d="M412 185 L412 245" stroke="#315dcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="330" font-size="17">Corresponding card-table entries</text><text x="24" y="365" font-size="17">A write in card 2 marks an area to inspect.</text><text x="24" y="400" font-size="17">Dirty does not prove an old → young edge.</text></g></svg>
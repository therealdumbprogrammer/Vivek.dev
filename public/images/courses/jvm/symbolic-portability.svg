<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc"><title id="title">SAME SYMBOL, DIFFERENT RUNS</title><desc id="desc">Portable Example.class symbolically names String.toUpperCase. JVM run A and JVM run B each resolve that symbol to the compatible runtime type and method relationship in their own process.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="510" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="18" text-anchor="middle">SAME SYMBOL, DIFFERENT RUNS</text><rect x="24" y="65" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="111" text-anchor="middle" font-size="16">Portable Example.class</text><text x="240" y="135" text-anchor="middle" font-size="16">String.toUpperCase · symbolic</text><rect x="24" y="204" width="432" height="106" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240" y="250" text-anchor="middle" font-size="16">JVM run A</text><text x="240" y="274" text-anchor="middle" font-size="16">resolve against run A's loaded types</text><rect x="24" y="343" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="389" text-anchor="middle" font-size="16">JVM run B</text><text x="240" y="413" text-anchor="middle" font-size="16">resolve against run B's loaded types</text><path d="M24 118 H12 V396 H23 M12 257 H23" fill="none" stroke="#315dcc" stroke-width="2"/><text x="240" y="478" font-size="15" text-anchor="middle">Independent runs; no shared runtime addresses</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Choosing coordination scope</title><desc id="desc">Operations needing selected thread state use handshakes; operations needing global JVM state use safepoints.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">What scope does correctness require?</text><g font-family="system-ui,sans-serif" text-anchor="middle"><path d="M480 100L660 210L480 320L300 210Z" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="480" y="198" font-size="20" font-weight="700" fill="#7a4614">Which thread state</text><text x="480" y="229" font-size="20" font-weight="700" fill="#7a4614">must be coordinated?</text><rect x="75" y="390" width="330" height="120" rx="20" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="240" y="434" font-size="22" font-weight="700" fill="#185b42">Selected JavaThread(s)</text><text x="240" y="470" font-size="19" fill="#244c3d">thread-local handshake</text><rect x="555" y="390" width="330" height="120" rx="20" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="720" y="434" font-size="22" font-weight="700" fill="#4d3475">Global JVM state</text><text x="720" y="470" font-size="19" fill="#4d3475">global safepoint</text><text x="285" y="343" font-size="17" fill="#166534">local scope</text><text x="675" y="343" font-size="17" fill="#6d28d9">global scope</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M365 280C315 325 275 340 250 390"/><path d="M595 280C645 325 685 340 710 390"/></g></svg>

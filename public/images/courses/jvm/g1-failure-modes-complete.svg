<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">The G1 capacity loop</title><desc id="desc">Allocation raises occupancy, marking and mixed collections reclaim, and free regions supply evacuation working space.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">The G1 capacity loop</text><rect x="40.0" y="145" width="190.0" height="145" rx="15" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="135.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Application</text><text x="135.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">allocates</text><path d="M233.0 217 L245.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="250.0" y="145" width="190.0" height="145" rx="15" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="345.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Old occupancy</text><text x="345.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">rises</text><path d="M443.0 217 L455.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="460.0" y="145" width="190.0" height="145" rx="15" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="555.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Mark + Mixed</text><text x="555.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">reclaim</text><path d="M653.0 217 L665.0 217" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/><rect x="670.0" y="145" width="190.0" height="145" rx="15" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="765.0" y="180.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">Free regions</text><text x="765.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#183047">copy survivors</text></svg>

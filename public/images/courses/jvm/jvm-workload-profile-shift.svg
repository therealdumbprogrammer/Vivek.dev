<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">A changed profile can restart adaptation</title><desc id="desc">One warmed input distribution does not cover another</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#23354b}.bg{fill:#f8fafc}.card{fill:#fff;stroke:#aebed0;stroke-width:2}.blue{fill:#e8f0fc;stroke:#6685b0;stroke-width:2}.teal{fill:#e5f4ef;stroke:#5d9b89;stroke-width:2}.amber{fill:#fff3df;stroke:#bd9654;stroke-width:2}.rose{fill:#f9ecee;stroke:#bc7f89;stroke-width:2}.line{stroke:#657b95;stroke-width:3;fill:none}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52667f}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52667f}@media(prefers-color-scheme:dark){.bg{fill:#182330}.card{fill:#263647;stroke:#61778f}.blue{fill:#243b59;stroke:#87a7db}.teal{fill:#22443d;stroke:#80c3b1}.amber{fill:#4b3d2b;stroke:#dfb976}.rose{fill:#49333e;stroke:#daa1aa}text{fill:#edf3fa}.sub,.small{fill:#c5d3e2}.line{stroke:#abc0d7}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8094aa"/></marker></defs><rect width="1080" height="440" rx="22" class="bg"/><text x="36" y="50" class="title">A changed profile can restart adaptation</text><text x="36" y="80" class="sub">One warmed input distribution does not cover another</text><rect x="36" y="128" width="318" height="212" rx="16" class="blue"/><text x="54" y="164" class="head">Warm-up mix</text><text x="54" y="205" class="body">RegularDiscount only</text><text x="54" y="235" class="body">Specialized guarded path</text><path d="M356 235 L381 235" class="line" marker-end="url(#arrow)"/><rect x="390" y="128" width="318" height="212" rx="16" class="amber"/><text x="408" y="164" class="head">Production mix</text><text x="408" y="205" class="body">Regular + Premium</text><text x="408" y="235" class="body">Guard may use fallback</text><path d="M710 235 L735 235" class="line" marker-end="url(#arrow)"/><rect x="744" y="128" width="318" height="212" rx="16" class="teal"/><text x="762" y="164" class="head">Runtime response</text><text x="762" y="205" class="body">Possible deoptimization</text><text x="762" y="235" class="body">New profile and code</text><text x="36" y="410" class="small">Correctness remains; frequency and performance impact must be measured.</text></svg>
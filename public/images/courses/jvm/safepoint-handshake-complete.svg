<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">Complete safepoint and handshake model</title><desc id="desc">Shared polling and safe-state machinery supports selected-thread handshakes and global safepoints.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="660" rx="28" fill="#fffdf9"/><text x="480" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">HotSpot coordinates at the scope the operation needs</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="310" y="90" width="340" height="76" rx="18" fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"/><text x="480" y="137" font-size="22" font-weight="700" fill="#243c65">Runtime operation requests work</text><rect x="280" y="220" width="400" height="88" rx="18" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="480" y="256" font-size="21" font-weight="700" fill="#7a4614">Per-thread polls + safe states</text><text x="480" y="285" font-size="17" fill="#54391d">shared coordination infrastructure</text><rect x="65" y="390" width="350" height="125" rx="20" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="240" y="430" font-size="22" font-weight="700" fill="#185b42">Thread-local handshake</text><text x="240" y="465" font-size="18" fill="#244c3d">selected target callback</text><text x="240" y="493" font-size="18" fill="#244c3d">unrelated threads continue</text><rect x="545" y="390" width="350" height="125" rx="20" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="720" y="430" font-size="22" font-weight="700" fill="#4d3475">Global safepoint</text><text x="720" y="465" font-size="18" fill="#4d3475">all relevant threads accounted</text><text x="720" y="493" font-size="18" fill="#4d3475">global VM operation</text><text x="240" y="580" font-size="18" font-weight="700" fill="#185b42">selected-thread state</text><text x="720" y="580" font-size="18" font-weight="700" fill="#4d3475">globally consistent state</text></g><g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M480 166V220"/><path d="M380 308C330 340 285 350 260 390"/><path d="M580 308C630 340 675 350 700 390"/><path d="M240 515V555"/><path d="M720 515V555"/></g></svg>

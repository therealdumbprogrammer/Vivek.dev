<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
<title id="title">Eight bytes multiplied by one hundred million</title><desc id="desc">Eight bytes per object across one hundred million objects is 800 decimal MB, about 763 MiB.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker><pattern id="gap" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f1f5f9"/><path d="M0 6 L6 0" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="480" height="440" rx="24" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif"><text x="26" y="36" font-size="16" fill="#334155" font-weight="650">SMALL SAVING × MANY OBJECTS</text><rect x="40" y="63" width="400" height="83" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="62" y="97" font-size="25" fill="#334155" font-weight="650">8 bytes less per object</text><text x="62" y="128" font-size="17" fill="#334155" font-weight="400">Assumed saving, not a flag prediction</text><text x="223" y="180" font-size="32" fill="#315dcc" font-weight="400">×</text><rect x="40" y="201" width="400" height="65" rx="12" fill="#fff" stroke="#dce5ef" stroke-width="2"/><text x="62" y="242" font-size="25" fill="#334155" font-weight="650">100,000,000 live objects</text><path d="M240 276 L240 310" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="322" width="400" height="85" rx="12" fill="#e9efff" stroke="#315dcc" stroke-width="2"/><text x="62" y="357" font-size="26" fill="#315dcc" font-weight="650">800 MB less live heap</text><text x="62" y="388" font-size="18" fill="#334155" font-weight="400">800,000,000 bytes ≈ 763 MiB</text></g></svg>

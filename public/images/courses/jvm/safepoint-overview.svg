<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Safepoint coordination overview</title><desc id="desc">Application threads move from running through coordinated safe states to a VM operation and resume.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">Global coordination, then VM work</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#eef4ff" stroke="#4f6f9f" stroke-width="3"><rect x="55" y="120" width="170" height="70" rx="16"/><rect x="55" y="230" width="170" height="70" rx="16"/><rect x="55" y="340" width="170" height="70" rx="16"/></g><g font-size="20" fill="#172033"><text x="140" y="163">Thread A runs</text><text x="140" y="273">Thread B runs</text><text x="140" y="383">Thread C runs</text></g>
  <rect x="330" y="200" width="220" height="130" rx="20" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="440" y="245" font-size="21" font-weight="700" fill="#7a4614">Safepoint request</text><text x="440" y="280" font-size="18" fill="#54391d">reach or recognize</text><text x="440" y="308" font-size="18" fill="#54391d">safe thread states</text>
  <rect x="655" y="150" width="240" height="110" rx="20" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="775" y="194" font-size="21" font-weight="700" fill="#185b42">Global safepoint</text><text x="775" y="228" font-size="18" fill="#244c3d">threads accounted for</text>
  <rect x="655" y="335" width="240" height="100" rx="20" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="775" y="378" font-size="21" font-weight="700" fill="#4d3475">VM operation</text><text x="775" y="410" font-size="18" fill="#4d3475">uses known state</text></g>
  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M225 155C280 155 275 235 330 235"/><path d="M225 265H330"/><path d="M225 375C280 375 275 300 330 300"/><path d="M550 265C600 265 605 205 655 205"/><path d="M775 260V335"/><path d="M655 385H590C560 385 555 485 500 485H160C125 485 125 445 140 410"/></g><text x="390" y="525" font-family="system-ui,sans-serif" font-size="18" fill="#475569">release safepoint → application threads resume</text>
</svg>

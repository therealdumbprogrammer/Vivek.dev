<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc"><title id="title">FOLLOW ENTRY #13</title><desc id="desc">The invokevirtual 13 instruction selects Methodref 13. That entry links to Class 14 and NameAndType 15, which describe java.lang.String, toUpperCase, and its method descriptor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="510" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="18" text-anchor="middle">FOLLOW ENTRY #13</text><rect x="24" y="65" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="111" text-anchor="middle" font-size="16">invokevirtual #13</text><text x="240" y="135" text-anchor="middle" font-size="16">select entry 13 in this class file</text><path d="M240 175 V198" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="204" width="432" height="106" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240" y="250" text-anchor="middle" font-size="16">#13 Methodref → #14 + #15</text><text x="240" y="274" text-anchor="middle" font-size="16">Class + NameAndType</text><path d="M240 314 V337" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="343" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="377" text-anchor="middle" font-size="16">#14 → java/lang/String</text><text x="240" y="401" text-anchor="middle" font-size="16">#15 → toUpperCase</text><text x="240" y="425" text-anchor="middle" font-size="16">+ ()Ljava/lang/String;</text><text x="240" y="478" font-size="15" text-anchor="middle">No runtime address is stored here</text></g></svg>

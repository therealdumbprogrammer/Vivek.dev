<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Roots into a Collection Set</title><desc id="desc">VM and thread roots and remembered outside heap references lead into selected collection set regions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs>
<rect width="900" height="450" fill="#f8fafc"/>
<text x="450" y="49" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="bold" fill="#183047">Roots into a Collection Set</text>
<rect x="62" y="112" width="260" height="82" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="192.0" y="160.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">VM / thread roots</text><rect x="62" y="256" width="260" height="82" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="192.0" y="294.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Outside heap cards</text><text x="192.0" y="322.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">remembered references</text><path d="M326 153 L553 189" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M326 297 L553 257" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="560" y="135" width="275" height="150" rx="14" fill="#fce4e7" stroke="#91a3b3" stroke-width="2"/><text x="697.5" y="207.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="bold" fill="#183047">Collection Set</text><text x="697.5" y="235.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" fill="#536779">selected source regions</text><text x="450" y="395" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="normal" fill="#536779">Only selected source regions are evacuated in this pause.</text>

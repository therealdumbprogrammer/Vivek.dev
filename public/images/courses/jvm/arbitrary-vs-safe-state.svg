<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Arbitrary machine state versus a runtime-safe state</title><desc id="desc">One panel shows values moving without a complete map; another shows a known machine location with reference metadata.</desc>
  <rect width="960" height="600" rx="28" fill="#fffdf9"/><text x="480" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#172033">The pause location needs an interpretation map</text>
  <g font-family="system-ui,sans-serif"><rect x="55" y="100" width="400" height="430" rx="22" fill="#fff7f1" stroke="#b96247" stroke-width="3"/><text x="255" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#873d28">Arbitrary instruction</text><text x="90" y="195" font-size="18" fill="#334155">1  R8 → Customer reference</text><text x="90" y="245" font-size="18" fill="#334155">2  move reference</text><text x="90" y="295" font-size="18" fill="#334155">3  slot 24 → Customer</text><text x="90" y="345" font-size="18" fill="#334155">4  R8 → integer</text><path d="M110 390H395" stroke="#b96247" stroke-width="3" stroke-dasharray="9 8"/><text x="255" y="430" text-anchor="middle" font-size="19" fill="#873d28">No complete map promised</text><text x="255" y="463" text-anchor="middle" font-size="17" fill="#704c40">for every instruction</text>
  <rect x="505" y="100" width="400" height="430" rx="22" fill="#eef8f2" stroke="#328361" stroke-width="3"/><text x="705" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#185b42">Safe machine state</text><rect x="550" y="185" width="140" height="90" rx="14" fill="#fff" stroke="#4f6f9f" stroke-width="2"/><text x="620" y="220" text-anchor="middle" font-size="18" fill="#172033">R8</text><text x="620" y="250" text-anchor="middle" font-size="17" fill="#4f6f9f">object ref</text><rect x="720" y="185" width="140" height="90" rx="14" fill="#fff" stroke="#4f6f9f" stroke-width="2"/><text x="790" y="220" text-anchor="middle" font-size="18" fill="#172033">slot 24</text><text x="790" y="250" text-anchor="middle" font-size="17" fill="#4f6f9f">object ref</text><rect x="550" y="320" width="310" height="120" rx="16" fill="#e6f5ee" stroke="#328361" stroke-width="2"/><text x="705" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#185b42">JIT metadata</text><text x="705" y="395" text-anchor="middle" font-size="18" fill="#244c3d">reference locations +</text><text x="705" y="423" text-anchor="middle" font-size="18" fill="#244c3d">logical execution state</text></g>
</svg>

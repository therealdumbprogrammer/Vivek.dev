<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">One monitor, changing runtime representation</title><desc id="desc">Java monitor semantics lead to a lightweight fast path for uncontended locking, with a possible transition to ObjectMonitor when richer state is needed.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#23364a}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.small{font-size:17px}.tiny{font-size:15px}.muted{fill:#5c6d7a}.card{fill:#fff;stroke:#9caeba;stroke-width:2}.blue{fill:#e7f0f7;stroke:#547fa8;stroke-width:3}.teal{fill:#e7f2ef;stroke:#57998f;stroke-width:3}.clay{fill:#fbede6;stroke:#d48763;stroke-width:3}.gold{fill:#fbf4df;stroke:#c8a34f;stroke-width:3}.arrow{stroke:#547fa8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547fa8"/></marker></defs><rect width="960" height="540" rx="24" fill="#fbfaf7"/><text x="48" y="56" class="title">One monitor, changing runtime representation</text><rect x="48" y="170" width="220" height="120" rx="18" class="card"/><text x="158.0" y="222.0" text-anchor="middle" class="label">Java monitor</text><text x="158.0" y="253.0" text-anchor="middle" class="small muted">mutual exclusion + visibility</text><path d="M270 230 L355 230" class="arrow"/><text x="312.5" y="220.0" text-anchor="middle" class="small muted">enter / exit</text><rect x="360" y="155" width="235" height="150" rx="18" class="teal"/><text x="477.5" y="222.0" text-anchor="middle" class="label">Lightweight lock</text><text x="477.5" y="253.0" text-anchor="middle" class="small muted">Mark Word + LockStack</text><path d="M600 230 L680 230" class="arrow"/><text x="640.0" y="220.0" text-anchor="middle" class="small muted">contended</text><rect x="685" y="155" width="225" height="150" rx="18" class="clay"/><text x="797.5" y="222.0" text-anchor="middle" class="label">ObjectMonitor</text><text x="797.5" y="253.0" text-anchor="middle" class="small muted">owner + queues + wait set</text><rect x="195" y="385" width="570" height="90" rx="18" class="gold"/><text x="480.0" y="422.0" text-anchor="middle" class="small">One Java contract</text><text x="480.0" y="453.0" text-anchor="middle" class="small muted">implementation representation can change</text><path d="M480 310 L480 380" class="arrow"/></svg>
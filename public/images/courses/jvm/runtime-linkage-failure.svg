<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc"><title id="title">COMPILE-TIME API, RUNTIME MISMATCH</title><desc id="desc">Compile against library v1; Library.foo:()V exists. Deploy caller with library v2; No matching foo in lookup. Resolve caller’s Methodref; NoSuchMethodError</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315dcc"/></marker></defs><rect width="480" height="510" rx="24" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#334155"><text x="240" y="36" font-size="18" text-anchor="middle">COMPILE-TIME API, RUNTIME MISMATCH</text><rect x="24" y="65" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="111" text-anchor="middle" font-size="16">Compile against library v1</text><text x="240" y="135" text-anchor="middle" font-size="16">Library.foo:()V exists</text><path d="M240 175 V198" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="204" width="432" height="106" rx="12" fill="#e9efff" stroke="#9aa8bb"/><text x="240" y="250" text-anchor="middle" font-size="16">Deploy caller with library v2</text><text x="240" y="274" text-anchor="middle" font-size="16">No matching foo in lookup</text><path d="M240 314 V337" stroke="#315dcc" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="343" width="432" height="106" rx="12" fill="#fff" stroke="#9aa8bb"/><text x="240" y="389" text-anchor="middle" font-size="16">Resolve caller’s Methodref</text><text x="240" y="413" text-anchor="middle" font-size="16">NoSuchMethodError</text><text x="240" y="478" font-size="15" text-anchor="middle">Conceptual JVM model · indexes are illustrative</text></g></svg>
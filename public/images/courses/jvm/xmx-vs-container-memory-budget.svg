<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc"><title id="title">Xmx is one part of the limit</title><desc id="desc">A container memory charge includes more than resident Java heap.</desc><rect class="bg" width="1080" height="540" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.accent{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.bar{fill:#91bdb5}.line{stroke:#647b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#647b91;stroke-width:3;fill:none}.dash{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}@media(prefers-color-scheme:dark){.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.accent{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.bar{fill:#6aa79c}text{fill:#edf2fa}.line,.plain{stroke:#aec1d4}.dash{stroke:#92a9bf}}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#647b91" stroke-width="1.8"/></marker></defs><text class="title" x="42" y="58">Xmx is one part of the limit</text><rect class="gold" x="45" y="115" width="990" height="355" rx="17"/><text class="label" x="70" y="154">Container enforced limit</text><rect class="accent" x="72" y="184" width="330" height="206" rx="15"/><text class="label" x="91" y="220">Java heap</text><text class="body" x="91" y="249">Xmx = ceiling</text><text class="body" x="91" y="278">resident pages vary</text><rect class="box" x="427" y="184" width="272" height="95" rx="15"/><text class="label" x="446" y="220">HotSpot native</text><text class="body" x="446" y="249">metadata + code + GC</text><rect class="box" x="427" y="296" width="272" height="94" rx="15"/><text class="label" x="446" y="332">Threads + buffers</text><text class="body" x="446" y="361">JNI and direct storage</text><rect class="box" x="725" y="184" width="277" height="206" rx="15"/><text class="label" x="744" y="220">Other charges</text><text class="body" x="744" y="249">file cache + kernel</text><text class="body" x="744" y="278">other processes</text><text class="note" x="68" y="510">Illustrative regions; their measured views have different accounting boundaries.</text></svg>
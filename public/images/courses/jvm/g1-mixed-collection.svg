<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Mixed collection</title><desc id="desc">Young regions and selected old candidates form a mixed collection set and evacuate to destination regions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#536779"/></marker></defs>
<rect width="900" height="450" fill="#f8fafc"/>
<text x="450" y="49" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="bold" fill="#183047">Mixed collection</text>
<text x="450" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="normal" fill="#536779">Outlined Old regions join the young source regions</text><rect x="90" y="132" width="88" height="74" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="134.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">E</text><rect x="188" y="132" width="88" height="74" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="232.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">O</text><rect x="286" y="132" width="88" height="74" rx="14" fill="#d9f3ea" stroke="#91a3b3" stroke-width="2"/><text x="330.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">S</text><rect x="384" y="132" width="88" height="74" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="428.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">O</text><rect x="482" y="132" width="88" height="74" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="526.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">E</text><rect x="580" y="132" width="88" height="74" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="624.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">O</text><rect x="678" y="132" width="88" height="74" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="722.0" y="176.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">O</text><rect x="185" y="127" width="94" height="84" rx="16" fill="none" stroke="#c45568" stroke-width="4"/><rect x="381" y="127" width="94" height="84" rx="16" fill="none" stroke="#c45568" stroke-width="4"/><rect x="107" y="272" width="309" height="77" rx="14" fill="#d9eafb" stroke="#91a3b3" stroke-width="2"/><text x="261.5" y="317.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Young: E + S + E</text><rect x="480" y="272" width="309" height="77" rx="14" fill="#fff0d2" stroke="#91a3b3" stroke-width="2"/><text x="634.5" y="317.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="bold" fill="#183047">Selected Old: O + O</text><path d="M418 310 L474 310" stroke="#536779" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="403" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="normal" fill="#536779">Live young → Survivor / Old    ·    live Old → other Old</text>
</svg>
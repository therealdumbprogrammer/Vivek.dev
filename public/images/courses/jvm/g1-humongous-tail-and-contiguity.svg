<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Two costs of a humongous object</title><desc id="desc">Tail waste differs from a shortage of adjacent free regions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#72859b"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#25344a}.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#bdcad9;stroke-width:2}.blue{fill:#e8efff;stroke:#5c78b9;stroke-width:2}.mint{fill:#e5f3ef;stroke:#598e84;stroke-width:2}.amber{fill:#fff1db;stroke:#b68a46;stroke-width:2}.rose{fill:#f8e9eb;stroke:#b67b83;stroke-width:2}.line{fill:none;stroke:#72859b;stroke-width:3}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#52647a}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#52647a}@media(prefers-color-scheme:dark){.bg{fill:#182231}.card{fill:#263448;stroke:#52667e}.blue{fill:#243b60;stroke:#7297db}.mint{fill:#213f3d;stroke:#73b1a7}.amber{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#483039;stroke:#d49ba5}text{fill:#edf2fa}.sub,.small{fill:#c3d0df}.line{stroke:#a9b9cd}}</style><rect width="1080" height="510" rx="22" class="bg"/><text x="36" y="51" class="title">Two costs of a humongous object</text><text x="38" y="90" class="sub">2.1 MB object; 2 MB region size</text><rect x="40" y="130" width="1000" height="150" rx="14" class="card"/><text x="60" y="162" class="head">Internal fragmentation: two regions provide 4 MB</text><rect x="65" y="185" width="480" height="65" rx="5" class="blue"/><text x="202" y="224" class="body">2 MB of object</text><rect x="552" y="185" width="55" height="65" rx="5" class="blue"/><text x="557" y="224" class="body">0.1</text><rect x="610" y="185" width="395" height="65" rx="5" class="amber"/><text x="700" y="224" class="body">1.9 MB unavailable tail</text><text x="60" y="323" class="head">Free-region contiguity: enough in total, no adjacent pair</text><rect x="60" y="350" width="115" height="66" rx="6" class="mint"/><text x="88" y="391" class="body">Free</text><rect x="200" y="350" width="115" height="66" rx="6" class="rose"/><text x="228" y="391" class="body">Used</text><rect x="340" y="350" width="115" height="66" rx="6" class="mint"/><text x="368" y="391" class="body">Free</text><rect x="480" y="350" width="115" height="66" rx="6" class="rose"/><text x="508" y="391" class="body">Used</text><rect x="620" y="350" width="115" height="66" rx="6" class="mint"/><text x="648" y="391" class="body">Free</text><rect x="760" y="350" width="115" height="66" rx="6" class="rose"/><text x="788" y="391" class="body">Used</text><rect x="900" y="350" width="115" height="66" rx="6" class="mint"/><text x="928" y="391" class="body">Free</text><text x="60" y="472" class="body">A two-region allocation cannot fit this lower layout.</text></svg>
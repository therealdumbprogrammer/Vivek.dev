<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">One platform thread</title><desc id="desc">A native stack can cross several execution modes.</desc><rect width="900" height="450" fill="#f8fafc"/><text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">One platform thread</text><text x="450" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#29465b">Native stack · current frame at top</text><rect x="220" y="110" width="460" height="54" rx="12" fill="#d9eafb" stroke="#687c8c" stroke-width="2"/><text x="450.0" y="143.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Compiled Java frame</text><rect x="220" y="169" width="460" height="54" rx="12" fill="#e5e3f5" stroke="#687c8c" stroke-width="2"/><text x="450.0" y="202.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Compiled Java frame</text><rect x="220" y="228" width="460" height="54" rx="12" fill="#e8f4e7" stroke="#687c8c" stroke-width="2"/><text x="450.0" y="261.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">Interpreter frame</text><rect x="220" y="287" width="460" height="54" rx="12" fill="#fff0d9" stroke="#687c8c" stroke-width="2"/><text x="450.0" y="320.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#183047">VM / native transition</text><text x="450" y="411" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#29465b">A native stack can cross several execution modes.</text></svg>
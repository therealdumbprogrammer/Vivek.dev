<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc"><title id="title">Rising RSS investigation tree</title><desc id="desc">Checks post-GC heap use, heap commitment and NMT commitment before mapping and native investigation.</desc><rect class="bg" width="1080" height="760" rx="22"/><style>text{font-family:Inter,Arial,sans-serif;fill:#233247}.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#aebed0;stroke-width:2}.teal{fill:#e5f3ef;stroke:#528a80;stroke-width:2}.gold{fill:#fff0d7;stroke:#b8873f;stroke-width:2}.rose{fill:#fde8e5;stroke:#b8776c;stroke-width:2}.muted{fill:#e5eaf1;stroke:#8c9bad;stroke-width:2}.line{stroke:#647b91;stroke-width:3;fill:none}.dashed{stroke:#8294a8;stroke-width:2;stroke-dasharray:8 7;fill:none}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.tiny{font-size:16px}.heapline{stroke:#528a80;stroke-width:6;fill:none}.rssline{stroke:#b8776c;stroke-width:6;fill:none}@media(prefers-color-scheme:dark){text{fill:#edf2fa}.bg{fill:#182231}.box{fill:#263448;stroke:#5b7089}.teal{fill:#24413e;stroke:#83bfb4}.gold{fill:#4b3b2c;stroke:#d7a968}.rose{fill:#493330;stroke:#e0a499}.muted{fill:#2c3a4e;stroke:#8094aa}.line{stroke:#aec1d4}.dashed{stroke:#92a9bf}.heapline{stroke:#83bfb4}.rssline{stroke:#e0a499}}</style><text class="title" x="42" y="60">Investigate rising process RSS</text><rect class="rose" x="350" y="85" width="380" height="58" rx="14"/><text class="head" x="540" y="121" text-anchor="middle">RSS grows</text><path class="line" d="M540 143 L540 170"/><rect class="box" x="340" y="170" width="400" height="66" rx="14"/><text class="head" x="540" y="211" text-anchor="middle">Is post-GC used heap growing?</text><path class="line" d="M340 203 L315 203"/><rect class="teal" x="35" y="170" width="280" height="96" rx="14"/><text class="body" x="54" y="208">Java retention and</text><text class="body" x="54" y="239">allocation / GC</text><text class="small" x="321" y="192">yes</text><path class="line" d="M540 236 L540 285"/><text class="small" x="556" y="265">no</text><rect class="box" x="340" y="285" width="400" height="66" rx="14"/><text class="head" x="540" y="326" text-anchor="middle">Is heap committed growing?</text><path class="line" d="M740 318 L800 318"/><rect class="gold" x="800" y="277" width="245" height="98" rx="14"/><text class="body" x="818" y="315">Heap expansion</text><text class="small" x="818" y="345">and uncommit policy</text><text class="small" x="760" y="306">yes</text><path class="line" d="M540 351 L540 400"/><text class="small" x="556" y="380">no</text><rect class="box" x="340" y="400" width="400" height="66" rx="14"/><text class="head" x="540" y="441" text-anchor="middle">Is NMT committed growing?</text><path class="line" d="M340 433 L315 433"/><rect class="teal" x="35" y="390" width="280" height="105" rx="14"/><text class="body" x="54" y="428">Trace NMT category:</text><text class="small" x="54" y="458">Class / Thread / Code / GC</text><text class="small" x="321" y="421">yes</text><path class="line" d="M540 466 L540 520"/><text class="small" x="556" y="499">no</text><rect class="gold" x="340" y="520" width="400" height="122" rx="14"/><text class="body" x="359" y="556">Inspect mappings and residency</text><text class="body" x="359" y="586">Live native allocations</text><text class="body" x="359" y="616">Allocator reuse / page touch</text><rect class="muted" x="35" y="670" width="1010" height="58" rx="14"/><text class="body" x="56" y="706">Correlate timestamps and cgroup charges; diagnose before tuning Xmx or glibc.</text></svg>
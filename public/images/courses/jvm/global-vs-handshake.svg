<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Global safepoint versus handshake scope</title><desc id="desc">The global path coordinates five threads; the handshake path coordinates only Thread 3.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="600" rx="28" fill="#fffdf9"/><g font-family="system-ui,sans-serif"><text x="250" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">Global safepoint</text><text x="710" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">Thread-local handshake</text><path d="M480 85V545" stroke="#d6d3d1" stroke-width="3" stroke-dasharray="9 10"/>
<g font-size="18" text-anchor="middle"><g fill="#eef4ff" stroke="#4f6f9f" stroke-width="2"><rect x="55" y="105" width="125" height="48" rx="12"/><rect x="55" y="170" width="125" height="48" rx="12"/><rect x="55" y="235" width="125" height="48" rx="12"/><rect x="55" y="300" width="125" height="48" rx="12"/><rect x="55" y="365" width="125" height="48" rx="12"/></g><g fill="#172033"><text x="118" y="135">Thread 1</text><text x="118" y="200">Thread 2</text><text x="118" y="265">Thread 3</text><text x="118" y="330">Thread 4</text><text x="118" y="395">Thread 5</text></g><rect x="290" y="210" width="150" height="115" rx="18" fill="#fff3d6" stroke="#bd7a28" stroke-width="3"/><text x="365" y="253" font-weight="700" fill="#7a4614">All accounted</text><text x="365" y="284" fill="#54391d">global state</text><rect x="175" y="455" width="245" height="72" rx="16" fill="#f3eefe" stroke="#7555a7" stroke-width="3"/><text x="298" y="499" font-weight="700" fill="#4d3475">Global VM operation</text>
<g fill="#eef4ff" stroke="#4f6f9f" stroke-width="2"><rect x="530" y="105" width="140" height="48" rx="12"/><rect x="530" y="170" width="140" height="48" rx="12"/><rect x="530" y="235" width="140" height="48" rx="12"/><rect x="530" y="300" width="140" height="48" rx="12"/><rect x="530" y="365" width="140" height="48" rx="12"/></g><g fill="#172033"><text x="600" y="135">Thread 1 runs</text><text x="600" y="200">Thread 2 runs</text><text x="600" y="265" font-weight="700">Thread 3</text><text x="600" y="330">Thread 4 runs</text><text x="600" y="395">Thread 5 runs</text></g><rect x="755" y="220" width="160" height="92" rx="18" fill="#e6f5ee" stroke="#328361" stroke-width="3"/><text x="835" y="258" font-weight="700" fill="#185b42">Callback</text><text x="835" y="287" fill="#244c3d">for Thread 3</text></g></g>

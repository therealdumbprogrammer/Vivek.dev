<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="title desc"><title id="title">CHECK FOR A BYPASS</title><desc id="desc">CHECK FOR A BYPASS. Arrows indicate strong references; root labels represent reference starting points.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#315dcc"/></marker></defs><rect width="480" height="620" rx="24" fill="#f7f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="35" font-size="19" fill="#334155">CHECK FOR A BYPASS</text><text x="24" y="79" font-size="19" fill="#334155">1 · Every path passes through A</text><text x="26" y="140" font-size="18" fill="#334155">Root reference</text><path d="M160 133 L197 133" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="212" y="108" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="226" y="139" font-size="19" fill="#334155">A</text><path d="M278 132 L311 132" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="108" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="139" font-size="19" fill="#334155">B</text><path d="M352 159 L352 203" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="216" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="247" font-size="19" fill="#334155">C</text><text x="24" y="295" font-size="18" fill="#334155">A retains A + B + C</text><text x="24" y="345" font-size="19" fill="#334155">2 · Another root reaches B</text><text x="26" y="400" font-size="18" fill="#334155">Root reference</text><path d="M160 393 L197 393" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="212" y="368" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="226" y="399" font-size="19" fill="#334155">A</text><path d="M278 392 L311 392" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="368" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="399" font-size="19" fill="#334155">B</text><path d="M352 419 L352 463" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="321" y="476" width="65" height="48" rx="10" fill="#fff" stroke="#315dcc" stroke-width="2"/><text x="335" y="507" font-size="19" fill="#334155">C</text><text x="24" y="462" font-size="16" fill="#334155">Other root</text><path d="M122 456 L185 456 L185 505 L300 505 L300 403 L317 403" fill="none" stroke="#315dcc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="24" y="573" font-size="18" fill="#334155">Without A, B still reaches C.</text><text x="24" y="600" font-size="17" fill="#334155">A retains only itself in this graph.</text></g></svg>
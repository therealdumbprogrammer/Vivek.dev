<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Bookkeeping beside a reference store</title><desc id="desc">Mutator-side write barrier records a changed source area for later GC.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#527aa6"/></marker></defs>
<rect width="900" height="450" rx="22" fill="#f8fafc"/>
<text x="30" y="51" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#19324d">Bookkeeping beside a reference store</text>
<path d="M230 195 L315 195" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="272.5" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">writes</text>
<path d="M540 195 L630 195" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="585" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">barrier</text>
<path d="M740 245 L740 300" fill="none" stroke="#527aa6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="263.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#52657a">later</text>
<rect x="50" y="145" width="180" height="100" rx="13" fill="#ffffff" stroke="#b7c7d5" stroke-width="2"/>
<text x="140" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Mutator</text>
<rect x="315" y="145" width="225" height="100" rx="13" fill="#e8f1fb" stroke="#8eaecb" stroke-width="2"/>
<text x="427.5" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Reference store</text>
<rect x="630" y="145" width="220" height="100" rx="13" fill="#e5f5ef" stroke="#91baa9" stroke-width="2"/>
<text x="740" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#19324d">Card bookkeeping</text>
